[package]
name = "payloads"
version = "0.0.0"
edition = "2024"
publish = false

# m5-02 (#68): the same tile content in three payloads, byte counts only.
[dependencies]
everygraph-map = { path = "../../../crates/everygraph-map" }
mlt-core = "=0.24.0"
arrow-array = { version = "58.4", default-features = false }
arrow-ipc = { version = "58.4", default-features = false }
arrow-schema = { version = "58.4", default-features = false }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
rayon = "1.10"

[workspace]

[profile.release]
debug = false
