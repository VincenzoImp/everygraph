[package]
name = "m102"
version = "0.0.1"
edition = "2021"
description = "Experiment #16 (m1-02): out-of-core Leiden with sequential aggregation and a spilled level-1 graph"
publish = false

# Standalone research package: not a member of the product workspace at the repository root.
[workspace]

[[bin]]
name = "m102"
path = "src/main.rs"

[dependencies]
rayon = "1"
memmap2 = "0.9"
libc = "0.2"
serde_json = "1"
# The memory-accountant interface of the product (DESIGN D11, issue #31 implements it);
# this lab implements a stub of it (src/acct.rs).
everygraph-core = { path = "../../crates/everygraph-core" }

# Same profile as lab/m1-13-compressed (the in-RAM baseline of this experiment).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1
