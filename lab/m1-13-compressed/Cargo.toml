[package]
name = "m113"
version = "0.0.1"
edition = "2021"
description = "Experiment #118 (m1-13): kernels, Leiden and point queries on compressed adjacency"
publish = false

[[bin]]
name = "m113"
path = "src/main.rs"

[dependencies]
rayon = "1"
memmap2 = "0.9"
libc = "0.2"
serde_json = "1"
rustc-hash = "2"

# Same profile as lab/b1-core (the kernel baseline): fat LTO, one codegen unit, panic=abort.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1
