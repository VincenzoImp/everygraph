[package]
name = "gmap"
version = "0.1.0"
edition = "2021"

# Standalone research package: not a member of the product workspace at the repository root.
[workspace]

[dependencies]
rayon = "1"
rustc-hash = "2"
serde_json = "1"
flate2 = "1"
memmap2 = "0.9"

[profile.release]
opt-level = 3
debug = false
panic = "abort"
