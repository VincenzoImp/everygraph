<!doctype html>
<html><head><meta charset="utf-8"><title>glab graph map</title>
<style>
html,body{margin:0;height:100%;background:#090a10;color:#dde;font:13px/1.35 system-ui,sans-serif;overflow:hidden}
#gl,#ov{position:absolute;left:0;top:0;width:100%;height:100%}
#ov{pointer-events:none}
#hud{position:absolute;left:10px;top:10px;background:#12141ccc;border:1px solid #333a;border-radius:6px;padding:8px 10px;min-width:250px}
#hud b{color:#fff} #hud input{background:#1b1e2a;border:1px solid #445;color:#fff;padding:3px 6px;border-radius:4px;width:120px}
#hud button{background:#2a3350;border:1px solid #556;color:#fff;padding:3px 8px;border-radius:4px;cursor:pointer}
#tip{position:absolute;display:none;background:#181b26f0;border:1px solid #667;border-radius:6px;padding:6px 9px;pointer-events:none;white-space:pre;font:12px/1.4 ui-monospace,monospace}
.dim{color:#99a}
</style></head><body>
<canvas id="gl"></canvas><canvas id="ov"></canvas>
<div id="hud"><b id="title">graph map</b><br>
<span id="stat" class="dim"></span><br>
<span id="tile" class="dim"></span><br>
<input id="q" placeholder="node id"> <button id="go">fly to</button> <span id="sres" class="dim"></span></div>
<div id="tip"></div>
<script src="viewer.js"></script>
</body></html>
