# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# The allocation rule of the kernel crates (issue #31, DESIGN D11): every large buffer
# is reserved against the memory budget before it is allocated, so it is allocated
# through `everygraph_core::SegVec`, `ScratchPool` or next to a `Reservation`, never
# sized directly. The same list is in the `clippy.toml` of everygraph-kernels,
# everygraph-community, everygraph-map and everygraph-query; keep the four identical
# (`tools/check_portability_canary.py` probes each of them with `kernel_allocation`).
# The crate roots forbid the lint, so no inner `#[allow]` can switch it off.
#
# What it does not catch: growth through `push`, `extend`, `collect` and `clone`, which
# a lint cannot tell apart from small vectors. What catches those is a counting global
# allocator in the kernel tests, asserting heap bytes <= `Budget::used()` + a fixed
# slack (issue #53).
#
# When one of these crates starts to use the core it also takes the core's portability
# lists (CONTRIBUTING.md, "Crates"): merge them into this file.

