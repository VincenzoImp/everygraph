#
# The allocation rule of the kernel crates (issue #31, DESIGN D11): every large buffer
# is reserved against the memory budget before it is allocated, so it is allocated
# through `everygraph_core::SegVec`, `ScratchPool` or next to a `Reservation`, never
# sized directly. The same list is in the `clippy.toml` of everygraph-kernels,
# everygraph-community, everygraph-map and everygraph-query; keep the four identical
# (`tools/check_portability_canary.py` probes each of them with `kernel_allocation`).
# The crate roots forbid the lint, so no inner `#[allow]` can switch it off.
#
# What it does not catch: growth through `push`, `extend` or `collect`, which a lint
# cannot tell apart from small vectors. Reviews look for those; the no-OOM tests
# (issue #53) measure what was missed.
#
# When one of these crates starts to use the core it also takes the core's portability
# lists (CONTRIBUTING.md, "Crates"): merge them into this file.

disallowed-methods = [
    { path = "std::vec::Vec::with_capacity", reason = "size large buffers through the memory budget: `SegVec::try_with_len` or `SegVec::try_reserve` (issue #31)" },
    { path = "std::vec::Vec::reserve", reason = "growth must be reserved against the memory budget: `SegVec::try_reserve`" },
    { path = "std::vec::Vec::reserve_exact", reason = "growth must be reserved against the memory budget: `SegVec::try_reserve`" },
    { path = "std::vec::Vec::try_reserve", reason = "fallible, but not counted: `SegVec::try_reserve` reserves against the memory budget" },
    { path = "std::vec::Vec::try_reserve_exact", reason = "fallible, but not counted: `SegVec::try_reserve` reserves against the memory budget" },
    { path = "std::vec::Vec::resize", reason = "growth must be reserved against the memory budget: `SegVec::try_resize`" },
    { path = "std::vec::Vec::resize_with", reason = "growth must be reserved against the memory budget: `SegVec::try_resize`" },
    { path = "std::vec::from_elem", reason = "`vec![value; n]` sizes a buffer outside the memory budget: `SegVec::try_with_len`" },
    { path = "std::boxed::Box::new_uninit_slice", reason = "size large buffers through the memory budget: `SegVec`" },
    { path = "std::collections::HashMap::with_capacity", reason = "size hash tables through the memory budget: a `Reservation` of their size next to them, or a `ScratchPool`" },
    { path = "std::collections::HashMap::with_capacity_and_hasher", reason = "size hash tables through the memory budget: a `Reservation` of their size next to them, or a `ScratchPool`" },
    { path = "std::collections::HashMap::reserve", reason = "size hash tables through the memory budget: a `Reservation` of their size next to them" },
    { path = "std::collections::HashSet::with_capacity", reason = "size hash sets through the memory budget: a `Reservation` of their size next to them" },
    { path = "std::collections::HashSet::reserve", reason = "size hash sets through the memory budget: a `Reservation` of their size next to them" },
    { path = "std::collections::VecDeque::with_capacity", reason = "size queues through the memory budget: a `SegVec` used as a ring, or a `Reservation`" },
    { path = "std::collections::VecDeque::reserve", reason = "size queues through the memory budget: a `SegVec` used as a ring, or a `Reservation`" },
]
