# SPDX-License-Identifier: Apache-2.0 OR MIT

[package]
name = "everygraph-oracle"
description = "Correctness oracle of Everygraph: graph generators, reference kernels, comparators, invariant checkers and the plug-in trait every kernel is tested through. A development crate; never shipped."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# A test tool: it is never published, whatever the workspace default becomes.
publish = false

[dependencies]
# Strategies are part of the public API (other crates' tests build on them), so proptest
# is a normal dependency of this development crate, not a dev-dependency.
proptest = { version = "1.7", default-features = false, features = ["std"] }
# The golden-file check reads the registry's gzip files and compares per-node arrays by
# SHA-256 (sha2 is the hash everygraph-bench pins datasets with). flate2's default
# backend is miniz_oxide: pure Rust.
flate2 = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip"] }
# The power-law generator's weights: the same pinned version as everygraph-core's
# `math`, so that a generated graph is the same on every platform.
libm = { version = "=0.2.16", default-features = false }

[lints]
workspace = true
