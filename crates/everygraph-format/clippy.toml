    # Other OS services.
    { path = "std::process::Command", reason = "no processes in everygraph-format" },
    { path = "std::process::Child", reason = "no processes in everygraph-format" },
    { path = "std::net::TcpStream", reason = "no sockets in everygraph-format: remote data arrives through `ByteSource`" },
    { path = "std::net::TcpListener", reason = "no sockets in everygraph-format" },
    { path = "std::net::UdpSocket", reason = "no sockets in everygraph-format" },
    { path = "std::io::Stdin", reason = "no standard streams in everygraph-format" },
    { path = "std::io::Stdout", reason = "no standard streams in everygraph-format" },
    { path = "std::io::Stderr", reason = "no standard streams in everygraph-format" },
]

