    # Numerics (DESIGN D14; rules R2 and R9 of docs/research/sota-numerics.md).
    # `allow-invalid`: the path is in a crate that may not be a dependency.
    { path = "rand::rngs::StdRng", reason = "not reproducible across threads, versions or platforms: use `everygraph_core::rng` (rule R9)", allow-invalid = true },
    { path = "rand::rngs::SmallRng", reason = "not reproducible across threads, versions or platforms: use `everygraph_core::rng` (rule R9)", allow-invalid = true },
