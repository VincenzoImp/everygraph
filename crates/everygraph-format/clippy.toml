# A library returns data and errors; it does not print. The workspace already warns on
# these through `print_stdout`, `print_stderr` and `dbg_macro`; here they cannot be
# allowed.
disallowed-macros = [
    { path = "std::print", reason = "no standard streams in everygraph-format" },
    { path = "std::println", reason = "no standard streams in everygraph-format" },
    { path = "std::eprint", reason = "no standard streams in everygraph-format" },
    { path = "std::eprintln", reason = "no standard streams in everygraph-format" },
    { path = "std::dbg", reason = "no standard streams in everygraph-format" },
]

# Words of the format documentation that are names, not code.
doc-valid-idents = ["VByte", "AArch64", "FlatBuffers", "FlatBuffer", ".."]
