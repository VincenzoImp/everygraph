# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Fuzz targets of the format crate: the adjacency decoder (issue #30), the container
# (issue #191), the column reader (issue #37) and the check of a stored community
# hierarchy (issue #62, `everygraph-community`, which `verify --deep` runs). Not a member of the workspace: it needs
# nightly and libFuzzer. Run tools/fuzz.sh (CONTRIBUTING.md, "Fuzzing"), or cargo
# +nightly fuzz run TARGET from this crate's directory, crates/everygraph-format.
# Corpora are in corpus/TARGET.

[package]
name = "everygraph-format-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
everygraph-core = { path = "../../everygraph-core", default-features = false }
everygraph-format = { path = ".." }
everygraph-community = { path = "../../everygraph-community" }
everygraph-kernels = { path = "../../everygraph-kernels" }

# Its own workspace, so that the product workspace never builds it.
[workspace]
members = ["."]

[[bin]]
name = "adjacency"
path = "fuzz_targets/adjacency.rs"
test = false
doc = false
bench = false

[[bin]]
name = "container"
path = "fuzz_targets/container.rs"
test = false
doc = false
bench = false

[[bin]]
name = "columns"
path = "fuzz_targets/columns.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hierarchy"
path = "fuzz_targets/hierarchy.rs"
test = false
doc = false
bench = false
