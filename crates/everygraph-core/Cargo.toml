# SPDX-License-Identifier: Apache-2.0 OR MIT

[package]
name = "everygraph-core"
description = "Portable foundations of Everygraph: id types, the ByteSource trait, the parallel facade, the memory accountant, segmented arrays, and portable numerics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["parallel"]
# Run the `par` facade on rayon's thread pool. Without it the same functions run on the
# calling thread, with the same chunk boundaries and the same results.
parallel = ["dep:rayon"]

[dependencies]
# Adding a dependency here is a portability decision: it must not touch files, threads
# or the OS on its own, and no build or lint can tell. It, and everything it pulls in,
# must be added to the allow-list in tools/check_core_portability.py (CONTRIBUTING.md,
# "The portability rule").
rayon = { workspace = true, optional = true }
# The transcendentals of `math`. Pinned exactly: another version may return other bits
# (docs/research/sota-numerics.md, rule R14). Without the `arch` feature it has one
# code path, in Rust, for every target.
libm = { version = "=0.2.16", default-features = false }

[dev-dependencies]
# The oracle for `ExactSum`: Neal's exact summation, written independently.
xsum = "0.1.6"

[lints]
workspace = true
