#
# The portability rule of everygraph-core (DESIGN D2, FINDINGS § G), as a lint.
#
# Clippy reads the `clippy.toml` closest to the crate it is checking, so these lists
# apply to this crate only. The lints are set to `deny` in the workspace `Cargo.toml`.
#
# Everything listed here compiles for wasm32-unknown-unknown and then fails or panics
# when called, so the wasm32 build alone would not catch it. What does not compile there
# (`std::os::*`, crates that need an OS) is caught by that build instead.
#
# Clippy can disallow items, not modules: when `std` grows a new function in one of
# these modules, add it here.

disallowed-types = [
    # std::fs — files belong behind `ByteSource`, in everygraph-io.
    { path = "std::fs::File", reason = "no file system in everygraph-core: read through `ByteSource`; file backends live in everygraph-io" },
    { path = "std::fs::OpenOptions", reason = "no file system in everygraph-core: read through `ByteSource`; file backends live in everygraph-io" },
    { path = "std::fs::DirBuilder", reason = "no file system in everygraph-core" },
    { path = "std::fs::ReadDir", reason = "no file system in everygraph-core" },
    { path = "std::fs::DirEntry", reason = "no file system in everygraph-core" },
    { path = "std::fs::Metadata", reason = "no file system in everygraph-core" },
    { path = "std::fs::Permissions", reason = "no file system in everygraph-core" },
    { path = "std::fs::FileType", reason = "no file system in everygraph-core" },
    { path = "std::fs::FileTimes", reason = "no file system in everygraph-core" },

    # std::thread — threads belong behind `everygraph_core::par`.
    { path = "std::thread::Builder", reason = "no OS threads in everygraph-core: split work with `everygraph_core::par`" },
    { path = "std::thread::JoinHandle", reason = "no OS threads in everygraph-core: split work with `everygraph_core::par`" },
    { path = "std::thread::Scope", reason = "no OS threads in everygraph-core: split work with `everygraph_core::par`" },
    { path = "std::thread::ScopedJoinHandle", reason = "no OS threads in everygraph-core: split work with `everygraph_core::par`" },
    { path = "std::thread::Thread", reason = "no OS threads in everygraph-core: split work with `everygraph_core::par`" },
    { path = "std::thread::ThreadId", reason = "no OS threads in everygraph-core: results must not depend on which thread ran" },

    # Other OS services.
    { path = "std::process::Command", reason = "no processes in everygraph-core" },
    { path = "std::process::Child", reason = "no processes in everygraph-core" },
    { path = "std::net::TcpStream", reason = "no sockets in everygraph-core: remote data arrives through `ByteSource`" },
    { path = "std::net::TcpListener", reason = "no sockets in everygraph-core" },
    { path = "std::net::UdpSocket", reason = "no sockets in everygraph-core" },
]

disallowed-methods = [
    # std::fs
    { path = "std::fs::canonicalize", reason = "no file system in everygraph-core" },
    { path = "std::fs::copy", reason = "no file system in everygraph-core" },
    { path = "std::fs::create_dir", reason = "no file system in everygraph-core" },
    { path = "std::fs::create_dir_all", reason = "no file system in everygraph-core" },
    { path = "std::fs::exists", reason = "no file system in everygraph-core" },
    { path = "std::fs::hard_link", reason = "no file system in everygraph-core" },
    { path = "std::fs::metadata", reason = "no file system in everygraph-core" },
    { path = "std::fs::read", reason = "no file system in everygraph-core: read through `ByteSource`; file backends live in everygraph-io" },
    { path = "std::fs::read_dir", reason = "no file system in everygraph-core" },
    { path = "std::fs::read_link", reason = "no file system in everygraph-core" },
    { path = "std::fs::read_to_string", reason = "no file system in everygraph-core: read through `ByteSource`; file backends live in everygraph-io" },
    { path = "std::fs::remove_dir", reason = "no file system in everygraph-core" },
    { path = "std::fs::remove_dir_all", reason = "no file system in everygraph-core" },
    { path = "std::fs::remove_file", reason = "no file system in everygraph-core" },
    { path = "std::fs::rename", reason = "no file system in everygraph-core" },
    { path = "std::fs::set_permissions", reason = "no file system in everygraph-core" },
    { path = "std::fs::soft_link", reason = "no file system in everygraph-core" },
    { path = "std::fs::symlink_metadata", reason = "no file system in everygraph-core" },
    { path = "std::fs::write", reason = "no file system in everygraph-core" },

    # std::thread
    { path = "std::thread::spawn", reason = "no OS threads in everygraph-core: split work with `everygraph_core::par`" },
    { path = "std::thread::scope", reason = "no OS threads in everygraph-core: split work with `everygraph_core::par`" },
    { path = "std::thread::sleep", reason = "no OS threads in everygraph-core: blocking the thread is not possible on a browser's main thread" },
    { path = "std::thread::park", reason = "no OS threads in everygraph-core" },
    { path = "std::thread::park_timeout", reason = "no OS threads in everygraph-core" },
    { path = "std::thread::yield_now", reason = "no OS threads in everygraph-core" },
    { path = "std::thread::current", reason = "no OS threads in everygraph-core: results must not depend on which thread ran" },
    { path = "std::thread::available_parallelism", reason = "use `everygraph_core::par::current_num_threads`; the thread count is the caller's decision" },

    # Clock: both panic on wasm32-unknown-unknown.
    { path = "std::time::Instant::now", reason = "no clock in everygraph-core (panics on wasm32-unknown-unknown): timing is the caller's job" },
    { path = "std::time::SystemTime::now", reason = "no clock in everygraph-core (panics on wasm32-unknown-unknown): timing is the caller's job" },

    # Environment and process.
    { path = "std::env::args", reason = "no process environment in everygraph-core: configuration is passed in" },
    { path = "std::env::args_os", reason = "no process environment in everygraph-core: configuration is passed in" },
    { path = "std::env::var", reason = "no process environment in everygraph-core: configuration is passed in" },
    { path = "std::env::var_os", reason = "no process environment in everygraph-core: configuration is passed in" },
    { path = "std::env::vars", reason = "no process environment in everygraph-core: configuration is passed in" },
    { path = "std::env::vars_os", reason = "no process environment in everygraph-core: configuration is passed in" },
    { path = "std::env::set_var", reason = "no process environment in everygraph-core" },
    { path = "std::env::remove_var", reason = "no process environment in everygraph-core" },
    { path = "std::env::current_dir", reason = "no process environment in everygraph-core" },
    { path = "std::env::set_current_dir", reason = "no process environment in everygraph-core" },
    { path = "std::env::current_exe", reason = "no process environment in everygraph-core" },
    { path = "std::env::temp_dir", reason = "no file system in everygraph-core: scratch space is the caller's decision" },
    { path = "std::env::home_dir", reason = "no process environment in everygraph-core" },
    { path = "std::process::exit", reason = "a library does not end the process: return an error" },
    { path = "std::process::abort", reason = "a library does not end the process: return an error" },
    { path = "std::process::id", reason = "no processes in everygraph-core" },

    # Standard streams: a library returns data and errors, it does not print.
    { path = "std::io::stdin", reason = "no standard streams in everygraph-core" },
    { path = "std::io::stdout", reason = "no standard streams in everygraph-core" },
    { path = "std::io::stderr", reason = "no standard streams in everygraph-core" },
]
