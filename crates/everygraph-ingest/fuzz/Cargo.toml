# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Fuzz target of the text reader (issue #191). Not a member of the workspace: it needs
# nightly and libFuzzer. Run tools/fuzz.sh (CONTRIBUTING.md, "Fuzzing"), or
# cargo +nightly fuzz run text from this crate's directory, crates/everygraph-ingest.
# The corpus is in corpus/text.

[package]
name = "everygraph-ingest-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
everygraph-core = { path = "../../everygraph-core", default-features = false }
everygraph-ingest = { path = ".." }
# To wrap the input in a gzip member, with the backend the reader uses.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }

# Its own workspace, so that the product workspace never builds it.
[workspace]
members = ["."]

[[bin]]
name = "text"
path = "fuzz_targets/text.rs"
test = false
doc = false
bench = false
