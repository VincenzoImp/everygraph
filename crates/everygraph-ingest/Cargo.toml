# SPDX-License-Identifier: Apache-2.0 OR MIT

[package]
name = "everygraph-ingest"
description = "Ingest for Everygraph: edge-list and Parquet readers, the id dictionary and the graph build pipeline."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
everygraph-core = { path = "../everygraph-core", default-features = false }
# gzip through zlib-rs, a pure-Rust zlib: no C (DESIGN D1), it builds for wasm32, and it
# is the inflate the lab measured (FINDINGS § B1).
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
# A zstd decoder in pure Rust; the `zstd` crate wraps the C library. 0.9.1 or later:
# earlier releases can be made to allocate gigabytes by a small input (RUSTSEC-2026-0344).
ruzstd = { version = "0.9.1", default-features = false, features = ["std", "hash"] }

[dev-dependencies]
# The tests and the throughput example run the parallel facade on threads.
everygraph-core = { path = "../everygraph-core", features = ["parallel"] }

[lints]
workspace = true
