[package]
name = "everygraph-ingest"
description = "Ingest for Everygraph: edge-list and Parquet readers, the id dictionary and the graph build pipeline."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
everygraph-core = { path = "../everygraph-core", default-features = false }
# XXH3-128 is the hash of every identifier (module `ids`). It is a specified algorithm
# with implementations in every common language, so the dictionary's on-disk form can
# be read without this crate. Pure Rust, no dependencies, builds for wasm32.
xxhash-rust = { version = "0.8.21", default-features = false, features = ["xxh3"] }

[dev-dependencies]
# Threads in the tests, so that thread-count independence is exercised.
everygraph-core = { path = "../everygraph-core", features = ["parallel"] }
proptest = { version = "1.7", default-features = false, features = ["std"] }

# The benchmark example evicts its scratch files from the page cache for cold look-ups.
[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }

[lints]
workspace = true
