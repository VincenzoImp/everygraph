# SPDX-License-Identifier: Apache-2.0 OR MIT

[package]
name = "everygraph-bench"
description = "The benchmark harness of Everygraph."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "everygraph_bench"
path = "src/lib.rs"

[[bin]]
name = "everygraph-bench"
path = "src/main.rs"

[dependencies]
# Hashes: SHA-256 is what the registry pins; MD5 only checks the sums a source publishes
# (LAW does), so that a first download can be compared with the source's own record.
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "1"
# A blocking HTTP client. TLS through rustls with the ring provider and the operating
# system's certificate store, loaded by rustls-native-certs. Both of ureq's built-in
# choices of roots (`rustls`, `platform-verifier`) pull in webpki-roots or
# webpki-root-certs, whose licence (CDLA-Permissive-2.0) is not on the deny.toml list.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider"] }
# The command line. Without default features: no colours (anstream and four more
# crates) and no "did you mean" (strsim); help, usage and error context stay. Six crates
# in all, against one for lexopt, for a --help that cannot drift from the parser.
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
# Result rows are JSON lines; metrics are read from commands' JSON output.
serde_json = "1"
# Metrics read from text output; no Unicode tables, no dependencies.
regex-lite = "0.1"

[lints]
workspace = true

# flock, posix_fadvise, sync and kill through safe wrappers, so that the crate keeps
# forbidding `unsafe`. Linux only: the harness needs cgroups v2 and systemd-run.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "process"] }
