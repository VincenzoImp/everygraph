[package]
name = "everygraph-cli"
description = "The everygraph command."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "everygraph"
path = "src/main.rs"

[dependencies]
# The binary decides that threads exist: the core's `parallel` feature (its default).
everygraph-core = { path = "../everygraph-core" }
everygraph-format = { path = "../everygraph-format" }
everygraph-ingest = { path = "../everygraph-ingest" }
everygraph-io = { path = "../everygraph-io" }

[lints]
workspace = true
