[package]
name = "everygraph-cli"
description = "The everygraph command."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "everygraph"
path = "src/main.rs"

[dependencies]
everygraph-core = { path = "../everygraph-core" }
everygraph-format = { path = "../everygraph-format" }
everygraph-ingest = { path = "../everygraph-ingest" }
everygraph-io = { path = "../everygraph-io" }

[dev-dependencies]
everygraph-format = { path = "../everygraph-format" }
everygraph-io = { path = "../everygraph-io" }
# The tests write a gzip input and parse the JSON documents of the command.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
serde_json = "1"

[lints]
workspace = true
