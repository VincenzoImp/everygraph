# SPDX-License-Identifier: Apache-2.0 OR MIT

[package]
name = "everygraph-io"
description = "Native I/O backends for Everygraph: files, memory maps and direct I/O behind the ByteSource trait."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
everygraph-core = { path = "../everygraph-core", default-features = false }
# Memory maps (D11: mmap warm is the only in-RAM mode). The one crate allowed to map
# files (deny.toml).
memmap2 = "0.9"

[features]
# `everygraph_io::faults`: a source and sink that fail the k-th operation, for the
# fault-injection tests of other crates (issue #190). Never enabled by a shipped crate.
faults = []

[target.'cfg(unix)'.dependencies]
# `O_DIRECT`, `fallocate`, `posix_fadvise`, `F_NOCACHE`: what std does not expose.
# Used in `src/sys.rs` only.
libc = "0.2"

[dev-dependencies]
# The container's crash test with a real `kill -9` lives here, where processes and
# files are allowed (tests/container.rs).
everygraph-format = { path = "../everygraph-format" }
# Its fixed random generator, for deterministic section contents (tests/support).
everygraph-oracle = { path = "../everygraph-oracle" }

[lints]
workspace = true
