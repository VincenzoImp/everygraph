# SPDX-License-Identifier: Apache-2.0 OR MIT

[package]
name = "everygraph-io"
description = "Native I/O backends for Everygraph: files, memory maps and direct I/O behind the ByteSource trait."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
everygraph-core = { path = "../everygraph-core", default-features = false }
# Memory maps (D11: mmap warm is the only in-RAM mode). The one crate allowed to map
# files (deny.toml).
memmap2 = "0.9"
# `everygraph_io::table` (feature `tables`): result tables as Parquet and Arrow IPC files,
# the formats the plan reads and writes through arrow-rs (#33, #85). No compression codec
# is built in.
arrow-array = { version = "58.4", default-features = false, optional = true }
arrow-ipc = { version = "58.4", default-features = false, optional = true }
arrow-schema = { version = "58.4", default-features = false, optional = true }
parquet = { version = "58.4", default-features = false, features = ["arrow"], optional = true }

[features]
# `everygraph_io::faults`: a source and sink that fail the k-th operation, for the
# fault-injection tests of other crates (issue #190). Never enabled by a shipped crate.
faults = []
# `everygraph_io::table`: tables written as Parquet, Arrow IPC, CSV or JSON files.
tables = ["dep:arrow-array", "dep:arrow-ipc", "dep:arrow-schema", "dep:parquet"]

[target.'cfg(unix)'.dependencies]
# `O_DIRECT`, `fallocate`, `posix_fadvise`, `F_NOCACHE`: what std does not expose.
# Used in `src/sys.rs` only.
libc = "0.2"

# The type of a file system (`statfs`), safely: is scratch held in memory?
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
# The container's crash test with a real `kill -9` lives here, where processes and
# files are allowed (tests/container.rs).
everygraph-format = { path = "../everygraph-format" }
# Its fixed random generator, for deterministic section contents (tests/support).
everygraph-oracle = { path = "../everygraph-oracle" }

[lints]
workspace = true
