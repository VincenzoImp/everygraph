# SPDX-License-Identifier: Apache-2.0 OR MIT

[package]
name = "everygraph-community"
description = "Community detection for Everygraph: deterministic parallel Leiden and the map hierarchy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# A library does not decide whether threads exist (CONTRIBUTING.md, "Crates").
everygraph-core = { path = "../everygraph-core", default-features = false }
everygraph-format = { path = "../everygraph-format" }
everygraph-kernels = { path = "../everygraph-kernels" }

[dev-dependencies]
# Tests and the benchmark run on threads (`par::with_threads`).
everygraph-core = { path = "../everygraph-core" }
# The fault-injecting sink of the error-path sweep (tests/hierarchy.rs).
everygraph-io = { path = "../everygraph-io", features = ["faults"] }
everygraph-oracle = { path = "../everygraph-oracle" }
serde_json = "1"

[lints]
workspace = true
