#
# The allocation rule of the kernel crates (issue #31, DESIGN D11): every large buffer
# is reserved against the memory budget before it is allocated, so it is allocated
# through `everygraph_core::SegVec`, `ScratchPool` or next to a `Reservation`, never
# sized directly. The same list is in the `clippy.toml` of everygraph-kernels,
# everygraph-community, everygraph-map and everygraph-query; keep the four identical
# (`tools/check_portability_canary.py` probes each of them with `kernel_allocation`).
# The crate roots forbid the lint, so no inner `#[allow]` can switch it off.
#
# What it does not catch: growth through `push`, `extend`, `collect` and `clone`, which
# a lint cannot tell apart from small vectors. What catches those is a counting global
# allocator in the kernel tests, asserting heap bytes <= `Budget::used()` + a fixed
# slack (issue #53).
#
# everygraph-kernels uses the core, so it also takes the core's portability lists
# (CONTRIBUTING.md, "Crates"), copied from crates/everygraph-core/clippy.toml with the
# crate name changed: the kernels run in the browser too. Keep them equal to the core's.


disallowed-types = [
    # std::fs — files belong behind `ByteSource`, in everygraph-io.
    { path = "std::fs::File", reason = "no file system in everygraph-kernels: read through `ByteSource`; file backends live in everygraph-io" },
    { path = "std::fs::OpenOptions", reason = "no file system in everygraph-kernels: read through `ByteSource`; file backends live in everygraph-io" },
    { path = "std::fs::DirBuilder", reason = "no file system in everygraph-kernels" },
    { path = "std::fs::ReadDir", reason = "no file system in everygraph-kernels" },
    { path = "std::fs::DirEntry", reason = "no file system in everygraph-kernels" },
    { path = "std::fs::Metadata", reason = "no file system in everygraph-kernels" },
    { path = "std::fs::Permissions", reason = "no file system in everygraph-kernels" },
    { path = "std::fs::FileType", reason = "no file system in everygraph-kernels" },
    { path = "std::fs::FileTimes", reason = "no file system in everygraph-kernels" },
    { path = "std::fs::TryLockError", reason = "no file system in everygraph-kernels" },

    # std::thread — threads belong behind `everygraph_core::par`.
    { path = "std::thread::Builder", reason = "no OS threads in everygraph-kernels: split work with `everygraph_core::par`" },
    { path = "std::thread::JoinHandle", reason = "no OS threads in everygraph-kernels: split work with `everygraph_core::par`" },
    { path = "std::thread::Scope", reason = "no OS threads in everygraph-kernels: split work with `everygraph_core::par`" },
    { path = "std::thread::ScopedJoinHandle", reason = "no OS threads in everygraph-kernels: split work with `everygraph_core::par`" },
    { path = "std::thread::Thread", reason = "no OS threads in everygraph-kernels: split work with `everygraph_core::par`" },
    { path = "std::thread::ThreadId", reason = "no OS threads in everygraph-kernels: results must not depend on which thread ran" },

    # Other OS services.
    { path = "std::process::Command", reason = "no processes in everygraph-kernels" },
    { path = "std::process::Child", reason = "no processes in everygraph-kernels" },
    { path = "std::net::TcpStream", reason = "no sockets in everygraph-kernels: remote data arrives through `ByteSource`" },
    { path = "std::net::TcpListener", reason = "no sockets in everygraph-kernels" },
    { path = "std::net::UdpSocket", reason = "no sockets in everygraph-kernels" },
    { path = "std::io::Stdin", reason = "no standard streams in everygraph-kernels" },
    { path = "std::io::Stdout", reason = "no standard streams in everygraph-kernels" },
    { path = "std::io::Stderr", reason = "no standard streams in everygraph-kernels" },
]

disallowed-methods = [
    # std::fs
    { path = "std::fs::canonicalize", reason = "no file system in everygraph-kernels" },
    { path = "std::fs::copy", reason = "no file system in everygraph-kernels" },
    { path = "std::fs::create_dir", reason = "no file system in everygraph-kernels" },
    { path = "std::fs::create_dir_all", reason = "no file system in everygraph-kernels" },
    { path = "std::fs::exists", reason = "no file system in everygraph-kernels" },
    { path = "std::fs::hard_link", reason = "no file system in everygraph-kernels" },
    { path = "std::fs::metadata", reason = "no file system in everygraph-kernels" },
    { path = "std::fs::read", reason = "no file system in everygraph-kernels: read through `ByteSource`; file backends live in everygraph-io" },
    { path = "std::fs::read_dir", reason = "no file system in everygraph-kernels" },
    { path = "std::fs::read_link", reason = "no file system in everygraph-kernels" },
    { path = "std::fs::read_to_string", reason = "no file system in everygraph-kernels: read through `ByteSource`; file backends live in everygraph-io" },
    { path = "std::fs::remove_dir", reason = "no file system in everygraph-kernels" },
    { path = "std::fs::remove_dir_all", reason = "no file system in everygraph-kernels" },
    { path = "std::fs::remove_file", reason = "no file system in everygraph-kernels" },
    { path = "std::fs::rename", reason = "no file system in everygraph-kernels" },
    { path = "std::fs::set_permissions", reason = "no file system in everygraph-kernels" },
    { path = "std::fs::soft_link", reason = "no file system in everygraph-kernels" },
    { path = "std::fs::symlink_metadata", reason = "no file system in everygraph-kernels" },
    { path = "std::fs::write", reason = "no file system in everygraph-kernels" },

    # std::path — the methods of `Path` (and of `PathBuf`, through deref) that ask the
    # file system. Building and taking apart paths is fine.
    { path = "std::path::Path::canonicalize", reason = "no file system in everygraph-kernels: a path may be handled, not looked up" },
    { path = "std::path::Path::exists", reason = "no file system in everygraph-kernels: a path may be handled, not looked up" },
    { path = "std::path::Path::is_dir", reason = "no file system in everygraph-kernels: a path may be handled, not looked up" },
    { path = "std::path::Path::is_file", reason = "no file system in everygraph-kernels: a path may be handled, not looked up" },
    { path = "std::path::Path::is_symlink", reason = "no file system in everygraph-kernels: a path may be handled, not looked up" },
    { path = "std::path::Path::metadata", reason = "no file system in everygraph-kernels: a path may be handled, not looked up" },
    { path = "std::path::Path::read_dir", reason = "no file system in everygraph-kernels: a path may be handled, not looked up" },
    { path = "std::path::Path::read_link", reason = "no file system in everygraph-kernels: a path may be handled, not looked up" },
    { path = "std::path::Path::symlink_metadata", reason = "no file system in everygraph-kernels: a path may be handled, not looked up" },
    { path = "std::path::Path::try_exists", reason = "no file system in everygraph-kernels: a path may be handled, not looked up" },
    { path = "std::path::absolute", reason = "no file system in everygraph-kernels: resolving a relative path reads the current directory" },

    # std::thread
    { path = "std::thread::spawn", reason = "no OS threads in everygraph-kernels: split work with `everygraph_core::par`" },
    { path = "std::thread::scope", reason = "no OS threads in everygraph-kernels: split work with `everygraph_core::par`" },
    { path = "std::thread::sleep", reason = "no OS threads in everygraph-kernels: blocking the thread is not possible on a browser's main thread" },
    { path = "std::thread::park", reason = "no OS threads in everygraph-kernels" },
    { path = "std::thread::park_timeout", reason = "no OS threads in everygraph-kernels" },
    { path = "std::thread::yield_now", reason = "no OS threads in everygraph-kernels" },
    { path = "std::thread::current", reason = "no OS threads in everygraph-kernels: results must not depend on which thread ran" },
    { path = "std::thread::available_parallelism", reason = "the thread count is the caller's decision, and nothing in everygraph-kernels may depend on it" },

    # Clock: all four panic on wasm32-unknown-unknown. `elapsed` reads the clock too
    # (`UNIX_EPOCH.elapsed()` is `SystemTime::now()` by another name).
    { path = "std::time::Instant::now", reason = "no clock in everygraph-kernels (panics on wasm32-unknown-unknown): timing is the caller's job" },
    { path = "std::time::SystemTime::now", reason = "no clock in everygraph-kernels (panics on wasm32-unknown-unknown): timing is the caller's job" },
    { path = "std::time::Instant::elapsed", reason = "no clock in everygraph-kernels (panics on wasm32-unknown-unknown): timing is the caller's job" },
    { path = "std::time::SystemTime::elapsed", reason = "no clock in everygraph-kernels (panics on wasm32-unknown-unknown): timing is the caller's job" },

    # Environment and process.
    { path = "std::env::args", reason = "no process environment in everygraph-kernels: configuration is passed in" },
    { path = "std::env::args_os", reason = "no process environment in everygraph-kernels: configuration is passed in" },
    { path = "std::env::var", reason = "no process environment in everygraph-kernels: configuration is passed in" },
    { path = "std::env::var_os", reason = "no process environment in everygraph-kernels: configuration is passed in" },
    { path = "std::env::vars", reason = "no process environment in everygraph-kernels: configuration is passed in" },
    { path = "std::env::vars_os", reason = "no process environment in everygraph-kernels: configuration is passed in" },
    { path = "std::env::set_var", reason = "no process environment in everygraph-kernels" },
    { path = "std::env::remove_var", reason = "no process environment in everygraph-kernels" },
    { path = "std::env::current_dir", reason = "no process environment in everygraph-kernels" },
    { path = "std::env::set_current_dir", reason = "no process environment in everygraph-kernels" },
    { path = "std::env::current_exe", reason = "no process environment in everygraph-kernels" },
    { path = "std::env::temp_dir", reason = "no file system in everygraph-kernels: scratch space is the caller's decision" },
    { path = "std::env::home_dir", reason = "no process environment in everygraph-kernels" },
    { path = "std::process::exit", reason = "a library does not end the process: return an error" },
    { path = "std::process::abort", reason = "a library does not end the process: return an error" },
    { path = "std::process::id", reason = "no processes in everygraph-kernels" },
    { path = "std::backtrace::Backtrace::capture", reason = "no process environment in everygraph-kernels: capturing a backtrace reads it" },
    { path = "std::backtrace::Backtrace::force_capture", reason = "no stack walking in everygraph-kernels: return an error" },

    # Network: name resolution needs no socket type.
    { path = "std::net::ToSocketAddrs::to_socket_addrs", reason = "no network in everygraph-kernels: resolving a host name is a DNS query" },

    # Standard streams: a library returns data and errors, it does not print.
    { path = "std::io::stdin", reason = "no standard streams in everygraph-kernels" },
    { path = "std::io::stdout", reason = "no standard streams in everygraph-kernels" },
    { path = "std::io::stderr", reason = "no standard streams in everygraph-kernels" },

    # The allocation rule (below the portability lists; identical in the four kernel crates).
    { path = "std::vec::Vec::with_capacity", reason = "size large buffers through the memory budget: `SegVec::try_with_len` or `SegVec::try_reserve` (issue #31)" },
    { path = "std::vec::Vec::reserve", reason = "growth must be reserved against the memory budget: `SegVec::try_reserve`" },
    { path = "std::vec::Vec::reserve_exact", reason = "growth must be reserved against the memory budget: `SegVec::try_reserve`" },
    { path = "std::vec::Vec::try_reserve", reason = "fallible, but not counted: `SegVec::try_reserve` reserves against the memory budget" },
    { path = "std::vec::Vec::try_reserve_exact", reason = "fallible, but not counted: `SegVec::try_reserve` reserves against the memory budget" },
    { path = "std::vec::Vec::resize", reason = "growth must be reserved against the memory budget: `SegVec::try_resize`" },
    { path = "std::vec::Vec::resize_with", reason = "growth must be reserved against the memory budget: `SegVec::try_resize`" },
    { path = "std::vec::from_elem", reason = "`vec![value; n]` sizes a buffer outside the memory budget: `SegVec::try_with_len`" },
    { path = "std::boxed::Box::new_uninit_slice", reason = "size large buffers through the memory budget: `SegVec`" },
    { path = "std::collections::HashMap::with_capacity", reason = "size hash tables through the memory budget: a `Reservation` of their size next to them, or a `ScratchPool`" },
    { path = "std::collections::HashMap::with_capacity_and_hasher", reason = "size hash tables through the memory budget: a `Reservation` of their size next to them, or a `ScratchPool`" },
    { path = "std::collections::HashMap::reserve", reason = "size hash tables through the memory budget: a `Reservation` of their size next to them" },
    { path = "std::collections::HashSet::with_capacity", reason = "size hash sets through the memory budget: a `Reservation` of their size next to them" },
    { path = "std::collections::HashSet::reserve", reason = "size hash sets through the memory budget: a `Reservation` of their size next to them" },
    { path = "std::collections::VecDeque::with_capacity", reason = "size queues through the memory budget: a `SegVec` used as a ring, or a `Reservation`" },
    { path = "std::collections::VecDeque::reserve", reason = "size queues through the memory budget: a `SegVec` used as a ring, or a `Reservation`" },
    { path = "std::collections::VecDeque::reserve_exact", reason = "size queues through the memory budget: a `SegVec` used as a ring, or a `Reservation`" },
    { path = "std::collections::VecDeque::try_reserve", reason = "fallible, but not counted: size queues through the memory budget" },
    { path = "std::collections::VecDeque::try_reserve_exact", reason = "fallible, but not counted: size queues through the memory budget" },
    { path = "std::collections::VecDeque::resize", reason = "size queues through the memory budget: a `SegVec` used as a ring, or a `Reservation`" },
    { path = "std::collections::VecDeque::resize_with", reason = "size queues through the memory budget: a `SegVec` used as a ring, or a `Reservation`" },
    { path = "std::collections::HashMap::try_reserve", reason = "fallible, but not counted: size hash tables through the memory budget" },
    { path = "std::collections::HashSet::try_reserve", reason = "fallible, but not counted: size hash sets through the memory budget" },
    { path = "std::collections::HashSet::with_capacity_and_hasher", reason = "size hash sets through the memory budget: a `Reservation` of their size next to them" },
    { path = "std::collections::BinaryHeap::with_capacity", reason = "size heaps through the memory budget: a `SegVec` used as a heap, or a `Reservation`" },
    { path = "std::collections::BinaryHeap::reserve", reason = "size heaps through the memory budget: a `SegVec` used as a heap, or a `Reservation`" },
    { path = "std::collections::BinaryHeap::reserve_exact", reason = "size heaps through the memory budget: a `SegVec` used as a heap, or a `Reservation`" },
    { path = "std::string::String::with_capacity", reason = "size buffers through the memory budget: a `SegVec<u8>`" },
    { path = "std::boxed::Box::new_zeroed_slice", reason = "size large buffers through the memory budget: `SegVec`" },
    { path = "slice::to_vec", reason = "copies a slice outside the memory budget: `SegVec::try_extend_from_slice`" },
    { path = "slice::repeat", reason = "sizes a buffer outside the memory budget: `SegVec::try_resize`" },
]

# A library returns data and errors; it does not print. The workspace already warns on
# these through `print_stdout`, `print_stderr` and `dbg_macro`; here they cannot be
# allowed.
disallowed-macros = [
    { path = "std::print", reason = "no standard streams in everygraph-kernels" },
    { path = "std::println", reason = "no standard streams in everygraph-kernels" },
    { path = "std::eprint", reason = "no standard streams in everygraph-kernels" },
    { path = "std::eprintln", reason = "no standard streams in everygraph-kernels" },
    { path = "std::dbg", reason = "no standard streams in everygraph-kernels" },
]
