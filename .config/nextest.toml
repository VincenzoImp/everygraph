#
# A test that hangs (a deadlock, a wait that never ends) is reported as slow after a
# minute and killed after five, instead of running into the CI job's own timeout.
# The slowest test today, everygraph-oracle's
# `thread_dependent_float_sum_is_caught_by_cross_config_identity`, took 67 s on a
# loaded lab machine (2026-11-25).

[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }
# The seeded bugs run once, in the oracle job (oracle/run-ci.sh), on the whole CI corpus
# with the Python references. `--ignore-default-filter` runs them here.
default-filter = 'not binary(seeded_bugs)'

# Under Miri (`cargo miri nextest run` picks this profile) a test runs 50 to 100 times
# slower: the slowest took about 60 s on a loaded lab machine (2026-11-26).
[profile.default-miri]
slow-timeout = { period = "120s", terminate-after = 10 }

# .github/workflows/determinism.yml: one test of the full grid runs every combination of
# threads, chunkings and sources over a corpus, and Miri runs many schedules of a test in
# one process.
[profile.determinism]
slow-timeout = { period = "120s", terminate-after = 15 }
