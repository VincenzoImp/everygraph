# The lint lists for every workspace crate that has no `clippy.toml` of its own
# (everygraph-cli, -ingest, -io, -py, -wasm). Clippy reads the `clippy.toml` closest to
# the crate it checks and does not merge files, so the crates with their own file carry
# the same numerics list there. Issue m2-18 (one portability lint shared by every
# portable crate) replaces the copies with one shared list.

disallowed-types = [
    # Numerics (DESIGN D14; rules R2 and R9 of docs/research/sota-numerics.md). The
    # same list is in every crate that produces results; keep the copies equal. Paths
    # into crates that are not dependencies resolve to nothing and are kept for the day
    # one becomes a dependency (`allow-invalid`).
    { path = "rand::rngs::StdRng", reason = "not reproducible across threads, versions or platforms: use `everygraph_core::rng` (rule R9)", allow-invalid = true },
    { path = "rand::rngs::SmallRng", reason = "not reproducible across threads, versions or platforms: use `everygraph_core::rng` (rule R9)", allow-invalid = true },
    { path = "rand::rngs::ThreadRng", reason = "not reproducible across threads, versions or platforms: use `everygraph_core::rng` (rule R9)", allow-invalid = true },
    { path = "fastrand::Rng", reason = "not reproducible across threads, versions or platforms: use `everygraph_core::rng` (rule R9)", allow-invalid = true },
]

