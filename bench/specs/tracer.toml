# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Issue #15 (m1-01), the tracer bullet: text -> CSR -> communities + hierarchy -> layout
# -> tiles -> viewer on com-Friendster (1.8 B edges), each stage in its own scope under
# MemoryMax=16G, and an "unlimited" twin under 56G (the host keeps ~5 GiB of headroom).
# orkut runs the same chain in minutes and is the development check.
#
# The glue is lab/m1-01-tracer/tracer.py: one stage per call, lab binaries only
# (lab/b1-core `glab`, lab/b2-leiden `b2` built with f32 weights as for its Friendster
# runs, lab/e-map `gmap` and viewer). A stage's output goes to a persistent store
# ({store}/<graph>/) only when the stage succeeds; the next stage reads it from there.
# The cases therefore run in this file's order and must not be reordered.
#
# Every stage evicts its input files from the page cache before the tool starts: a scope
# reading pages cached by an earlier (dead) scope is not charged for them, so a warm
# input would sit outside the 16 GiB limit being tested. "Cold" here means evicted with
# posix_fadvise(DONTNEED) by the driver (resident bytes after eviction are a metric), not
# the harness's private-copy cold mode, which cannot follow outputs made during the run.
#
# Chains. Both read the CSR made by the 16G ingest (all ingest outputs are compared
# byte for byte after the run: lab/m1-01-tracer/verify.py).
# - fit16: the best hierarchy among those computed under 16G: map-shaped (capped) before
#   plain, then by modularity (Leiden is expected to be killed there: FINDINGS § B2,
#   22.6 GiB anonymous; then a Louvain hierarchy is used). Its layout and tiles run under 16G and under 56G (like
#   for like: same input).
# - unl: the best hierarchy computed under 56G (Leiden). Layout and tiles under 56G and,
#   to tell which later stages would fit if communities did, under 16G.
# gmap reads the CSR into the heap (as experiment E did: load=heap); load=mmap maps it
# instead (GMAP_LOAD=mmap, added for this issue; outputs are byte-identical, checked on
# orkut and by verify.py). The tile builder holds every tile in RAM (known risk, not
# fixed here).
#
# Repetitions: 1 where a stage is expected to be killed (no warm-up: a failed warm-up
# would leave no measurement) or takes over 5 minutes; otherwise 2-3. Write-heavy
# stages (ingest, Leiden with its quotient graphs, tiles) have one untimed warm-up for
# the drive's sustained rate (bench/README.md "Write-heavy cases").
#
# Run (Friendster; the time and disk budget are in the pull request of issue #15):
#   everygraph-bench run tracer --official --only graph=friendster
# then: python3 -I lab/m1-01-tracer/verify.py --store <work>/tracer/store --graph friendster

schema = 1
name = "tracer"
description = "issue #15: the chain text -> CSR -> communities -> layout -> tiles -> viewer, per stage, under 16 GiB and 56 GiB"
reference = "docs/FINDINGS.md § B1, § B2 (Friendster rows), § E (extrapolations: layout 2-4 min ~20 GB, tiles 9-13 GB)"

binaries = ["{glab}", "{b2}", "{gmap}", "{tracer}", "{repo}/lab/m1-01-tracer/capture.mjs"]

[defaults]
memory_limit = "16G"
repetitions = 1
warmup = 0
threads = [32]
timeout = "30m"

[vars]
glab = "{repo}/lab/b1-core/target/release/glab"
b2 = "{repo}/lab/b2-leiden/target-w32/release/b2"
gmap = "{repo}/lab/e-map/gmap/target/release/gmap"
tracer = "{repo}/lab/m1-01-tracer/tracer.py"
inputs = "{work}/inputs"
store = "{work}/{spec}/store"
run = "python3 -I {tracer} --store {store} --work {case_work} --threads {threads} --glab {glab} --b2 {b2} --gmap {gmap}"

# --- preparation (untimed) ------------------------------------------------------------

[[prepare]]
name = "build-glab"
cwd = "{repo}/lab/b1-core"
command = ["cargo", "build", "--release", "--offline", "--locked"]

[[prepare]]
name = "build-b2-w32"
cwd = "{repo}/lab/b2-leiden"
command = ["cargo", "build", "--release", "--offline", "--locked", "--features", "w32", "--target-dir", "target-w32"]

[[prepare]]
name = "build-gmap"
cwd = "{repo}/lab/e-map/gmap"
command = ["cargo", "build", "--release", "--offline", "--locked"]

[[prepare]]
name = "text-orkut"
shell = "mkdir -p {inputs} && pigz -dc {data}/raw/com-orkut.ungraph.txt.gz > {inputs}/orkut.txt.part && mv {inputs}/orkut.txt.part {inputs}/orkut.txt"
creates = "{inputs}/orkut.txt"
needed_by = ["ingest"]

[[prepare]]
name = "text-friendster"
# 31 GiB of text, about 100 s. Shared with the headline spec (same path).
shell = "mkdir -p {inputs} && pigz -dc {data}/raw/com-friendster.ungraph.txt.gz > {inputs}/friendster.txt.part && mv {inputs}/friendster.txt.part {inputs}/friendster.txt"
creates = "{inputs}/friendster.txt"
needed_by = ["ingest"]

# --- 1. ingest: text edge list -> CSR (glab-csr-v0) -------------------------------------

[[benchmark]]
name = "ingest"
group = "1-ingest"
description = "text to CSR; 16G with the lab's low budget (8 GB), 56G with the 32 GB budget of the headline spec"
dataset_path = "raw/com-{graph}.ungraph.txt.gz"
matrix = { graph = ["orkut", "friendster"], limit = ["16G", "56G"], budget = ["8", "32"] }
exclude = [{ limit = "16G", budget = "32" }, { limit = "56G", budget = "8" }]
memory_limit = "{limit}"
warmup = 1
repetitions = 3
timeout = "15m"
shell = "exec {run} ingest --graph {graph} --tag {limit}-b{budget} --input {inputs}/{graph}.txt --budget {budget}"
conditions = { graph = "{graph}", stage = "ingest", limit = "{limit}", budget = "{budget} GB (--mem-gb)", input = "plain text, O_DIRECT", fsync = "no", storage = "glab-csr-v0, uncompressed" }
metric = [
  { name = "seconds", json = "/seconds", unit = "s", optional = true },
  { name = "disk_peak", json = "/disk_peak_bytes", unit = "B", optional = true },
  { name = "output", json = "/output_bytes", unit = "B", optional = true },
]

[[benchmark]]
name = "ingest-gz"
group = "1-ingest"
description = "from the distributed .gz through a pigz pipe, under 16G (FINDINGS § B1: not measured on Friendster)"
dataset_path = "raw/com-{graph}.ungraph.txt.gz"
matrix = { graph = ["orkut", "friendster"] }
# Inflating at ~0.3-0.6 GB/s keeps the write rate far below the drive's burst: no warm-up.
repetitions = 2
timeout = "15m"
shell = "exec {run} ingest --graph {graph} --tag 16G-gz-b8 --input {data}/raw/com-{graph}.ungraph.txt.gz --budget 8"
conditions = { graph = "{graph}", stage = "ingest", limit = "16G", budget = "8 GB (--mem-gb)", input = ".gz through pigz -dc pipe (cold)", fsync = "no", storage = "glab-csr-v0, uncompressed" }
metric = [
  { name = "seconds", json = "/seconds", unit = "s", optional = true },
  { name = "disk_peak", json = "/disk_peak_bytes", unit = "B", optional = true },
  { name = "output", json = "/output_bytes", unit = "B", optional = true },
]

# --- 2. communities + hierarchy (b2, map-shaped: cap 64, ratio 3; --lowmem) ----------------

[[benchmark]]
name = "communities-leiden-16g"
group = "2-communities"
description = "Leiden, map-shaped hierarchy, under 16G: expected to be killed (22.6 GiB anonymous without the cap)"
matrix = { graph = ["orkut", "friendster"] }
shell = "exec {run} communities --graph {graph} --tag 16G --csr 16G-b8 --algo leiden --variant capped"
conditions = { graph = "{graph}", stage = "communities", algo = "Leiden async, 1 iteration, cap 64, min ratio 3, --lowmem", limit = "16G", input = "CSR mmap, evicted first", precision = "f32 quotient weights" }
metric = [
  { name = "seconds", json = "/seconds", unit = "s", optional = true },
  { name = "modularity", json = "/modularity", optional = true },
  { name = "communities", json = "/communities", optional = true },
  { name = "disk_peak", json = "/disk_peak_bytes", unit = "B", optional = true },
  { name = "output", json = "/output_bytes", unit = "B", optional = true },
]

[[benchmark]]
name = "communities-leiden"
group = "2-communities"
description = "Leiden, map-shaped hierarchy, under 56G; writes the quotient graphs (write-heavy: one warm-up)"
matrix = { graph = ["orkut", "friendster"] }
memory_limit = "56G"
warmup = 1
repetitions = 2
timeout = "45m"
shell = "exec {run} communities --graph {graph} --tag 56G --csr 16G-b8 --algo leiden --variant capped"
conditions = { graph = "{graph}", stage = "communities", algo = "Leiden async, 1 iteration, cap 64, min ratio 3, --lowmem", limit = "56G", input = "CSR mmap, evicted first", precision = "f32 quotient weights" }
metric = [
  { name = "seconds", json = "/seconds", unit = "s", optional = true },
  { name = "modularity", json = "/modularity", optional = true },
  { name = "communities", json = "/communities", optional = true },
  { name = "disk_peak", json = "/disk_peak_bytes", unit = "B", optional = true },
  { name = "output", json = "/output_bytes", unit = "B", optional = true },
]

[[benchmark]]
name = "communities-louvain"
group = "2-communities"
description = "Louvain, map-shaped hierarchy, under 16G and 56G"
matrix = { graph = ["orkut", "friendster"], limit = ["16G", "56G"] }
memory_limit = "{limit}"
repetitions = 2
shell = "exec {run} communities --graph {graph} --tag {limit} --csr 16G-b8 --algo louvain --variant capped"
conditions = { graph = "{graph}", stage = "communities", algo = "Louvain async, cap 64, min ratio 3, --lowmem", limit = "{limit}", input = "CSR mmap, evicted first", precision = "f32 quotient weights" }
metric = [
  { name = "seconds", json = "/seconds", unit = "s", optional = true },
  { name = "modularity", json = "/modularity", optional = true },
  { name = "communities", json = "/communities", optional = true },
  { name = "disk_peak", json = "/disk_peak_bytes", unit = "B", optional = true },
  { name = "output", json = "/output_bytes", unit = "B", optional = true },
]

[[benchmark]]
name = "communities-louvain-plain-16g"
group = "2-communities"
description = "Louvain without the fan-out cap under 16G: the FINDINGS § B2 configuration (Q 0.4647), kept as a fallback hierarchy"
matrix = { graph = ["orkut", "friendster"] }
shell = "exec {run} communities --graph {graph} --tag 16G --csr 16G-b8 --algo louvain --variant plain"
conditions = { graph = "{graph}", stage = "communities", algo = "Louvain async, no cap, min ratio 3, --lowmem", limit = "16G", input = "CSR mmap, evicted first", precision = "f32 quotient weights" }
metric = [
  { name = "seconds", json = "/seconds", unit = "s", optional = true },
  { name = "modularity", json = "/modularity", optional = true },
  { name = "communities", json = "/communities", optional = true },
  { name = "disk_peak", json = "/disk_peak_bytes", unit = "B", optional = true },
  { name = "output", json = "/output_bytes", unit = "B", optional = true },
]

# --- 3. layout (gmap layout, hierarchy-constrained disc packing) -------------------------

[[benchmark]]
name = "layout-16g"
group = "3-layout"
description = "layout under 16G, CSR in the heap (as experiment E) and memory-mapped"
matrix = { graph = ["orkut", "friendster"], chain = ["fit16", "unl"], load = ["heap", "mmap"] }
shell = "case {chain} in fit16) h=16G ;; unl) h=56G ;; esac; exec {run} layout --graph {graph} --chain {chain} --tag 16G-{load} --load {load} --csr 16G-b8 --hier-tag $h"
conditions = { graph = "{graph}", stage = "layout", chain = "{chain}", limit = "16G", load = "CSR {load}", input = "evicted first", storage = "glab-csr-v0, uncompressed" }
metric = [
  { name = "seconds", json = "/seconds", unit = "s", optional = true },
  { name = "layout_seconds", json = "/layout_seconds", unit = "s", optional = true },
  { name = "disk_peak", json = "/disk_peak_bytes", unit = "B", optional = true },
  { name = "output", json = "/output_bytes", unit = "B", optional = true },
]

[[benchmark]]
name = "layout"
group = "3-layout"
description = "layout under 56G, CSR in the heap (the unlimited twin)"
matrix = { graph = ["orkut", "friendster"], chain = ["fit16", "unl"] }
memory_limit = "56G"
repetitions = 2
shell = "case {chain} in fit16) h=16G ;; unl) h=56G ;; esac; exec {run} layout --graph {graph} --chain {chain} --tag 56G-heap --load heap --csr 16G-b8 --hier-tag $h"
conditions = { graph = "{graph}", stage = "layout", chain = "{chain}", limit = "56G", load = "CSR heap", input = "evicted first", storage = "glab-csr-v0, uncompressed" }
metric = [
  { name = "seconds", json = "/seconds", unit = "s", optional = true },
  { name = "layout_seconds", json = "/layout_seconds", unit = "s", optional = true },
  { name = "disk_peak", json = "/disk_peak_bytes", unit = "B", optional = true },
  { name = "output", json = "/output_bytes", unit = "B", optional = true },
]

# --- 4. tiles (gmap tiles: PMTiles v3, every tile held in RAM until written) -------------

[[benchmark]]
name = "tiles-16g"
group = "4-tiles"
description = "tile pyramid under 16G, CSR in the heap and memory-mapped; reads its own layout, else the 56G one"
matrix = { graph = ["orkut", "friendster"], chain = ["fit16", "unl"], load = ["heap", "mmap"] }
timeout = "60m"
shell = "exec {run} tiles --graph {graph} --chain {chain} --tag 16G-{load} --load {load} --csr 16G-b8 --fallback 56G-heap"
conditions = { graph = "{graph}", stage = "tiles", chain = "{chain}", limit = "16G", load = "CSR {load}", input = "evicted first", fsync = "no" }
metric = [
  { name = "seconds", json = "/seconds", unit = "s", optional = true },
  { name = "file", json = "/file_bytes", unit = "B", optional = true },
  { name = "tiles", json = "/tiles", optional = true },
  { name = "disk_peak", json = "/disk_peak_bytes", unit = "B", optional = true },
]

[[benchmark]]
name = "tiles"
group = "4-tiles"
description = "tile pyramid under 56G, CSR in the heap (the unlimited twin); write-heavy: one warm-up"
matrix = { graph = ["orkut", "friendster"], chain = ["fit16", "unl"] }
memory_limit = "56G"
warmup = 1
timeout = "60m"
shell = "exec {run} tiles --graph {graph} --chain {chain} --tag 56G-heap --load heap --csr 16G-b8 --fallback 16G-mmap"
conditions = { graph = "{graph}", stage = "tiles", chain = "{chain}", limit = "56G", load = "CSR heap", input = "evicted first", fsync = "no" }
metric = [
  { name = "seconds", json = "/seconds", unit = "s", optional = true },
  { name = "file", json = "/file_bytes", unit = "B", optional = true },
  { name = "tiles", json = "/tiles", optional = true },
  { name = "disk_peak", json = "/disk_peak_bytes", unit = "B", optional = true },
]

# --- 5. viewer (lab/e-map viewer, headless Chromium through Playwright) -----------------

[[benchmark]]
name = "viewer"
group = "5-viewer"
description = "open the map: first-view and session bytes, screenshots at five zoom levels (server on 127.0.0.1)"
matrix = { graph = ["orkut", "friendster"], chain = ["fit16", "unl"] }
threads = [1]
timeout = "15m"
shell = "exec {run} viewer --graph {graph} --chain {chain} --prefer 16G-heap 16G-mmap 56G-heap --port 8791"
conditions = { graph = "{graph}", stage = "viewer", chain = "{chain}", limit = "16G (browser, server, picker)", viewport = "1600x1000", browser = "headless Chromium, ANGLE GL-EGL" }
metric = [
  { name = "first_view", json = "/first_view_bytes", unit = "B", optional = true },
  { name = "first_view_requests", json = "/first_view_requests", optional = true },
  { name = "session", json = "/session_bytes", unit = "B", optional = true },
  { name = "session_requests", json = "/session_requests", optional = true },
  { name = "search", json = "/search_bytes", unit = "B", optional = true },
  { name = "seconds", json = "/seconds", unit = "s", optional = true },
]
primary = "session"
