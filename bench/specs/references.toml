# --- communities: Leiden (and NetworKit's PLM), speed and modularity ----------------------------

[[benchmark]]
name = "leiden-lab"
group = "communities"
description = "lab/b2-leiden, default (asynchronous) mode; the graph memory-mapped"
dataset_path = "csr/{graph}"
matrix = { graph = ["lj", "orkut"] }
command = ["{b2}", "run", "--graph", "{dataset}", "--algo", "leiden", "--threads", "{threads}"]
record = { tool = "lab/b2-leiden", version = "this revision", algorithm = "Leiden, asynchronous local moves, one refinement", options = "defaults (gamma 1, 1 iteration)" }
conditions = { graph = "{graph}", tool = "lab Leiden", kernel = "leiden", precision = "f64 weights" }
# The line holds NaN (modularity_level0), which is not JSON: regular expressions.
metric = [
  { name = "seconds", regex = '"time_s":([0-9.]+)', unit = "s" },
  { name = "load_seconds", regex = '"load_s":([0-9.]+)', unit = "s" },
  { name = "modularity", regex = '"modularity":([0-9.]+)' },
  { name = "communities", regex = '"communities":([0-9]+)' },
]

[[benchmark]]
name = "leiden-lab-det"
