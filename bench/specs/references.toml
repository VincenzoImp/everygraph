# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Everygraph's kernels next to the best-known codes on this machine (#55, the reference
# runs of plan/issues/m3-12-perf-tracking.md; #265, plan/issues/m3-26-benchmark-validity.md):
# GAP, GBBS, ConnectIt, Parallel-KCore, PASGAL, the COST line (McSherry's single-thread
# code), NetworKit, python-igraph, GVE-Leiden, and the lab's Leiden (lab/b2-leiden).
#
# Validated outputs. The `validate` cases run first: each tool once at 16 threads, its
# result written out and compared with Everygraph's by `bench/runners/run.py validate`:
# the partition, every core number, every distance from the first source (every parent
# checked to be a neighbour), PageRank within L1 1e-6, triangle counts between the
# tools, and a modularity floor for Leiden and Louvain. The 1-thread rows are not
# validated (these kernels' outputs do not depend on the thread count). A case's
# `invalid` and `skipped_count` must be 0. lab/m3-12-reference-runs/tables.py drops every
# row whose tool did not pass the last validation of its graph and kernel. Not run:
# igraph's PageRank (PRPACK's exact solve, not 20 iterations) and GAP's Gauss-Seidel
# PageRank (another iterate). GBBS's PageRank is patched to return its result at the
# iteration cap (bench/references/build.sh).
#
# Equal measurement:
# - the same input: the registry's CSR (csr/<graph>), converted once to each tool's
#   format by bench/runners/run.py (same node ids, same order: the input order); no
#   graph has isolated vertices (counted from offsets.u64);
# - the same repetitions and statistic: every process runs a whole-graph kernel 5 times
#   and reports the median (`seconds`; `seconds_min` beside it), and a search once from
#   each of GAP's 64 seeded non-zero-degree sources (bench/references/gap_sources.cc),
#   reporting the mean. Leiden runs once per process. The harness repeats the process;
# - the same work: PageRank f64, 20 iterations, tol 0 (GAP's damping and 1/n constants
#   stay f32: its L1 distance to ours is about 4e-8, the others' 1e-16); BFS with parents
#   (Everygraph, GAP, GBBS, igraph) or distances (PASGAL, NetworKit); SSSP on the costs of
#   the undirected pairs (`pair_costs`: an integer from 1 to 255 drawn from
#   {min(u, v), max(u, v)}), the same both ways, so every tool may treat the graph as
#   symmetric (PASGAL's pull step), in f64 (Everygraph, GAP with WeightT = double) and in
#   integers (GAP int32, PASGAL uint32): the sums are exact in both. Everygraph's bucket
#   width is computed from the costs once, before the timed searches, as GAP's Δ = 2 was
#   chosen by an untimed sweep. On twitter-sym there is no f64 GAP (its 16-byte records
#   would need 38 GB): only the integer rows are its peers there;
# - Leiden: 2 Leiden iterations for the lab Leiden, NetworKit and igraph, each tool's
#   defaults otherwise; GVE-Leiden runs to its own convergence (it has no iteration
#   count), in f32 and f64. The settings are not equal, so the communities group gives
#   no time ratio: each time stands next to its modularity and that modularity's spread;
# - the same flags: every C++ tool and Everygraph without -march=native or
#   target-cpu=native (bench/references/build.sh, flavour `generic`; GBBS's makefile flag
#   is removed), each tool with its own optimization level (-O3 for every C++ tool,
#   release with fat LTO for the Rust ones);
# - placement: every process runs under bench/references/pin.sh on the 16 physical cores
#   (taskset -c 0-15). OpenMP threads (GAP, NetworKit, GVE) are bound one per core;
#   Rayon and Parlay threads (Everygraph, the lab Leiden, GBBS, ConnectIt,
#   Parallel-KCore, PASGAL) keep only the mask. Each row's `placement` condition says
#   which;
# - storage stated: GBBS maps its graph file (-b), the lab Leiden maps the CSR; every
#   other tool reads the graph into the heap; load time is apart from kernel time where
#   the tool reports it; peak memory from the cgroup for every row.
#
# Graphs: lj, orkut (social), roadnet-ca (road, diameter in the hundreds), web-google
# (web), all tools, 1 and 16 threads (on orkut, SSSP, triangles and Leiden at 16 only);
# twitter-sym, the C++ tools and Everygraph at 16 threads; Friendster, components, k-core
# and BFS at 16 threads (40 GiB). NetworKit and igraph build their graphs from Python
# arrays: not on twitter-sym or Friendster.
#
# Ratios between tools are read only from an official run (CLAUDE.md § 3; #265). The
# orkut window of the review's experiment F4: the preparation before the window (builds,
# conversions, downloads), then validation, then the timed cases, without preparation:
#   everygraph-bench run references --prepare-only --only graph=orkut/ --only validate/on=orkut --data /home/tux/graphlab/data
#   everygraph-bench run references --official --skip-prepare --only validate/on=orkut --data /home/tux/graphlab/data
#   everygraph-bench run references --official --skip-prepare --only graph=orkut/ --repetitions 6 --data /home/tux/graphlab/data
# About 3 h, an estimate (32 min per repetition of the orkut cases in an exploratory
# pass on a loaded machine, lab/m3-12-reference-runs/results/once.jsonl). The whole spec:
# the same three commands without the --only and --repetitions options, about 8 h at 3
# repetitions (an extrapolation from the same pass). The preparation downloads the
# sources and wheels the first time (the network is needed then) and writes about
# 100 GB of converted graphs under {work}/refs.

schema = 1
name = "references"
description = "Issues #55 and #265: Everygraph's kernels against GAP, GBBS, ConnectIt, Parallel-KCore, PASGAL, COST, NetworKit, igraph and GVE-Leiden, validated, measured alike"
reference = "plan/issues/m3-12-perf-tracking.md; plan/issues/m3-26-benchmark-validity.md; plan/issues/m8-03-public-benchmarks.md; lab/m3-12-reference-runs"
binaries = ["{eg}", "{cost}", "{py}", "{runners}/run.py", "{repo}/bench/references/build.sh", "{pin}"]

[defaults]
memory_limit = "24G"
repetitions = 3
# Each process repeats its kernel (5 runs, or 64 searches); a warm-up would only warm
# the page cache, and loading is reported apart.
warmup = 0
threads = [1, 16]
timeout = "40m"

[vars]
refs = "{work}/refs"
trees = "{refs}/generic"
eg = "{work}/eg-driver-generic/release/eg-driver"
cost = "{work}/cost-line-generic/release/cost-line"
b2 = "{work}/lab-b2/release/b2"
runners = "{repo}/bench/runners"
py = "{runners}/.venv/bin/python"
run = "{py} {runners}/run.py"
pin = "{repo}/bench/references/pin.sh"
sources = "{refs}/sources"
tool = "--work {refs} --trees {trees} --threads {threads}"
bound = "taskset -c 0-15; OpenMP threads bound one per core"
unbound = "taskset -c 0-15; threads not bound one by one (Rayon or Parlay)"
single = "taskset -c 0-15; one thread, not bound"

[[prepare]]
name = "runners"
command = ["uv", "sync", "--frozen", "--quiet", "--project", "{runners}"]

[[prepare]]
name = "build-rust"
cwd = "{repo}"
# Without target-cpu=native, as the C++ tools' `generic` flavour.
shell = """
set -e
RUSTFLAGS= CARGO_TARGET_DIR={work}/eg-driver-generic cargo build --release --offline --locked --manifest-path bench/references/eg-driver/Cargo.toml
RUSTFLAGS= CARGO_TARGET_DIR={work}/cost-line-generic cargo build --release --offline --locked --manifest-path bench/references/cost-line/Cargo.toml
RUSTFLAGS= CARGO_TARGET_DIR={work}/lab-b2 cargo build --release --offline --locked --manifest-path lab/b2-leiden/Cargo.toml
"""

[[prepare]]
name = "build-cpp"
shell = "sh {repo}/bench/references/build.sh generic {refs} {repo}"

[[prepare]]
name = "inputs"
# The converters stream the targets; gap_sources reads the whole graph (Friendster 15 GB).
memory_limit = "24G"
shell = """
set -e
mkdir -p {sources}
for g in lj orkut roadnet-ca web-google twitter-sym friendster; do
  for k in sg gbbs; do
    f={refs}/$g.$k; [ $k = gbbs ] && f={refs}/$g.adj
    [ -s $f ] || {run} convert $k --graph {data}/csr/$g --out $f
  done
  [ $g = friendster ] || [ -s {refs}/$g-sym.wsg ] || {run} convert wsg-sym --graph {data}/csr/$g --out {refs}/$g-sym.wsg
  [ -e {refs}/$g.bin ] || ln -s $g.adj {refs}/$g.bin
  [ -s {sources}/$g.txt ] || {{ OMP_NUM_THREADS=16 {trees}/gapbs/gap_sources -f {refs}/$g.sg -n 64 | grep -E '^[0-9]+$' > {sources}/$g.part && mv {sources}/$g.part {sources}/$g.txt; }}
done
for g in lj orkut roadnet-ca web-google; do
  [ -s {refs}/$g-sym-f64.wsg ] || {run} convert wsg-sym64 --graph {data}/csr/$g --out {refs}/$g-sym-f64.wsg
  [ -s {refs}/$g.edges ] || {run} convert edges --graph {data}/csr/$g --out {refs}/$g.edges
  [ -s {refs}/$g.mtx ] || {run} convert mtx --graph {data}/csr/$g --out {refs}/$g.mtx
done
"""

# --- validation: before every timed case ----------------------------------------------------

[[benchmark]]
name = "validate"
group = "validation"
description = "every tool's output against Everygraph's, from one run of each, 16 threads"
dataset_path = "csr/{on}"
threads = [16]
matrix = { on = ["lj", "orkut", "roadnet-ca", "web-google"] }
repetitions = 1
command = ["{pin}", "sh", "-c", "OMP_NUM_THREADS=16 PARLAY_NUM_THREADS=16 exec {run} validate --graph {dataset} {tool} --sources {sources}/{on}.txt --binary {eg} --cost {cost} --b2 {b2} --out {refs}/validation/{on}.json --python --tc --leiden"]
conditions = { graph = "{on}", check = "partition, core numbers, distances from the first source, every parent, PageRank L1 <= 1e-6, triangle counts, Leiden modularity floor" }
metric = [
  { name = "invalid", json = "/invalid" },
  { name = "skipped", json = "/skipped_count" },
  { name = "checked", json = "/checked" },
]
primary = "invalid"
reference = [
  { metric = "invalid", value = 0, tolerance = 0, source = "#265: a tool whose output differs is not reported" },
  { metric = "skipped", value = 0, tolerance = 0, source = "#265: a check not run is not a pass" },
]

[[benchmark]]
name = "validate-big"
group = "validation"
description = "the C++ tools' outputs against Everygraph's on the big graphs, 16 threads"
memory_limit = "40G"
dataset_path = "csr/{on}"
threads = [16]
matrix = { on = ["twitter-sym", "friendster"] }
repetitions = 1
# twitter-sym has no f64 GAP; Friendster runs components, k-core and BFS only.
command = ["{pin}", "sh", "-c", "OMP_NUM_THREADS=16 PARLAY_NUM_THREADS=16 exec {run} validate --graph {dataset} {tool} --sources {sources}/{on}.txt --binary {eg} --cost {cost} --out {refs}/validation/{on}.json --without gap-f64 --kernels $([ {on} = friendster ] && echo cc,kcore,bfs || echo cc,kcore,pr64,bfs,sssp)"]
conditions = { graph = "{on}", check = "partition, core numbers, distances from the first source, every parent, PageRank L1 <= 1e-6" }
metric = [
  { name = "invalid", json = "/invalid" },
  { name = "skipped", json = "/skipped_count" },
  { name = "checked", json = "/checked" },
]
primary = "invalid"
reference = [
  { metric = "invalid", value = 0, tolerance = 0, source = "#265: a tool whose output differs is not reported" },
  { metric = "skipped", value = 0, tolerance = 0, source = "#265: a check not run is not a pass" },
]

# --- PageRank: f64, damping 0.85, 20 iterations, tol 0 -------------------------------------

[[benchmark]]
name = "pagerank-eg"
group = "pagerank"
dataset_path = "csr/{graph}"
matrix = { graph = ["lj", "orkut", "roadnet-ca", "web-google", "twitter-sym"] }
exclude = [{ graph = "twitter-sym", threads = 1 }]
command = ["{pin}", "{eg}", "--graph", "{dataset}", "--kernel", "pr64", "--threads", "{threads}", "--reps", "5"]
record = { tool = "Everygraph", version = "this revision", algorithm = "everygraph_kernels::pagerank (pull, Jacobi), f64, strength included", options = "damping 0.85, 20 iterations, tol 0; raw CSR in the heap; median of 5" }
record_json = { hash = "/hash" }
conditions = { graph = "{graph}", tool = "Everygraph", kernel = "pagerank", precision = "f64", storage = "heap", placement = "{unbound}" }
metric = [
  { name = "seconds", json = "/seconds", unit = "s" },
  { name = "seconds_min", json = "/seconds_min", unit = "s" },
  { name = "load_seconds", json = "/load_seconds", unit = "s" },
]

[[benchmark]]
name = "pagerank-gap"
group = "pagerank"
runner = "gap"
dataset_path = "csr/{graph}"
matrix = { graph = ["lj", "orkut", "roadnet-ca", "web-google", "twitter-sym"] }
exclude = [{ graph = "twitter-sym", threads = 1 }]
command = ["{pin}", "sh", "-c", "OMP_NUM_THREADS={threads} exec {run} gap pr --graph {dataset} {tool}"]
record_json = { tool = "/tool", version = "/version", algorithm = "/algorithm", options = "/options" }
conditions = { graph = "{graph}", tool = "GAP", kernel = "pagerank", precision = "f64 (ScoreT = double; kDamp and 1/n stay f32)", storage = "heap", placement = "{bound}" }
metric = [
  { name = "seconds", json = "/seconds", unit = "s" },
  { name = "seconds_min", json = "/seconds_min", unit = "s" },
  { name = "load_seconds", json = "/load_seconds", unit = "s" },
]

[[benchmark]]
name = "pagerank-gbbs"
group = "pagerank"
runner = "gbbs"
dataset_path = "csr/{graph}"
matrix = { graph = ["lj", "orkut", "roadnet-ca", "web-google", "twitter-sym"] }
exclude = [{ graph = "twitter-sym", threads = 1 }]
command = ["{pin}", "sh", "-c", "PARLAY_NUM_THREADS={threads} exec {run} gbbs pr --graph {dataset} {tool}"]
record_json = { tool = "/tool", version = "/version", algorithm = "/algorithm", options = "/options" }
conditions = { graph = "{graph}", tool = "GBBS", kernel = "pagerank", precision = "f64", storage = "GBBS binary graph, memory-mapped", placement = "{unbound}" }
metric = [
  { name = "seconds", json = "/seconds", unit = "s" },
  { name = "seconds_min", json = "/seconds_min", unit = "s" },
]

[[benchmark]]
name = "pagerank-cost"
group = "pagerank"
description = "the COST line: McSherry's single-thread PageRank, f64"
dataset_path = "csr/{graph}"
threads = [1]
matrix = { graph = ["lj", "orkut", "roadnet-ca", "web-google"] }
command = ["{pin}", "{cost}", "--graph", "{dataset}", "--kernel", "pr", "--reps", "5"]
record = { tool = "COST", version = "frankmcsherry/COST d5bef75 (bench/references/cost-line)", algorithm = "single-thread PageRank over the edges in CSR order, f64, 20 iterations", options = "median of 5" }
conditions = { graph = "{graph}", tool = "COST line", kernel = "pagerank", precision = "f64", storage = "heap", placement = "{single}" }
metric = [
  { name = "seconds", json = "/seconds", unit = "s" },
  { name = "seconds_min", json = "/seconds_min", unit = "s" },
  { name = "load_seconds", json = "/load_seconds", unit = "s" },
]

[[benchmark]]
name = "pagerank-networkit"
group = "pagerank"
runner = "networkit"
dataset_path = "csr/{graph}"
matrix = { graph = ["lj", "orkut", "roadnet-ca", "web-google"] }
command = ["{pin}", "sh", "-c", "OMP_NUM_THREADS={threads} exec {run} networkit pagerank --graph {dataset} --threads {threads} --trials 5"]
record_json = { tool = "/tool", version = "/version", algorithm = "/algorithm", options = "/options" }
conditions = { graph = "{graph}", tool = "NetworKit", kernel = "pagerank", precision = "f64", level = "in-process call from Python", storage = "heap", placement = "{bound}" }
metric = [
  { name = "seconds", json = "/seconds", unit = "s" },
  { name = "seconds_min", json = "/seconds_min", unit = "s" },
  { name = "load_seconds", json = "/load_seconds", unit = "s" },
]

[[benchmark]]
name = "pagerank-igraph"
group = "pagerank"
dataset_path = "csr/orkut"
unavailable = "igraph's PageRank is PRPACK's exact solve, not 20 iterations: its output differs from every tool's by design"
command = ["true"]

