# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Everygraph's kernels next to the best-known codes on this machine (#55, the reference
# runs of plan/issues/m3-12-perf-tracking.md; #265, plan/issues/m3-26-benchmark-validity.md):
# GAP, GBBS, ConnectIt, Parallel-KCore, PASGAL, the COST line (McSherry's single-thread
# code), NetworKit, python-igraph, GVE-Leiden, and the lab's Leiden (lab/b2-leiden).
#
# Validated outputs. The `validate` cases run first: each tool once, its result written
# out and compared with Everygraph's by `bench/runners/run.py validate` (the partition,
# every core number, every distance from the first source, PageRank within L1 1e-6,
# triangle counts between the tools). A tool whose check fails is not reported: its
# rows are left out of every table. Checks that cannot pass are not run at all:
# - GBBS PageRank returns its zeroed work buffer when it stops at the iteration cap
#   (PageRank.h: the loop zeroes p_curr and swaps before it returns p_next);
# - igraph's PageRank is PRPACK's exact solve, not 20 iterations;
# - GAP's Gauss-Seidel PageRank (pr.cc) computes another iterate;
# - NetworKit's PageRank is checked; its BFS and igraph's return distances, the others
#   parents (GAP, GBBS) or distances (Everygraph computes both, PASGAL distances).
#
# Equal measurement:
# - the same input: the registry's CSR (csr/<graph>), converted once to each tool's
#   format by bench/runners/run.py (same node ids, same order: the input order); no
#   graph has isolated vertices (counted from offsets.u64);
# - the same repetitions and statistic: every process runs a whole-graph kernel 5 times
#   and reports the median (`seconds`; `seconds_min` beside it), and a search once from
#   each of GAP's 64 seeded non-zero-degree sources (bench/references/gap_sources.cc),
#   reporting the mean. The harness repeats the process;
# - the same precision: PageRank f64 for every tool; SSSP in f64 (Everygraph, GAP with
#   WeightT = double) and in integers (GAP int32, PASGAL uint32), on the same costs
#   (integers 1 to 255, a function of the entry: exact in both); GVE-Leiden in f32 (its
#   default) and f64; the lab Leiden in f64;
# - the same flags: every C++ tool and Everygraph without -march=native or
#   target-cpu=native (bench/references/build.sh, flavour `generic`; GBBS's makefile flag
#   is removed), each tool with its own optimization level (-O3 for every C++ tool,
#   release with fat LTO for the Rust ones);
# - the same placement: every process runs under bench/references/pin.sh, on the 16
#   physical cores (taskset -c 0-15; OpenMP threads bound one per core); 1 and 16 threads;
# - storage stated: GBBS maps its graph file (-b), the lab Leiden maps the CSR; every
#   other tool reads the graph into the heap; load time is apart from kernel time where
#   the tool reports it; peak memory from the cgroup for every row.
#
# Graphs: lj, orkut (social), roadnet-ca (road, diameter in the hundreds), web-google
# (web), all tools, 1 and 16 threads (on orkut, SSSP, triangles and Leiden at 16 only);
# twitter-sym, the C++ tools and Everygraph at 16 threads; Friendster, components, k-core
# and BFS at 16 threads (40 GiB). NetworKit and igraph build their graphs from Python
# arrays: not on twitter-sym or Friendster.
#
# Ratios between tools are read only from an official run (CLAUDE.md § 3; #265).
# The orkut window of the review's experiment F4, validation first:
#   everygraph-bench run references --official --only validate/on=orkut --data /home/tux/graphlab/data
#   everygraph-bench run references --official --only graph=orkut/t1 --only leiden-gve/graph=orkut --repetitions 6 --data /home/tux/graphlab/data
# The whole spec (an estimate: several hours, from the exploratory runs' wall times):
#   everygraph-bench run references --official --data /home/tux/graphlab/data
# The preparation downloads the sources and wheels the first time (the network is needed
# then) and writes about 130 GB of converted graphs under {work}/refs.

schema = 1
name = "references"
description = "Issues #55 and #265: Everygraph's kernels against GAP, GBBS, ConnectIt, Parallel-KCore, PASGAL, COST, NetworKit, igraph and GVE-Leiden, validated, measured alike"
reference = "plan/issues/m3-12-perf-tracking.md; plan/issues/m3-26-benchmark-validity.md; plan/issues/m8-03-public-benchmarks.md; lab/m3-12-reference-runs"
binaries = ["{eg}", "{cost}", "{py}", "{runners}/run.py", "{repo}/bench/references/build.sh", "{pin}"]

[defaults]
memory_limit = "24G"
repetitions = 3
# Each process repeats its kernel (5 runs, or 64 searches); a warm-up would only warm
# the page cache, and loading is reported apart.
warmup = 0
threads = [1, 16]
timeout = "40m"

[vars]
refs = "{work}/refs"
trees = "{refs}/generic"
eg = "{work}/eg-driver-generic/release/eg-driver"
cost = "{work}/cost-line-generic/release/cost-line"
b2 = "{work}/lab-b2/release/b2"
runners = "{repo}/bench/runners"
py = "{runners}/.venv/bin/python"
run = "{py} {runners}/run.py"
pin = "{repo}/bench/references/pin.sh"
sources = "{refs}/sources"
tool = "--work {refs} --trees {trees} --threads {threads}"

[[prepare]]
name = "runners"
command = ["uv", "sync", "--frozen", "--quiet", "--project", "{runners}"]

[[prepare]]
name = "build-rust"
cwd = "{repo}"
# The generic flavour is the one measured; the native one is built for the record of
# the flags (bench/references/build.sh has the same two).
shell = """
set -e
for f in generic native; do
  flags=; [ $f = native ] && flags="-C target-cpu=native"
  RUSTFLAGS="$flags" CARGO_TARGET_DIR={work}/eg-driver-$f cargo build --release --offline --locked --manifest-path bench/references/eg-driver/Cargo.toml
  RUSTFLAGS="$flags" CARGO_TARGET_DIR={work}/cost-line-$f cargo build --release --offline --locked --manifest-path bench/references/cost-line/Cargo.toml
done
RUSTFLAGS= CARGO_TARGET_DIR={work}/lab-b2 cargo build --release --offline --locked --manifest-path lab/b2-leiden/Cargo.toml
"""

[[prepare]]
name = "build-cpp"
shell = "sh {repo}/bench/references/build.sh generic {refs} {repo} && sh {repo}/bench/references/build.sh native {refs} {repo}"

[[prepare]]
name = "inputs"
# The converters stream the targets; gap_sources reads the whole graph (Friendster 15 GB).
memory_limit = "24G"
shell = """
set -e
mkdir -p {sources}
for g in lj orkut roadnet-ca web-google twitter-sym friendster; do
  for k in sg wsg gbbs; do
    f={refs}/$g.$k; [ $k = gbbs ] && f={refs}/$g.adj
    [ -s $f ] || {run} convert $k --graph {data}/csr/$g --out $f
  done
  [ -e {refs}/$g.bin ] || ln -s $g.adj {refs}/$g.bin
  [ -s {sources}/$g.txt ] || {{ OMP_NUM_THREADS=16 {trees}/gapbs/gap_sources -f {refs}/$g.sg -n 64 | grep -E '^[0-9]+$' > {sources}/$g.part && mv {sources}/$g.part {sources}/$g.txt; }}
done
for g in lj orkut roadnet-ca web-google; do
  [ -s {refs}/$g-f64.wsg ] || {run} convert wsg64 --graph {data}/csr/$g --out {refs}/$g-f64.wsg
  [ -s {refs}/$g.edges ] || {run} convert edges --graph {data}/csr/$g --out {refs}/$g.edges
  [ -s {refs}/$g.mtx ] || {run} convert mtx --graph {data}/csr/$g --out {refs}/$g.mtx
done
"""

# --- validation: before every timed case ----------------------------------------------------

[[benchmark]]
name = "validate"
group = "validation"
description = "every tool's output against Everygraph's, from one run of each, 16 threads"
dataset_path = "csr/{on}"
threads = [16]
matrix = { on = ["lj", "orkut", "roadnet-ca", "web-google"] }
repetitions = 1
command = ["{pin}", "sh", "-c", "OMP_NUM_THREADS=16 PARLAY_NUM_THREADS=16 exec {run} validate --graph {dataset} {tool} --sources {sources}/{on}.txt --binary {eg} --cost {cost} --python --tc"]
conditions = { graph = "{on}", check = "partition, core numbers, distances from the first source, PageRank L1 <= 1e-6, triangle counts" }
metric = [
  { name = "invalid", json = "/invalid" },
  { name = "checked", json = "/checked" },
]
primary = "invalid"
reference = [{ metric = "invalid", value = 0, tolerance = 0, source = "#265: a tool whose output differs is not reported" }]

[[benchmark]]
name = "validate-big"
group = "validation"
description = "the C++ tools' outputs against Everygraph's on the big graphs, 16 threads"
memory_limit = "40G"
dataset_path = "csr/{on}"
threads = [16]
matrix = { on = ["twitter-sym", "friendster"] }
repetitions = 1
command = ["{pin}", "sh", "-c", "OMP_NUM_THREADS=16 PARLAY_NUM_THREADS=16 exec {run} validate --graph {dataset} {tool} --sources {sources}/{on}.txt --binary {eg} --cost {cost} --kernels $([ {on} = friendster ] && echo cc,kcore,bfs || echo cc,kcore,pr64,bfs,sssp)"]
conditions = { graph = "{on}", check = "partition, core numbers, distances from the first source, PageRank L1 <= 1e-6" }
metric = [
  { name = "invalid", json = "/invalid" },
  { name = "checked", json = "/checked" },
]
primary = "invalid"
reference = [{ metric = "invalid", value = 0, tolerance = 0, source = "#265: a tool whose output differs is not reported" }]

# --- PageRank: f64, damping 0.85, 20 iterations, tol 0 -------------------------------------

[[benchmark]]
name = "pagerank-eg"
group = "pagerank"
dataset_path = "csr/{graph}"
matrix = { graph = ["lj", "orkut", "roadnet-ca", "web-google", "twitter-sym"] }
exclude = [{ graph = "twitter-sym", threads = 1 }]
command = ["{pin}", "{eg}", "--graph", "{dataset}", "--kernel", "pr64", "--threads", "{threads}", "--reps", "5"]
record = { tool = "Everygraph", version = "this revision", algorithm = "everygraph_kernels::pagerank (pull, Jacobi), f64, strength included", options = "damping 0.85, 20 iterations, tol 0; raw CSR in the heap; median of 5" }
record_json = { hash = "/hash" }
conditions = { graph = "{graph}", tool = "Everygraph", kernel = "pagerank", precision = "f64", storage = "heap" }
metric = [
  { name = "seconds", json = "/seconds", unit = "s" },
  { name = "seconds_min", json = "/seconds_min", unit = "s" },
  { name = "load_seconds", json = "/load_seconds", unit = "s" },
]

[[benchmark]]
name = "pagerank-gap"
group = "pagerank"
runner = "gap"
dataset_path = "csr/{graph}"
matrix = { graph = ["lj", "orkut", "roadnet-ca", "web-google", "twitter-sym"] }
exclude = [{ graph = "twitter-sym", threads = 1 }]
command = ["{pin}", "sh", "-c", "OMP_NUM_THREADS={threads} exec {run} gap pr --graph {dataset} {tool}"]
record_json = { tool = "/tool", version = "/version", algorithm = "/algorithm", options = "/options" }
conditions = { graph = "{graph}", tool = "GAP", kernel = "pagerank", precision = "f64 (ScoreT = double)", storage = "heap" }
metric = [
  { name = "seconds", json = "/seconds", unit = "s" },
  { name = "seconds_min", json = "/seconds_min", unit = "s" },
  { name = "load_seconds", json = "/load_seconds", unit = "s" },
]

[[benchmark]]
name = "pagerank-gbbs"
group = "pagerank"
dataset_path = "csr/orkut"
unavailable = "GBBS's PageRank returns its zeroed work buffer when it stops at the iteration cap (benchmarks/PageRank/PageRank.h zeroes p_curr and swaps before returning p_next), so its output fails the check against Everygraph's; with a tolerance instead, it would not run 20 iterations"
command = ["true"]

[[benchmark]]
name = "pagerank-cost"
group = "pagerank"
description = "the COST line: McSherry's single-thread PageRank, f64"
dataset_path = "csr/{graph}"
threads = [1]
matrix = { graph = ["lj", "orkut", "roadnet-ca", "web-google"] }
command = ["{pin}", "{cost}", "--graph", "{dataset}", "--kernel", "pr", "--reps", "5"]
record = { tool = "COST", version = "frankmcsherry/COST d5bef75 (bench/references/cost-line)", algorithm = "single-thread PageRank over the edges in CSR order, f64, 20 iterations", options = "median of 5" }
conditions = { graph = "{graph}", tool = "COST line", kernel = "pagerank", precision = "f64", storage = "heap" }
metric = [
  { name = "seconds", json = "/seconds", unit = "s" },
  { name = "seconds_min", json = "/seconds_min", unit = "s" },
  { name = "load_seconds", json = "/load_seconds", unit = "s" },
]

[[benchmark]]
name = "pagerank-networkit"
group = "pagerank"
runner = "networkit"
dataset_path = "csr/{graph}"
matrix = { graph = ["lj", "orkut", "roadnet-ca", "web-google"] }
command = ["{pin}", "sh", "-c", "OMP_NUM_THREADS={threads} exec {run} networkit pagerank --graph {dataset} --threads {threads} --trials 5"]
record_json = { tool = "/tool", version = "/version", algorithm = "/algorithm", options = "/options" }
conditions = { graph = "{graph}", tool = "NetworKit", kernel = "pagerank", precision = "f64", level = "in-process call from Python", storage = "heap" }
metric = [
  { name = "seconds", json = "/seconds", unit = "s" },
  { name = "seconds_min", json = "/seconds_min", unit = "s" },
  { name = "load_seconds", json = "/load_seconds", unit = "s" },
]

[[benchmark]]
name = "pagerank-igraph"
group = "pagerank"
dataset_path = "csr/orkut"
unavailable = "igraph's PageRank is PRPACK's exact solve, not 20 iterations: its output differs from every tool's by design"
command = ["true"]

