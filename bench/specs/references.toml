record_json = { tool = "/tool", version = "/version", algorithm = "/algorithm", options = "/options" }
conditions = { graph = "{graph}", tool = "GAP", kernel = "sssp", precision = "int32 costs and distances", storage = "GAP weighted CSR in the heap" }
metric = [
  { name = "seconds", json = "/seconds", unit = "s" },
  { name = "load_seconds", json = "/load_seconds", unit = "s" },
]

