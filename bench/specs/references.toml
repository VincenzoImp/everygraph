# --- communities: Leiden (and Louvain), speed and modularity ------------------------------------
# Leiden's result depends on the schedule, so it is not checked against ours: each row
# records its modularity (the tool's own; NetworKit's and igraph's by the runner's
# function) and its number of communities. One run per process for every tool (GVE's
# REPEAT_METHOD=1), the harness repeating the process.

[[benchmark]]
name = "leiden-lab"
group = "communities"
description = "lab/b2-leiden, default (asynchronous) mode; the graph memory-mapped"
dataset_path = "csr/{graph}"
matrix = { graph = ["lj", "orkut", "roadnet-ca", "web-google"] }
exclude = [{ graph = "orkut", threads = 1 }]
command = ["{pin}", "{b2}", "run", "--graph", "{dataset}", "--algo", "leiden", "--threads", "{threads}"]
record = { tool = "lab/b2-leiden", version = "this revision", algorithm = "Leiden, asynchronous local moves, one refinement", options = "defaults (gamma 1, 1 iteration); one run per process" }
conditions = { graph = "{graph}", tool = "lab Leiden", kernel = "leiden", precision = "f64 weights", storage = "CSR memory-mapped" }
# The line holds NaN (modularity_level0), which is not JSON: regular expressions.
metric = [
  { name = "seconds", regex = '"time_s":([0-9.]+)', unit = "s" },
  { name = "load_seconds", regex = '"load_s":([0-9.]+)', unit = "s" },
  { name = "modularity", regex = '"modularity":([0-9.]+)' },
  { name = "communities", regex = '"communities":([0-9]+)' },
]

[[benchmark]]
name = "leiden-lab-det"
group = "communities"
description = "lab/b2-leiden, deterministic mode (--det)"
dataset_path = "csr/{graph}"
