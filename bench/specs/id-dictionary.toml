# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Issue #34: the identifier dictionary (crates/everygraph-ingest/src/ids), measured by
# the example crates/everygraph-ingest/examples/id_dictionary.rs, which prints one JSON
# line. Synthetic keys, generated by the example; no dataset.
#
# Acceptance criteria of #34 and the benchmark that checks each:
# - "65 M 42-byte hex keys: dictionary built in < 15 s at 16 threads, forward lookup
#   < 1 µs warm": `hex-65m`, metric build_s and fwd_warm_p50_us. The keys are
#   generated before the clock starts (--pregenerate) and read in a scrambled order,
#   each once; the scratch is in memory and the budget 16 GiB, so the case measures the
#   dictionary, not a disk.
# - "3.6 B endpoint mappings in < 60 s after the dictionary exists": `map-3600m`, metric
#   member_map_s (the second pass of an ingest maps keys it already saw: no key
#   comparison, `Dictionary::id_of_member`) and verified_map_s (`Dictionary::lookup`).
#   Keys are read sequentially from memory, 55 passes over the 65 M; read_keys_s is the
#   cost of reading them alone, included in the other two.
# - "Bounded-memory build of a 500 M-key dictionary under a 4 GiB budget": `build-500m`,
#   20-byte binary keys (the lab's ethbin), budget 4 GiB, scratch files in the case's
#   work directory, under MemoryMax = budget + 1 GiB. Its page cache counts against the
#   limit and is reclaimed under it; anon_peak_bytes is the anonymous memory.
# - The two layouts ("measure both"): every benchmark runs both, and `cold-65m` times a
#   look-up with every section evicted before each (the hash function stays in memory).
#
# Lab references (shared machine; FINDINGS § F1): MPHF at 500 M 20-byte keys built in
# 10.8 s at 32 threads, the whole dictionary with its key store in 19.4 s
# (lab/f1-query/results/dict_mphf_ethbin_500000000_t32.json); 65 M 42-byte hex keys in
# 3.45 s at 32 threads, warm forward p50 0.52 µs, all in RAM with no dedupe and no
# budget (lab/f1-query/results/dict_mphf_eth_65000000_t32.json). Not like for like with
# this spec: the lab built from distinct keys already in memory, with no dedupe and no
# memory accounting; its "build" did not include assigning ids. No reference is gated.
#
# Run (estimated 20 minutes on the idle machine, an estimate from exploratory runs on a
# loaded one: build-500m took 167 s there; about 45 GB of disk in the work directory at
# the peak of build-500m, 2 GB for cold-65m):
#   everygraph-bench run id-dictionary --official

schema = 1
name = "id-dictionary"
description = "issue #34: identifier dictionary build, look-ups and mapping; split and slot-ordered layouts"
reference = "docs/FINDINGS.md § F1; lab/f1-query/results/dict_mphf_*"

binaries = ["{bin}"]

[defaults]
memory_limit = "24G"
repetitions = 3
warmup = 1
threads = [16]
timeout = "20m"

[vars]
bin = "{repo}/target/release/examples/id_dictionary"

[[prepare]]
name = "build"
cwd = "{repo}"
command = ["cargo", "build", "--release", "--offline", "--locked", "-p", "everygraph-ingest", "--example", "id_dictionary"]

[[benchmark]]
name = "hex-65m"
group = "build"
description = "65 M distinct 42-character hex keys, each read once: build, warm look-ups"
matrix = { layout = ["split", "slot"] }
command = ["{bin}", "--keys", "eth", "--pregenerate", "yes", "--n", "65000000", "--budget", "16G", "--scratch", "memory", "--layout", "{layout}", "--lookups", "2000000"]
env = { RAYON_NUM_THREADS = "{threads}" }
conditions = { keys = "65 M distinct, 42-byte 0x-hex text, in memory", budget = "16 GiB", scratch = "memory", layout = "{layout}", order = "first appearance" }
metric = [
  { name = "build_s", json = "/build_s", unit = "s" },
  { name = "distinct_s", json = "/distinct_s", unit = "s" },
  { name = "phases_s", json = "/phases_s", unit = "s" },
  { name = "fwd_warm_p50_us", json = "/fwd_warm_p50_us", unit = "us" },
  { name = "fwd_warm_p99_us", json = "/fwd_warm_p99_us", unit = "us" },
  { name = "rev_warm_p50_us", json = "/rev_warm_p50_us", unit = "us" },
  { name = "hash_function_bits_per_key", json = "/hash_function_bits_per_key", unit = "bits" },
  { name = "bytes_per_key", json = "/bytes_per_key", unit = "B" },
  { name = "reads_per_lookup", json = "/reads_per_lookup", unit = "reads" },
]
primary = "build_s"

[[benchmark]]
name = "map-3600m"
group = "mapping"
description = "after a 65 M-key build: 3.6 B mappings of keys of the set, read sequentially, at 16 threads"
matrix = { layout = ["split", "slot"] }
repetitions = 2
warmup = 0
command = ["{bin}", "--keys", "eth", "--pregenerate", "yes", "--n", "65000000", "--budget", "16G", "--scratch", "memory", "--layout", "{layout}", "--lookups", "100000", "--map", "3600000000"]
env = { RAYON_NUM_THREADS = "{threads}" }
conditions = { keys = "65 M distinct, 42-byte 0x-hex text, in memory", mappings = "3.6e9", layout = "{layout}" }
metric = [
  { name = "member_map_s", json = "/map/member_s", unit = "s" },
  { name = "verified_map_s", json = "/map/verified_s", unit = "s" },
  { name = "read_keys_s", json = "/map/generate_s", unit = "s" },
  { name = "build_s", json = "/build_s", unit = "s" },
]
primary = "member_map_s"

[[benchmark]]
name = "cold-65m"
group = "lookups"
description = "65 M hex keys in scratch files; 300 look-ups each way with every section evicted first"
matrix = { layout = ["split", "slot"] }
repetitions = 1
warmup = 0
command = ["{bin}", "--keys", "eth", "--n", "65000000", "--budget", "4G", "--scratch", "dir:{case_work}/scratch", "--layout", "{layout}", "--lookups", "100000", "--cold", "300"]
env = { RAYON_NUM_THREADS = "{threads}" }
conditions = { keys = "65 M distinct, 42-byte 0x-hex text", sections = "files, evicted with posix_fadvise before each look-up", layout = "{layout}" }
metric = [
  { name = "cold_fwd_p50_us", json = "/cold/fwd_p50_us", unit = "us" },
  { name = "cold_fwd_p95_us", json = "/cold/fwd_p95_us", unit = "us" },
  { name = "cold_rev_p50_us", json = "/cold/rev_p50_us", unit = "us" },
  { name = "reads_per_lookup", json = "/reads_per_lookup", unit = "reads" },
]
primary = "cold_fwd_p50_us"

[[benchmark]]
name = "build-500m"
group = "bounded"
description = "500 M distinct 20-byte binary keys under a 4 GiB budget, scratch on disk"
repetitions = 1
warmup = 0
memory_limit = "5G"
timeout = "60m"
command = ["{bin}", "--keys", "ethbin", "--n", "500000000", "--budget", "4G", "--scratch", "dir:{case_work}/scratch", "--layout", "split", "--lookups", "10000"]
# Fixed glibc thresholds: a stopgap until the allocator policy, m2-19 (#167).
env = { RAYON_NUM_THREADS = "{threads}", GLIBC_TUNABLES = "glibc.malloc.mmap_threshold=131072:glibc.malloc.trim_threshold=131072" }
conditions = { keys = "500 M distinct, 20 bytes, generated while read", budget = "4 GiB (accountant)", limit = "MemoryMax 5 GiB", scratch = "files in the work directory", layout = "split", allocator = "glibc mmap and trim thresholds fixed at 128 KiB" }
metric = [
  { name = "build_s", json = "/build_s", unit = "s" },
  { name = "distinct_s", json = "/distinct_s", unit = "s" },
  { name = "phases_s", json = "/phases_s", unit = "s" },
  { name = "peak_reserved_bytes", json = "/peak_reserved_bytes", unit = "B" },
  { name = "hash_function_bits_per_key", json = "/hash_function_bits_per_key", unit = "bits" },
  { name = "bytes_per_key", json = "/bytes_per_key", unit = "B" },
]
primary = "build_s"
