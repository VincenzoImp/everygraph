[[benchmark]]
name = "probes-orkut"
group = "kernels"
description = "PageRank probes of § B1: mmap vs heap, huge pages off, u64 ids, node order"
dataset_path = "csr/orkut"
matrix = { algo = ["pr32", "pr64"], probe = ["mmap", "thp-off", "ids-u64", "order-degree", "order-bfs", "order-random"] }
shell = """
case {probe} in
  mmap)         extra="--load mmap" ;;
  thp-off)      extra="--load heap --thp off" ;;
  ids-u64)      extra="--load heap --ids u64" ;;
  order-degree) extra="--load heap --order degree" ;;
  order-bfs)    extra="--load heap --order bfs" ;;
  order-random) extra="--load heap --order random" ;;
esac
exec {glab} run --graph {dataset} --algo {algo} --threads {threads} --reps 3 $extra
"""
conditions = { graph = "orkut", kernel = "{algo}", probe = "{probe}", level = "in-process kernel, best of 3", precision = "f32" }
when = [{ match = { algo = "pr64" }, conditions = { precision = "f64" } }]
metric = [
  { name = "seconds", json = "/seconds_best", unit = "s" },
  { name = "peak_rss", json = "/peak_rss_gb", scale = 1073741824, unit = "B" },
]
reference = [
  { match = { algo = "pr32", probe = "mmap" }, metric = "seconds", value = 0.380, source = "idle re-run, kernels.jsonl probe" },
  { match = { algo = "pr32", probe = "thp-off" }, metric = "seconds", value = 0.375, source = "idle re-run, kernels.jsonl probe" },
  { match = { algo = "pr32", probe = "ids-u64" }, metric = "seconds", value = 0.70, source = "idle re-run, kernels.jsonl probe" },
  { match = { algo = "pr32", probe = "order-degree" }, metric = "seconds", value = 0.405, source = "idle re-run, kernels.jsonl probe" },
  { match = { algo = "pr32", probe = "order-bfs" }, metric = "seconds", value = 0.377, source = "idle re-run, kernels.jsonl probe" },
  { match = { algo = "pr32", probe = "order-random" }, metric = "seconds", value = 0.468, source = "idle re-run, kernels.jsonl probe" },
  { match = { algo = "pr64", probe = "mmap" }, metric = "seconds", value = 0.435, source = "idle re-run, kernels.jsonl probe" },
  { match = { algo = "pr64", probe = "thp-off" }, metric = "seconds", value = 0.468, source = "idle re-run, kernels.jsonl probe" },
  { match = { algo = "pr64", probe = "ids-u64" }, metric = "seconds", value = 0.80, source = "idle re-run, kernels.jsonl probe" },
  { match = { algo = "pr64", probe = "order-degree" }, metric = "seconds", value = 0.473, source = "idle re-run, kernels.jsonl probe" },
  { match = { algo = "pr64", probe = "order-bfs" }, metric = "seconds", value = 0.430, source = "idle re-run, kernels.jsonl probe" },
  { match = { algo = "pr64", probe = "order-random" }, metric = "seconds", value = 0.520, source = "idle re-run, kernels.jsonl probe" },
]

# --- kernels on Friendster, CSR memory-mapped, warm ---------------------------------------

[[benchmark]]
name = "kernels-friendster"
group = "kernels"
description = "Friendster with the CSR memory-mapped and in the page cache"
dataset_path = "csr/friendster"
memory_limit = "24G"
matrix = { algo = ["wcc", "bfs", "pr32"] }
shell = "if [ {algo} = pr32 ]; then exec {glab} run --graph {dataset} --algo pr32 --load mmap --threads {threads} --iters 10; else exec {glab} run --graph {dataset} --algo {algo} --load mmap --threads {threads} --reps 3; fi"
conditions = { graph = "friendster", kernel = "{algo}", load = "mmap, warm", level = "in-process kernel", precision = "integer" }
when = [{ match = { algo = "pr32" }, conditions = { precision = "f32" } }]
metric = [
  { name = "seconds", json = "/seconds_best", unit = "s" },
  # Per PageRank iteration (10 iterations); not meaningful for wcc and bfs.
  { name = "s_per_iter", json = "/seconds_best", scale = 0.1, unit = "s" },
  { name = "peak_rss", json = "/peak_rss_gb", scale = 1073741824, unit = "B" },
]
reference = [
  { match = { algo = "wcc" }, metric = "seconds", value = 0.344, source = "idle re-run, kernels.jsonl friendster-mmap" },
  { match = { algo = "bfs" }, metric = "seconds", value = 0.340, source = "idle re-run, kernels.jsonl friendster-mmap" },
  { match = { algo = "pr32" }, metric = "s_per_iter", value = 3.37, source = "idle re-run, kernels.jsonl friendster-mmap (20 iterations)" },
]

# --- larger than RAM: Friendster under hard limits, cold cache ---------------------------

[[benchmark]]
name = "semiext-pr-friendster"
group = "semi-external"
description = "semi-external PageRank f32 (O_DIRECT streaming of the targets) under hard cgroup limits, cold"
dataset_path = "csr/friendster"
cache = "cold"
# 48G stands for the "none" row of the § B1 table.
matrix = { limit = ["48G", "16G", "8G", "2G"] }
memory_limit = "{limit}"
# As bench.sh: at 2 GiB, 5 iterations and 4 MiB chunks.
shell = "if [ {limit} = 2G ]; then a='--iters 5 --chunk-mb 4'; else a='--iters 10'; fi; exec {glab} semiext --graph {dataset} --algo pr32 --io direct --threads {threads} $a"
conditions = { graph = "friendster", kernel = "pr32", mode = "semi-external, O_DIRECT, cold", precision = "f32" }
metric = [
  { name = "s_per_iter", json = "/iter_seconds", reduce = "median", unit = "s" },
  { name = "read_gb_per_s", json = "/read_gb_per_s_wall", unit = "GB/s" },
  { name = "peak_rss", json = "/peak_rss_gb", scale = 1073741824, unit = "B" },
]
reference = [
  { match = { limit = "48G" }, metric = "s_per_iter", value = 3.704, source = "idle re-run, semiext.jsonl nolimit-semiext-direct (no limit), median per iteration" },
  { match = { limit = "8G" }, metric = "s_per_iter", value = 3.705, source = "idle re-run, semiext.jsonl lim8G-semiext-direct-pr32, median per iteration" },
  { match = { limit = "2G" }, metric = "s_per_iter", value = 3.638, source = "idle re-run, semiext.jsonl lim2G-semiext-direct-pr32, median per iteration" },
  # 16G: no idle measurement exists (shared run: 4.18 s/iter): reported, not gated (issue #4).
]

[[benchmark]]
name = "semiext-wcc-friendster"
group = "semi-external"
description = "semi-external WCC (O_DIRECT) under an 8 GiB limit, cold"
dataset_path = "csr/friendster"
cache = "cold"
memory_limit = "8G"
command = ["sh", "-c", "exec {glab} semiext --graph {dataset} --algo wcc --io direct --threads {threads}"]
conditions = { graph = "friendster", kernel = "wcc", mode = "semi-external, O_DIRECT, cold", precision = "integer" }
metric = [
  { name = "seconds", json = "/seconds", unit = "s" },
  { name = "peak_rss", json = "/peak_rss_gb", scale = 1073741824, unit = "B" },
]
reference = [
  { metric = "seconds", value = 3.55, source = "idle re-run, semiext.jsonl lim8G-semiext-direct-wcc" },
]

[[benchmark]]
name = "mmap-naive-friendster-16g"
group = "semi-external"
description = "naive memory-mapped PageRank f32 under a 16 GiB limit, cold: 5 iterations"
dataset_path = "csr/friendster"
cache = "cold"
memory_limit = "16G"
command = ["sh", "-c", "exec {glab} run --graph {dataset} --algo pr32 --load mmap --threads {threads} --iters 5"]
conditions = { graph = "friendster", kernel = "pr32", mode = "naive mmap, cold (first iteration reads the graph)", precision = "f32" }
metric = [
  { name = "s_per_iter", json = "/seconds_best", scale = 0.2, unit = "s" },
  { name = "peak_rss", json = "/peak_rss_gb", scale = 1073741824, unit = "B" },
]
reference = [
  { metric = "s_per_iter", value = 3.56, source = "idle re-run, semiext.jsonl lim16G-mmap-naive-pr32 (17.81 s / 5)" },
]

[[benchmark]]
name = "mmap-naive-friendster-8g"
group = "semi-external"
description = "naive memory-mapped PageRank f32 under an 8 GiB limit, cold: 2 iterations, thrashing"
dataset_path = "csr/friendster"
cache = "cold"
memory_limit = "8G"
command = ["sh", "-c", "exec {glab} run --graph {dataset} --algo pr32 --load mmap --threads {threads} --iters 2"]
conditions = { graph = "friendster", kernel = "pr32", mode = "naive mmap, cold, graph larger than the limit", precision = "f32" }
