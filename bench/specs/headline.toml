# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# The headline numbers of the first lab (docs/FINDINGS.md § B1): ingest, in-RAM kernels and
# larger-than-RAM PageRank/WCC, measured with the lab prototype `glab` (lab/b1-core),
# which this spec builds. The tables of § B1 were taken on a shared machine; the
# references below are the idle re-run of 2026-11-24 (lab/b1-core/results/bench/*.jsonl,
# summarized in FINDINGS "Idle-machine re-runs"), which supersedes them.
#
# Differences from lab/b1-core/bench.sh, on purpose:
# - every run is under a hard memory limit; the lab ran ingest and in-RAM kernels without
#   one. Limits are set well above what the run uses (the tool's own --mem-gb budget is
#   what is measured); the Friendster runs get 48 GiB.
# - each repetition is a separate process (3 per case after one warm-up), not --reps
#   inside one process; `glab run` still does 2 in-process repetitions and reports the
#   best, as the lab did, and that is the `seconds` metric.
# - the larger-than-RAM cases run cold on private copies (the lab evicted the shared
#   files); naive mmap under a limit has no warm-up.
# - "limit: none" of the § B1 table is a 48 GiB limit here.
# - Friendster PageRank in RAM runs 10 iterations, not 20 (per-iteration time is the
#   metric).
#
# References use the statistic the harness reports for the same quantity: the median
# over the lab's repetitions where it ran several (ingest of lj and orkut: 3 runs), the
# in-process best that `glab run` prints (kernels: the lab also ran one process, best of
# 2 or 3 in it), and the median of the per-iteration times (semi-external). The harness
# then takes the median over its own repetitions. Gated, as issue #4 says: ingest,
# kernels, semi-external and naive mmap under 8/16 GiB (the idle rows of semiext.jsonl);
# semi-external PageRank at 16 GiB has no idle value and is reported, not gated.
#
# Run (about 30 minutes, an estimate from the idle re-run's timings, plus 5 minutes of
# preparation the first time): everygraph-bench run headline --official --data /home/tux/graphlab/data

schema = 1
name = "headline"
description = "FINDINGS § B1 with the lab prototype: ingest, in-RAM kernels, larger than RAM"
reference = "docs/FINDINGS.md § B1 and § Idle-machine re-runs; lab/b1-core/results/bench/"

# Every row records the SHA-256 of the lab binary that produced it.
binaries = ["{glab}"]

[defaults]
memory_limit = "8G"
repetitions = 3
threads = [32]
timeout = "10m"

[vars]
glab = "{repo}/lab/b1-core/target/release/glab"
inputs = "{work}/inputs"
csr = "{data}/csr"
ingest_out = "--out {case_work}/out --tmp {case_work}/tmp"

# --- preparation (untimed) ------------------------------------------------------------

[[prepare]]
name = "build-glab"
# The lab's own flags (target-cpu=native, lto=fat) come from lab/b1-core/.cargo/config.toml,
# which cargo reads from the working directory.
cwd = "{repo}/lab/b1-core"
command = ["cargo", "build", "--release", "--offline", "--locked"]

[[prepare]]
name = "text-lj"
shell = "mkdir -p {inputs} && pigz -dc {data}/raw/com-lj.ungraph.txt.gz > {inputs}/lj.txt.part && mv {inputs}/lj.txt.part {inputs}/lj.txt"
creates = "{inputs}/lj.txt"
needed_by = ["ingest-text", "ingest-variants", "ingest-1thread"]

[[prepare]]
name = "text-orkut"
shell = "mkdir -p {inputs} && pigz -dc {data}/raw/com-orkut.ungraph.txt.gz > {inputs}/orkut.txt.part && mv {inputs}/orkut.txt.part {inputs}/orkut.txt"
creates = "{inputs}/orkut.txt"
needed_by = ["ingest-text", "ingest-variants", "ingest-1thread"]

[[prepare]]
name = "text-friendster"
# 31 GiB of text, about 100 s.
shell = "mkdir -p {inputs} && pigz -dc {data}/raw/com-friendster.ungraph.txt.gz > {inputs}/friendster.txt.part && mv {inputs}/friendster.txt.part {inputs}/friendster.txt"
creates = "{inputs}/friendster.txt"
needed_by = ["ingest-friendster"]

# --- ingest: text edge list -> validated symmetric CSR (glab-csr-v0) -----------------

[[benchmark]]
name = "ingest-text"
group = "ingest"
description = "text edge list to CSR in RAM-budget mode, as FINDINGS § B1 'Ingest'"
dataset_path = "raw/com-{graph}.ungraph.txt.gz"
matrix = { graph = ["lj", "orkut"] }
command = ["sh", "-c", "exec {glab} ingest --input {inputs}/{graph}.txt {ingest_out} --mem-gb 8 --threads {threads} --out-mmap"]
conditions = { graph = "{graph}", input = "plain text, page cache warm", budget = "8 GB (--mem-gb)", fsync = "no", precision = "n/a (integer CSR)" }
metric = [
  { name = "seconds", json = "/seconds", unit = "s" },
  { name = "medges_per_s", json = "/edges_per_s", scale = 1e-6, unit = "M edges/s" },
  { name = "peak_rss", json = "/peak_rss_gb", scale = 1073741824, unit = "B" },
]
reference = [
  { match = { graph = "lj" }, metric = "seconds", value = 0.428, source = "idle re-run, ingest.jsonl plain-lj, median of 3" },
  { match = { graph = "orkut" }, metric = "seconds", value = 0.889, source = "idle re-run, ingest.jsonl plain-orkut, median of 3" },
]

[[benchmark]]
name = "ingest-variants"
group = "ingest"
description = "the other ingest rows of the idle re-run: small budget, parse only, from gzip"
dataset_path = "raw/com-{graph}.ungraph.txt.gz"
matrix = { graph = ["lj", "orkut"], variant = ["budget0.25GB", "parse-only", "pigz-pipe", "gz-inprocess"] }
# One shell line per variant, selected by {variant}.
shell = """
case {variant} in
  budget0.25GB) exec {glab} ingest --input {inputs}/{graph}.txt {ingest_out} --mem-gb 0.25 --threads {threads} --direct-in ;;
  parse-only)   exec {glab} ingest --input {inputs}/{graph}.txt {ingest_out} --threads {threads} --parse-only ;;
  pigz-pipe)    pigz -dc {data}/raw/com-{graph}.ungraph.txt.gz | {glab} ingest --input - {ingest_out} --mem-gb 8 --threads {threads} ;;
  gz-inprocess) exec {glab} ingest --input {data}/raw/com-{graph}.ungraph.txt.gz --gz-inproc {ingest_out} --mem-gb 8 --threads {threads} ;;
esac
"""
conditions = { graph = "{graph}", variant = "{variant}", fsync = "no", precision = "n/a (integer CSR)" }
metric = [
  { name = "seconds", json = "/seconds", unit = "s" },
  # parse-only builds nothing and prints no RSS.
  { name = "peak_rss", json = "/peak_rss_gb", scale = 1073741824, unit = "B", optional = true },
]
reference = [
  { match = { graph = "lj", variant = "budget0.25GB" }, metric = "seconds", value = 0.500, source = "idle re-run, ingest.jsonl" },
  { match = { graph = "lj", variant = "parse-only" }, metric = "seconds", value = 0.047, source = "idle re-run, ingest.jsonl" },
  { match = { graph = "lj", variant = "pigz-pipe" }, metric = "seconds", value = 1.14, source = "idle re-run, ingest.jsonl" },
  { match = { graph = "lj", variant = "gz-inprocess" }, metric = "seconds", value = 1.24, source = "idle re-run, ingest.jsonl" },
  { match = { graph = "orkut", variant = "budget0.25GB" }, metric = "seconds", value = 1.574, source = "idle re-run, ingest.jsonl" },
  { match = { graph = "orkut", variant = "parse-only" }, metric = "seconds", value = 0.123, source = "idle re-run, ingest.jsonl" },
  { match = { graph = "orkut", variant = "pigz-pipe" }, metric = "seconds", value = 3.66, source = "idle re-run, ingest.jsonl" },
  { match = { graph = "orkut", variant = "gz-inprocess" }, metric = "seconds", value = 3.93, source = "idle re-run, ingest.jsonl" },
]

[[benchmark]]
name = "ingest-1thread"
group = "ingest"
description = "text edge list to CSR on one thread (the lab ran it without --out-mmap)"
dataset_path = "raw/com-{graph}.ungraph.txt.gz"
threads = [1]
matrix = { graph = ["lj", "orkut"] }
command = ["sh", "-c", "exec {glab} ingest --input {inputs}/{graph}.txt {ingest_out} --mem-gb 8 --threads {threads}"]
conditions = { graph = "{graph}", input = "plain text, page cache warm", budget = "8 GB (--mem-gb)", fsync = "no", precision = "n/a (integer CSR)" }
metric = [
  { name = "seconds", json = "/seconds", unit = "s" },
  { name = "peak_rss", json = "/peak_rss_gb", scale = 1073741824, unit = "B" },
]
reference = [
  { match = { graph = "lj" }, metric = "seconds", value = 1.22, source = "idle re-run, ingest.jsonl plain-1thread-lj" },
  { match = { graph = "orkut" }, metric = "seconds", value = 4.20, source = "idle re-run, ingest.jsonl plain-1thread-orkut" },
]

[[benchmark]]
name = "ingest-friendster"
group = "ingest"
description = "Friendster, 1.8 B edges from 31 GiB of text, at two RAM budgets"
dataset_path = "raw/com-friendster.ungraph.txt.gz"
memory_limit = "48G"
warmup = 0
matrix = { budget = ["32", "8"] }
command = ["sh", "-c", "exec {glab} ingest --input {inputs}/friendster.txt {ingest_out} --mem-gb {budget} --threads {threads} --direct-in --out-mmap"]
conditions = { graph = "friendster", input = "plain text, O_DIRECT", budget = "{budget} GB (--mem-gb)", fsync = "no", precision = "n/a (integer CSR)" }
metric = [
  { name = "seconds", json = "/seconds", unit = "s" },
  { name = "medges_per_s", json = "/edges_per_s", scale = 1e-6, unit = "M edges/s" },
  { name = "peak_rss", json = "/peak_rss_gb", scale = 1073741824, unit = "B" },
  { name = "temp_disk", json = "/temp_disk_gb", scale = 1e9, unit = "B", optional = true },
]
reference = [
  { match = { budget = "32" }, metric = "seconds", value = 21.1, source = "idle re-run, ingest.jsonl friendster-budget32GB" },
  # High variance even idle: 33-45 s in shared runs, 52.4 s idle (FINDINGS).
  { match = { budget = "8" }, metric = "seconds", value = 52.4, source = "idle re-run, ingest.jsonl friendster-budget8GB" },
]

# --- kernels in RAM (orkut), thread scaling --------------------------------------------

[[benchmark]]
name = "kernels-orkut"
group = "kernels"
description = "in-RAM kernels on orkut (heap-loaded CSR), 1 to 32 threads"
dataset_path = "csr/orkut"
threads = [1, 2, 4, 8, 16, 32]
matrix = { algo = ["pr32", "pr64", "wcc", "bfs", "kcore", "tc"] }
# As bench.sh: no triangles and no f64 PageRank below 4 threads.
exclude = [
  { algo = "tc", threads = 1 }, { algo = "tc", threads = 2 },
  { algo = "pr64", threads = 1 }, { algo = "pr64", threads = 2 },
]
shell = "reps=2; [ {algo} = tc ] && reps=1; exec {glab} run --graph {dataset} --algo {algo} --threads {threads} --load heap --reps $reps"
conditions = { graph = "orkut", kernel = "{algo}", load = "heap", storage = "uncompressed CSR, u32 ids", level = "in-process kernel, best of 2 (tc: 1)", precision = "integer" }
when = [
  { match = { algo = "pr32" }, conditions = { precision = "f32" } },
  { match = { algo = "pr64" }, conditions = { precision = "f64" } },
]
metric = [
  { name = "seconds", json = "/seconds_best", unit = "s" },
  { name = "load_seconds", json = "/load_seconds", unit = "s" },
  { name = "peak_rss", json = "/peak_rss_gb", scale = 1073741824, unit = "B" },
]
reference = [
  { match = { algo = "pr32", threads = 1 }, metric = "seconds", value = 3.57, source = "idle re-run, kernels.jsonl" },
  { match = { algo = "pr32", threads = 2 }, metric = "seconds", value = 1.87, source = "idle re-run, kernels.jsonl" },
  { match = { algo = "pr32", threads = 4 }, metric = "seconds", value = 0.96, source = "idle re-run, kernels.jsonl" },
  { match = { algo = "pr32", threads = 8 }, metric = "seconds", value = 0.53, source = "idle re-run, kernels.jsonl" },
  { match = { algo = "pr32", threads = 16 }, metric = "seconds", value = 0.37, source = "idle re-run, kernels.jsonl" },
  { match = { algo = "pr32", threads = 32 }, metric = "seconds", value = 0.38, source = "idle re-run, kernels.jsonl" },
  { match = { algo = "pr64", threads = 4 }, metric = "seconds", value = 1.16, source = "idle re-run, kernels.jsonl" },
  { match = { algo = "pr64", threads = 8 }, metric = "seconds", value = 0.65, source = "idle re-run, kernels.jsonl" },
  { match = { algo = "pr64", threads = 16 }, metric = "seconds", value = 0.43, source = "idle re-run, kernels.jsonl" },
  { match = { algo = "pr64", threads = 32 }, metric = "seconds", value = 0.46, source = "idle re-run, kernels.jsonl" },
  { match = { algo = "wcc", threads = 1 }, metric = "seconds", value = 0.081, source = "idle re-run, kernels.jsonl" },
  { match = { algo = "wcc", threads = 2 }, metric = "seconds", value = 0.045, source = "idle re-run, kernels.jsonl" },
  { match = { algo = "wcc", threads = 4 }, metric = "seconds", value = 0.025, source = "idle re-run, kernels.jsonl" },
  { match = { algo = "wcc", threads = 8 }, metric = "seconds", value = 0.016, source = "idle re-run, kernels.jsonl" },
  { match = { algo = "wcc", threads = 16 }, metric = "seconds", value = 0.013, source = "idle re-run, kernels.jsonl" },
  { match = { algo = "wcc", threads = 32 }, metric = "seconds", value = 0.015, source = "idle re-run, kernels.jsonl" },
  { match = { algo = "bfs", threads = 1 }, metric = "seconds", value = 0.0995, source = "idle re-run, kernels.jsonl" },
  { match = { algo = "bfs", threads = 2 }, metric = "seconds", value = 0.0535, source = "idle re-run, kernels.jsonl" },
  { match = { algo = "bfs", threads = 4 }, metric = "seconds", value = 0.0298, source = "idle re-run, kernels.jsonl" },
  { match = { algo = "bfs", threads = 8 }, metric = "seconds", value = 0.023, source = "idle re-run, kernels.jsonl" },
