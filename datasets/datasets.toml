# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# The dataset registry of Everygraph (issue #5). Read by `everygraph-bench`, which
# compiles this file in; the tables in datasets/README.md are generated from it with
# `everygraph-bench list --write-readme datasets/README.md`.
#
# No dataset is redistributed in this repository: each entry says where the source
# publishes it and under which terms. Read the terms before using a dataset.
#
# Fields (all checked by `everygraph-bench`, see crates/everygraph-bench/src/datasets/registry.rs):
#   name          command-line name: lowercase, digits, '-' and '.'
#   title         one line, with the source's own name for the graph
#   family        social | web | road | bipartite | weighted | temporal | directed-social | synthetic
#   tier          1 = CI (whole tier under ~1 GB), 2 = workstation, 3 = server, optional
#   directed, weighted, temporal
#   nodes, edges  as published by the source; `counts_note` says what they count and
#                 what was checked against the file
#   format, to_edge_list
#   page, licence, licence_url, citation, notes
#   unverified    fields NOT checked against the source (shown with † in the README)
#   generator     synthetic datasets only: generated locally, never downloaded
#   [[dataset.file]]  name, url, mirrors, size (bytes), sha256, md5_published (by the source)
#
# How values were obtained (2026-11-25): sizes from the servers' Content-Length; SHA-256
# computed by `everygraph-bench fetch` on a fresh download unless the entry says otherwise;
# counts from the source's dataset page (SNAP, GroupLens README, DIMACS10 page) or from the
# `.properties` file (LAW). Where a file was also checked against the published counts, the
# `counts_note` says so.

schema = 1

