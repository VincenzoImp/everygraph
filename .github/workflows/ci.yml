# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Continuous integration: every pull request, every push to main, nightly. The rules it
# follows are in CONTRIBUTING.md, "CI". Each step is a command of CONTRIBUTING.md, so
# that anything that fails here can be reproduced locally with the same command.
#
# Every job needs `lint`. Its first step, .github/scripts/ci_changes.py, decides from
# `git diff` of the merge commit which jobs a pull request needs. A push to main, the
# label `full-ci` and a change under .github/ run everything; so does a nightly run,
# unless main's last commit already passed a full run (then only `lint`, for new
# advisories and a new stable toolchain). `ci-ok` is the one check a merge waits for.

name: CI

on:
  pull_request:
    # `labeled`: adding `full-ci` starts a full run; other labels start nothing.
    types: [opened, synchronize, reopened, labeled]
    paths-ignore: &docs-only
      - "**.md"
      - "docs/**"
      - "plan/**"
      - "design/**"
      - "lab/**"
      - "bench/results/**"
      - "LICENSE*"
  push:
    branches: [main]
    paths-ignore: *docs-only
  schedule:
    # 03:41 UTC (off the hour, when scheduled runs are less often delayed).
    - cron: "41 3 * * *"
  # By hand everything runs; the two inputs narrow the `platforms` job, while one
  # platform's failure is being fixed:
  #   gh workflow run ci.yml --ref <branch> -f platform=macos -f packages="-p everygraph-bench"
  workflow_dispatch:
    inputs:
      platform:
        description: Which platforms the platforms job runs on
        type: choice
        options: [all, macos, windows, linux-arm]
        default: all
      packages:
        description: "What the platforms job lints and tests, as cargo arguments"
        type: string
        default: --workspace --exclude everygraph-memtest

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels the run it supersedes. Each push to main gets a
  # group of its own: in a shared group GitHub cancels a pending run when a newer one queues.
  # A label other than full-ci gets a group of its own, so that it cancels nothing.
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
    github.event.action == 'labeled' && github.event.label.name != 'full-ci'
    && format('-label-{0}', github.run_id) || '' }}${{
    github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: lint
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # The nightly run asks whether main's commit already passed.
      actions: read
    outputs:
      core: ${{ steps.changes.outputs.core }}
      oracle: ${{ steps.changes.outputs.oracle }}
      msrv: ${{ steps.changes.outputs.msrv }}
      fuzz_format: ${{ steps.changes.outputs.fuzz_format }}
      fuzz_ingest: ${{ steps.changes.outputs.fuzz_ingest }}
      platform: ${{ steps.changes.outputs.platform }}
      full: ${{ steps.changes.outputs.full }}
      test: ${{ steps.changes.outputs.test }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its parents: enough for `git diff HEAD^1 HEAD`.
          fetch-depth: 2
      - name: Already checked? (nightly run only)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success" --jq .total_count)"
          echo "successful push runs of $GITHUB_SHA: $n"
          if [ "$n" != "0" ]; then echo "ALREADY_CHECKED=1" >> "$GITHUB_ENV"; fi
      - name: Which jobs this run needs
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          python3 .github/scripts/ci_changes.py
          if [ "${ALREADY_CHECKED:-}" = 1 ]; then echo "test=false" >> "$GITHUB_OUTPUT"; else echo "test=true" >> "$GITHUB_OUTPUT"; fi
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --target i686-unknown-linux-gnu
          rustup default stable
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.20.2
      - name: cargo fmt
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path tools/wasm-toy/Cargo.toml --check
          cargo fmt --manifest-path tools/wasm-codec/Cargo.toml --check
          cargo fmt --manifest-path tools/canary/tsan/Cargo.toml --check
          rustfmt --edition 2024 --check tools/canary/portability/*.rs
      - name: cargo clippy (workspace)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo clippy (core, no default features)
        run: cargo clippy -p everygraph-core --no-default-features --all-targets --locked -- -D warnings
      - name: cargo clippy (core, i686)
        run: cargo clippy -p everygraph-core --target i686-unknown-linux-gnu --all-targets --locked -- -D warnings
      - name: cargo clippy (core, i686, no default features)
        run: cargo clippy -p everygraph-core --target i686-unknown-linux-gnu --no-default-features --all-targets --locked -- -D warnings
      - name: cargo clippy (format, i686)
        run: cargo clippy -p everygraph-format --target i686-unknown-linux-gnu --all-targets --locked -- -D warnings
      - name: cargo clippy (kernels, i686)
        run: cargo clippy -p everygraph-kernels --target i686-unknown-linux-gnu --all-targets --locked -- -D warnings
      - name: Portability checks of the core
        run: python3 tools/check_core_portability.py
      - name: The numerics lint list is the same in every clippy.toml
        run: python3 tools/numerics_lint.py --check
      # The advisory database is fetched from the network on every run (the runner has
      # it): a newly published advisory against a dependency fails the next run, which
      # is the point; the nightly run hears of one without a push.
      - name: cargo deny
        run: cargo deny --locked check
      # Lab experiments keep the lock they were measured with; the rest builds today.
      - name: Nested lock files outside lab/ are current
        run: |
          find . -name Cargo.lock -not -path ./Cargo.lock -not -path './lab/*' -not -path '*/target/*' |
            while read -r lock; do
              cargo metadata --locked --format-version 1 --manifest-path "$(dirname "$lock")/Cargo.toml" >/dev/null ||
                { echo "::error::$lock is stale: run cargo update --workspace in $(dirname "$lock")"; exit 1; }
            done
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  build:
    name: build
    needs: lint
    if: needs.lint.outputs.test == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.152
      # The oracle's own tests run when the oracle job does: the oracle crate has no
      # workspace dependency, so only its own files can break them, and those switch the
      # oracle flag on. A manifest change (a dependency) runs them too: the msrv job skips
      # its own run while the minimum is the current stable. Its seeded-bug tests run in
      # the oracle job only (.config/nextest.toml). The examples are left out: they were
      # a sixth of this build's CPU time (cargo --timings, 2026-11-27), lint's clippy
      # compiles them, and the readers job runs the ones it needs.
      - name: nextest archive
        env:
          EXCLUDE: ${{ needs.lint.outputs.oracle != 'true' && needs.lint.outputs.msrv != 'true' && '--exclude everygraph-oracle' || '' }}
        run: cargo nextest archive --workspace $EXCLUDE --lib --bins --tests --locked --archive-file "$RUNNER_TEMP/tests.tar.zst"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests
          path: ${{ runner.temp }}/tests.tar.zst
          retention-days: 1
          compression-level: 0
      - name: Doc tests (nextest does not run them)
        run: cargo test --workspace --doc --locked
      - name: cargo test (core, no default features)
        run: cargo test -p everygraph-core --no-default-features --locked

  # The archive is unpacked where the build job built it, so that the paths compiled into
  # the tests (`CARGO_BIN_EXE_*`, `CARGO_TARGET_TMPDIR`) hold.
  test:
    name: test ${{ matrix.partition }}/4
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.152
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tests
          path: ${{ runner.temp }}
      - name: nextest
        run: >-
          cargo nextest run --archive-file "$RUNNER_TEMP/tests.tar.zst"
          --workspace-remap . --extract-to . --extract-overwrite
          --partition hash:${{ matrix.partition }}/4

  wasm:
    name: wasm32
    needs: lint
    if: needs.lint.outputs.test == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown
          rustup default stable
          rustc --version
          node --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: wasm32 build (core, no default features)
        run: cargo build -p everygraph-core --target wasm32-unknown-unknown --no-default-features --locked
      - name: wasm32 build (everygraph-ingest)
        run: cargo build -p everygraph-ingest --target wasm32-unknown-unknown --locked
      - name: wasm32 build (everygraph-wasm)
        run: cargo build -p everygraph-wasm --target wasm32-unknown-unknown --locked
      # The adjacency codec, without and with the simd128 decoder (a compile-time
      # feature on wasm32); linted too, since clippy on Linux never compiles that code.
      - name: wasm32 build and clippy (format)
        run: cargo clippy -p everygraph-format --target wasm32-unknown-unknown --locked -- -D warnings
      - name: wasm32 build and clippy (format, simd128)
        env:
          RUSTFLAGS: -C target-feature=+simd128
          CARGO_TARGET_DIR: target/wasm-simd128
        run: cargo clippy -p everygraph-format --target wasm32-unknown-unknown --locked -- -D warnings
      # The edge-map framework and its kernels (#44), linted as wasm32 compiles them.
      - name: wasm32 build and clippy (kernels)
        run: cargo clippy -p everygraph-kernels --target wasm32-unknown-unknown --locked -- -D warnings
      - name: wasm32 build and clippy (community)
        run: cargo clippy -p everygraph-community --target wasm32-unknown-unknown --locked -- -D warnings
      - name: wasm32 build and clippy (map)
        run: cargo clippy -p everygraph-map --target wasm32-unknown-unknown --locked -- -D warnings
      - name: wasm32 build and clippy (query)
        run: cargo clippy -p everygraph-query --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Toy kernel and the edge-map kernels, native and wasm32 in Node, same hash
        run: python3 tools/check_wasm_toy.py
      # The simd128 adjacency decoder against the scalar one, in Node.
      - name: Adjacency codec, simd128 in Node against scalar, same as native
        run: python3 tools/check_wasm_codec.py

  readers:
    name: readers
    needs: lint
    if: needs.lint.outputs.test == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          node --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The .eg container: an independent Python reader, written from the specification,
      # lists and verifies a file the Rust writer made (#28).
      - name: Container, Python reader against the Rust writer
        run: python3 tools/check_container_python.py
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: |
            tools/check_columns_python.py
            tools/check_egmap_readers.py
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: The scripts' Python packages, from PyPI (retried once)
        run: |
          for script in tools/check_columns_python.py tools/check_egmap_readers.py; do
            uv sync --script "$script" || { sleep 15; uv sync --script "$script"; }
          done
      # Property columns: pyarrow and Polars read the columns the Rust writer made,
      # without Everygraph, and the statistics match an exact recomputation (#37).
      - name: Columns, pyarrow and Polars against the Rust writer
        run: uv run --script tools/check_columns_python.py
      # The map file (#68): the independent Python reader, written from the specification,
      # against the Rust reader; the official PMTiles readers for Python and JavaScript
      # fetch every tile the Rust writer wrote.
      - name: Map file, the Python reader and the official PMTiles readers
        run: uv run --script tools/check_egmap_readers.py
      # The Python package (#81): its wheel built by maturin, its tests against NetworkX.
      - name: Python package, built and tested
        run: tools/check_python_package.sh

  # Breaks the portability rule on purpose, one probe at a time, on a scratch copy;
  # fails if any probe is accepted.
  canary:
    name: portability canary
    needs: lint
    if: needs.lint.outputs.test == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown
          rustup default stable
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Portability canary
        run: python3 tools/check_portability_canary.py

  # Native tests with a 32-bit usize, with and without rayon. Linking for i686 needs the
  # 32-bit C runtime.
  i686:
    name: i686
    needs: lint
    if: needs.lint.outputs.test == 'true' && needs.lint.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust and the i686 target
        run: |
          rustup toolchain install stable --profile minimal --target i686-unknown-linux-gnu
          rustup default stable
          rustc --version
      # Only Ubuntu's own archive: a third-party repository of the runner image that
      # refuses the update (packages.microsoft.com, 403) must not fail the job.
      - name: Install gcc-multilib (retried once)
        run: |
          install() {
            sudo apt-get update -qq -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- &&
              sudo apt-get install -y -qq --no-install-recommends gcc-multilib
          }
          install || { sleep 15; install; }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test (core, i686)
        run: cargo test -p everygraph-core --target i686-unknown-linux-gnu --locked
      - name: cargo test (core, i686, no default features)
        run: cargo test -p everygraph-core --target i686-unknown-linux-gnu --no-default-features --locked
      - name: cargo test (format, i686)
        run: cargo test -p everygraph-format --target i686-unknown-linux-gnu --locked

  # The release profile (fat LTO): what a manifest or a profile can break. Full runs only.
  release:
    name: release build
    needs: lint
    if: needs.lint.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Release build
        run: cargo build --workspace --release --locked

  # The correctness oracle (issue #6): the CI corpus through NetworkX, python-igraph and
  # scipy, the in-process references, the toy kernel, the seeded bugs and the golden files
  # that need no network. The oracle crate's other Rust tests run in the `test` jobs, so
  # the script skips them here. uv is pinned like every other tool; the Python
  # interpreter and the packages are cached, written by main only.
  oracle:
    name: oracle
    needs: lint
    if: needs.lint.outputs.oracle == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: oracle
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: oracle/uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: oracle/run-ci.sh
        env:
          ORACLE_SKIP_RUST_TESTS: "1"
          # 2 workers × 2 GiB of address space each stay below the runner's memory, so an
          # oversized case becomes a recorded MemoryError, not an OOM kill.
          ORACLE_JOBS: "2"
          ORACLE_MEMORY_GIB: "2"
        run: oracle/run-ci.sh

  # On a pull request only when a manifest changed (rust-version, a dependency, a new
  # crate). Newer *std* APIs are caught on every run anyway by clippy's
  # `incompatible_msrv` lint, which reads rust-version; newer *language* features are
  # caught on main and nightly.
  msrv:
    name: MSRV (1.100)
    needs: lint
    if: needs.lint.outputs.msrv == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # While the minimum is also the current stable release, the test jobs have already
      # run these tests on the same compiler: the job stops after this step.
      - name: Install Rust 1.100, and compare it with stable
        id: toolchain
        run: |
          rustup toolchain install 1.100 stable --profile minimal
          rustc +1.100 -V
          rustc +stable -V
          if [ "$(rustc +1.100 -V)" = "$(rustc +stable -V)" ]; then
            echo "same=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Rust 1.100 is the current stable release; the test job ran these tests"
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.toolchain.outputs.same != 'true'
        with:
          key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        if: steps.toolchain.outputs.same != 'true'
        with:
          tool: cargo-nextest@0.9.152
      # nextest, so that the settings of .config/nextest.toml apply here too; it does not
      # run doc tests, hence the second command.
      - name: cargo +1.100 test
        if: steps.toolchain.outputs.same != 'true'
        run: |
          cargo +1.100 nextest run --workspace --locked
          cargo +1.100 test --workspace --doc --locked

  # Miri and ThreadSanitizer, on the pinned nightly, over the tests that reach `unsafe`
  # code (CONTRIBUTING.md, the `unsafe` table). On a pull request only when the core, a
  # module of that table or the nightly tooling changed. Each part runs its tests through
  # nextest: one Miri process per test, as many at once as the runner has cores.
  sanitizers:
    name: Miri and TSan (${{ matrix.title }})
    needs: lint
    if: needs.lint.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: io
            title: "I/O, codec, ingest"
          - part: kernels
            title: "edge map, memtest, TSan"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned nightly with Miri and rust-src
        run: |
          NIGHTLY="$(cat tools/nightly-toolchain)"
          echo "NIGHTLY=$NIGHTLY" >> "$GITHUB_ENV"
          rustup toolchain install "$NIGHTLY" --profile minimal --component miri,rust-src
          cargo "+$NIGHTLY" miri --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: sanitizers-${{ matrix.part }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache the Miri sysroots
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/miri
          key: miri-sysroot-${{ env.NIGHTLY }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.152
      - name: Miri, the refusing global allocator (everygraph-io/tests/allocation_failure.rs)
        if: matrix.part == 'io'
        run: cargo "+$NIGHTLY" miri test -p everygraph-io --test allocation_failure --locked
      - name: Miri, the page backend (everygraph-io/src/pages.rs)
        if: matrix.part == 'io'
        run: 'cargo "+$NIGHTLY" miri test -p everygraph-io --lib --locked pages::'
      # The adjacency codec: the scalar decoder, then the SSSE3 one (the only SIMD path
      # Miri interprets on this runner; compiled in so that run-time detection finds it).
      # The crate's other tests reach no `unsafe` code.
      - name: Miri, adjacency codec (scalar)
        if: matrix.part == 'io'
        run: cargo "+$NIGHTLY" miri nextest run -p everygraph-format --locked --lib --test adjacency -E 'binary(adjacency) | test(/^adjacency::/)'
      - name: Miri, adjacency codec (SSSE3)
        if: matrix.part == 'io'
        env:
          RUSTFLAGS: -C target-feature=+ssse3
        run: cargo "+$NIGHTLY" miri nextest run -p everygraph-format --locked --test adjacency
      # Tree Borrows because rayon's dependencies need it; isolation off because the
      # test's scratch is files.
      - name: Miri, the ingest heap counter (everygraph-ingest/tests/heap_peak.rs), Tree Borrows
        if: matrix.part == 'io'
        env:
          MIRIFLAGS: -Zmiri-tree-borrows -Zmiri-disable-isolation -Zmiri-ignore-leaks
        run: cargo "+$NIGHTLY" miri nextest run -p everygraph-ingest --test heap_peak --locked
      # The edge-map framework's node brand and unchecked indexing (#44), on rayon. The
      # kernels built on it reach no `unsafe` code of their own.
      - name: Miri, edge-map framework, Tree Borrows
        if: matrix.part == 'kernels'
        env:
          MIRIFLAGS: -Zmiri-tree-borrows -Zmiri-ignore-leaks
        run: cargo "+$NIGHTLY" miri nextest run -p everygraph-kernels --lib --locked -E 'test(/^edge_map::/)'
      # The readers on threads, under the no-OOM suite's counting allocator.
      - name: Miri, the counting allocator and the readers' heap (everygraph-memtest), Tree Borrows
        if: matrix.part == 'kernels'
        env:
          MIRIFLAGS: -Zmiri-tree-borrows -Zmiri-ignore-leaks
        run: cargo "+$NIGHTLY" miri nextest run -p everygraph-memtest --test counting --test readers --locked
      # On nightly, rustdoc checks the error code of `compile_fail,E0521`: the tests
      # that a node of one plan cannot index the state of another.
      - name: Node brand compile-fail tests (kernels doc tests, nightly)
        if: matrix.part == 'kernels'
        run: cargo "+$NIGHTLY" test -p everygraph-kernels --doc --locked
      - name: ThreadSanitizer (core tests, and a racy canary that must be caught)
        if: ${{ !cancelled() && matrix.part == 'kernels' }}
        run: python3 tools/check_tsan.py

  # The core under Miri. The core forbids `unsafe`, so a change to it alone adds none:
  # these runs check the standard library and rayon under the core's tests, and the
  # 32-bit `usize`. On a push to main, nightly and in a full run; the native i686 tests
  # (job `i686`) run on pull requests. Tests named `*full_size` are skipped: the numerics
  # golden vectors and the exact sum over chunks of 65,536 take minutes under Miri, and
  # run natively on every target. nextest does not run doc tests, hence the `--doc` runs.
  miri-core:
    name: Miri, core (${{ matrix.title }})
    needs: lint
    if: needs.lint.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: core
            title: "no default features, x86_64 and i686"
          - part: rayon
            title: "rayon, Tree Borrows"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned nightly with Miri and rust-src
        run: |
          NIGHTLY="$(cat tools/nightly-toolchain)"
          echo "NIGHTLY=$NIGHTLY" >> "$GITHUB_ENV"
          rustup toolchain install "$NIGHTLY" --profile minimal --component miri,rust-src
          cargo "+$NIGHTLY" miri --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: sanitizers-${{ matrix.part }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache the Miri sysroots
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/miri
          key: miri-sysroot-${{ env.NIGHTLY }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.152
      - name: Miri, no default features
        if: matrix.part == 'core'
        run: |
          cargo "+$NIGHTLY" miri nextest run -p everygraph-core --no-default-features --locked -E 'not test(full_size)'
          cargo "+$NIGHTLY" miri test -p everygraph-core --no-default-features --locked --doc
      - name: Miri, no default features, i686 (the 32-bit usize run)
        if: matrix.part == 'core'
        run: |
          cargo "+$NIGHTLY" miri nextest run -p everygraph-core --no-default-features --target i686-unknown-linux-gnu --locked -E 'not test(full_size)'
          cargo "+$NIGHTLY" miri test -p everygraph-core --no-default-features --target i686-unknown-linux-gnu --locked --doc
      - name: Miri, default features (rayon), Tree Borrows
        if: matrix.part == 'rayon'
        env:
          MIRIFLAGS: -Zmiri-tree-borrows -Zmiri-ignore-leaks
        run: |
          cargo "+$NIGHTLY" miri nextest run -p everygraph-core --locked -E 'not test(full_size)'
          cargo "+$NIGHTLY" miri test -p everygraph-core --locked --doc

  # The no-OOM suite at the nightly sizes (issue #53): the slope test up to 2^18 nodes,
  # the long search, and the cgroup matrix (graphs up to 2^22 nodes, budgets from a
  # quarter of each operation's peak to 8 GiB, each run in a `systemd-run` scope). Every
  # night, whatever main's last run did: its records are the evidence of the promise.
  # The pull-request part runs in the `test` jobs.
  no-oom:
    name: no-OOM, nightly sizes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: no-oom
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test --release -p everygraph-memtest -- --ignored
        env:
          EVERYGRAPH_MEMTEST_RECORDS: ${{ runner.temp }}/no-oom-records.txt
        run: cargo test --release -p everygraph-memtest --locked -- --ignored --test-threads 1 --nocapture
      - name: Upload the records
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: no-oom-records
          path: ${{ runner.temp }}/no-oom-records.txt
          if-no-files-found: warn


  # macOS arm64, Windows x86_64 and Linux aarch64. A pull request that touches the crates
  # whose code depends on the platform tests those crates (`platform` flag); a full run
  # tests the workspace. The no-OOM suite (everygraph-memtest) measures Linux cgroups and
  # the Linux allocator path, so it runs on Linux x86_64 only.
  platforms:
    name: platforms (${{ matrix.os }})
    needs: lint
    if: needs.lint.outputs.platform == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON(
            inputs.platform == 'macos' && '["macos-15"]'
            || inputs.platform == 'windows' && '["windows-2025"]'
            || inputs.platform == 'linux-arm' && '["ubuntu-24.04-arm"]'
            || '["macos-15", "windows-2025", "ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.os }}
    # Windows, the slowest: 3 min on the four crates with a warm cache; 21 to 40 min on
    # the workspace (five pushes to main, 2026-11-27).
    timeout-minutes: ${{ github.event_name == 'pull_request' && 20 || 65 }}
    defaults:
      run:
        shell: bash
    env:
      PACKAGES: >-
        ${{ inputs.packages || (github.event_name == 'pull_request'
        && '-p everygraph-core -p everygraph-io -p everygraph-format -p everygraph-ingest'
        || '--workspace --exclude everygraph-memtest') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown
          rustup default stable
          rustc --version --verbose
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Clippy on each platform: it compiles code under that platform's `cfg`, which
      # the Linux lint runs never see.
      - name: clippy
        run: cargo clippy $PACKAGES --all-targets --locked -- -D warnings
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.152
      # The adjacency codec's tests run its SIMD decoder for the platform (NEON on
      # arm64). nextest does not run doc tests, hence the second command.
      - name: nextest
        run: |
          cargo nextest run $PACKAGES --no-tests=warn --locked
          cargo test $PACKAGES --doc --locked
      - name: cargo test (core, no default features)
        run: cargo test -p everygraph-core --no-default-features --locked
      - name: wasm32 build (core, no default features)
        run: cargo build -p everygraph-core --target wasm32-unknown-unknown --no-default-features --locked

  # Each fuzz target's committed corpus, once (CONTRIBUTING.md, "Fuzzing"). The longer
  # runs are in fuzz.yml.
  fuzz-replay:
    name: fuzz replay
    needs: lint
    if: needs.lint.outputs.test == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before the install step, so that the cargo-fuzz it builds is new to the cache and
      # gets saved (binaries already in ~/.cargo/bin at restore are left out).
      # `shared-key`: fuzz.yml's jobs read the same cache.
      - &fuzz-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: fuzz
          workspaces: |
            crates/everygraph-format/fuzz -> target
            crates/everygraph-ingest/fuzz -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - &fuzz-nightly
        name: Install the pinned nightly and cargo-fuzz
        run: |
          rustup toolchain install "$(cat tools/nightly-toolchain)" --profile minimal
          command -v cargo-fuzz || cargo install cargo-fuzz --version 0.13.2 --locked
      - name: tools/fuzz.sh replay
        run: tools/fuzz.sh replay

  # 5 minutes per target of a crate the pull request changed. Advisory, so not in ci-ok:
  # a crash it finds is a bug to fix before merging; a broken nightly toolchain is not.
  fuzz-campaign:
    name: fuzz ${{ matrix.target }}, 5 min (advisory)
    needs: [lint, fuzz-replay]
    if: >-
      github.event_name == 'pull_request' && (needs.lint.outputs.fuzz_format == 'true'
      || needs.lint.outputs.fuzz_ingest == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: >-
          ${{ fromJSON(
            needs.lint.outputs.fuzz_format == 'true' && needs.lint.outputs.fuzz_ingest == 'true'
            && '["adjacency", "container", "columns", "hierarchy", "egmap", "text"]'
            || needs.lint.outputs.fuzz_format == 'true'
            && '["adjacency", "container", "columns", "hierarchy", "egmap"]'
            || '["text"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *fuzz-cache
      - *fuzz-nightly
      - name: tools/fuzz.sh run ${{ matrix.target }} 300
        run: tools/fuzz.sh run "${{ matrix.target }}" 300
      - name: Upload what crashed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: crates/*/fuzz/artifacts/
          if-no-files-found: ignore

  # The one check a merge waits for: every job above passed or was not needed.
  ci-ok:
    name: ci-ok
    needs: [lint, build, test, wasm, readers, canary, i686, release, oracle, msrv, sanitizers, miri-core, no-oom, platforms, fuzz-replay]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: A job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
