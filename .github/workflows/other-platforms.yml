# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# macOS arm64, Windows x86_64 and Linux aarch64. A pull request that touches the crates
# whose code depends on the platform (the core, I/O, the on-disk format, ingest) tests
# those crates. A push to main, the weekly run and a run by hand test the workspace.
#
# Run it on a branch: gh workflow run other-platforms.yml --ref <branch>
# One platform and one crate, while fixing one failure:
#   gh workflow run other-platforms.yml --ref <branch> -f platform=macos -f packages="-p everygraph-bench"

name: Other platforms

on:
  pull_request:
    paths:
      - "crates/everygraph-core/**"
      - "crates/everygraph-io/**"
      - "crates/everygraph-format/**"
      - "crates/everygraph-ingest/**"
      - ".github/workflows/other-platforms.yml"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "plan/**"
      - "design/**"
      - "lab/**"
      - "bench/results/**"
      - "LICENSE*"
  schedule:
    # Mondays 04:17 UTC (off the hour, when scheduled runs are less often delayed).
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      platform:
        description: Which platforms
        type: choice
        options: [all, macos, windows, linux-arm]
        default: all
      packages:
        description: "What to lint and test, as cargo arguments"
        type: string
        default: --workspace

permissions:
  contents: read

concurrency:
  # Per platform, so that a run by hand for macOS does not cancel one for Windows; a new
  # push to a pull request cancels the run it supersedes. Each push to main gets a group
  # of its own.
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform || 'all' }}${{
    github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  platforms:
    name: Build and test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS arm64, Windows x86_64, Linux aarch64; only one when run by hand with
        # `platform`.
        os: >-
          ${{ fromJSON(
            inputs.platform == 'macos' && '["macos-15"]'
            || inputs.platform == 'windows' && '["windows-2025"]'
            || inputs.platform == 'linux-arm' && '["ubuntu-24.04-arm"]'
            || '["macos-15", "windows-2025", "ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      # The no-OOM suite (everygraph-memtest) measures Linux cgroups and the Linux
      # allocator path, so it runs in ci.yml only.
      PACKAGES: >-
        ${{ inputs.packages || (github.event_name == 'pull_request'
        && '-p everygraph-core -p everygraph-io -p everygraph-format -p everygraph-ingest'
        || '--workspace --exclude everygraph-memtest') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown
          rustup default stable
          rustc --version --verbose
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Clippy on each platform: it compiles code under that platform's `cfg`, which
      # the Linux lint runs never see.
      - name: clippy
        run: cargo clippy $PACKAGES --all-targets --locked -- -D warnings
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.152
      # The adjacency codec's tests run its SIMD decoder for the platform (NEON on
      # arm64). nextest does not run doc tests, hence the second command.
      - name: nextest
        run: |
          cargo nextest run $PACKAGES --no-tests=warn --locked
          cargo test $PACKAGES --doc --locked
      - name: cargo test (core, no default features)
        run: cargo test -p everygraph-core --no-default-features --locked
      - name: wasm32 build (core, no default features)
        run: cargo build -p everygraph-core --target wasm32-unknown-unknown --no-default-features --locked
