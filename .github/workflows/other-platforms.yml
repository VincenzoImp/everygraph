# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# What the self-hosted lab runner of ci.yml cannot check: macOS arm64, Windows x86_64,
# Linux aarch64, and the core's native tests with a 32-bit usize (they link against
# gcc-multilib, which needs sudo to install). These run on GitHub-hosted runners and
# use the account's included minutes (macOS counts ten-fold, Windows two-fold), so: once
# a month and by hand, and only the crates whose portability matters — the core, the
# I/O layer and ingest (everything else is above them and platform-neutral code).
#
# Run it on a branch: gh workflow run other-platforms.yml --ref <branch>
# Cheaper while fixing one platform's failure:
#   gh workflow run other-platforms.yml --ref <branch> -f platform=macos -f packages="-p everygraph-io"

name: Other platforms (monthly)

on:
  schedule:
    # The 3rd of each month, 04:17 UTC (off the hour, when scheduled runs are less
    # often delayed).
    - cron: "17 4 3 * *"
  workflow_dispatch:
    inputs:
      platform:
        description: Which platforms
        type: choice
        options: [all, macos, windows, linux-arm, i686]
        default: all
      packages:
        description: "What to lint and test, as cargo arguments"
        type: string
        default: -p everygraph-core -p everygraph-io -p everygraph-ingest

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  PACKAGES: ${{ inputs.packages || '-p everygraph-core -p everygraph-io -p everygraph-ingest' }}

# No cache: a monthly run would never find one (GitHub evicts caches unused for a week),
# and uploading one costs minutes.
jobs:
  platforms:
    name: Build and test on ${{ matrix.os }}
    if: inputs.platform != 'i686'
    strategy:
      fail-fast: false
      matrix:
        # macOS arm64, Windows x86_64, Linux aarch64; only one when run by hand with
        # `platform`.
        os: >-
          ${{ fromJSON(
            inputs.platform == 'macos' && '["macos-15"]'
            || inputs.platform == 'windows' && '["windows-2025"]'
            || inputs.platform == 'linux-arm' && '["ubuntu-24.04-arm"]'
            || '["macos-15", "windows-2025", "ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown
          rustup default stable
          rustc --version --verbose
      # Clippy on each platform: it compiles code under that platform's `cfg`, which
      # the Linux lint runs never see.
      - name: cargo clippy (${{ env.PACKAGES }})
        run: cargo clippy $PACKAGES --all-targets --locked -- -D warnings
      - name: cargo test (${{ env.PACKAGES }})
        run: cargo test $PACKAGES --locked
      - name: cargo test (core, no default features)
        run: cargo test -p everygraph-core --no-default-features --locked
      - name: wasm32 build (core, no default features)
        run: cargo build -p everygraph-core --target wasm32-unknown-unknown --no-default-features --locked

  # Native tests with a 32-bit usize, with and without rayon (Miri covers the same tests
  # without rayon on every core change, in ci.yml). Linking for i686 needs the 32-bit C
  # runtime.
  i686:
    name: Core tests natively on i686
    if: inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'i686'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust, the i686 target and gcc-multilib
        run: |
          rustup toolchain install stable --profile minimal --target i686-unknown-linux-gnu
          rustup default stable
          rustc --version
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gcc-multilib
      - name: cargo test (core, i686)
        run: cargo test -p everygraph-core --target i686-unknown-linux-gnu --locked
      - name: cargo test (core, i686, no default features)
        run: cargo test -p everygraph-core --target i686-unknown-linux-gnu --no-default-features --locked
