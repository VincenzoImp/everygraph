<!doctype html>

<head>

<title>Everygraph style — connections without a selection (preview, real data)</title>
<!--
  STYLE PREVIEW — NOT PRODUCT CODE. Issue #20 (plan/issues/m1-06-edge-rendering.md).
  Adds to the approved viewer (viewer.html): an overview of how the regions of the current parent connect,
  readable with nothing selected. Links for the selection stay as approved.
  Data: the lab map of com-LiveJournal and com-Orkut (lab/e-map layout on the shaped hierarchies), exact counts written
  by lab/m1-06-edge-rendering/overview.py into viewer-assets/overview-*.js. Colours, sizes and durations come from
  assets/tokens.css. Every state is addressable through the URL hash; see "Preview options".
-->
<link rel="stylesheet" href="assets/fonts.css">

<style>
/* the curated data palette of viewer.html and data.html (same block) */
html[data-theme="light"] {
  --d1: #7861cb; --d2: #604100; --d3: #739400; --d4: #522e95; --d5: #c36f8b;
  --s1: #dde4f9; --s2: #b9c6ef; --s3: #97a8e4; --s4: #768ad8; --s5: #576bcb; --s6: #3d4cb8; --s7: #2a3590;
}
html[data-theme="dark"] {
  --d1: #9383dc; --d2: #f1b959; --d3: #6e8a25; --d4: #d9d0ff; --d5: #c26083;
  --s1: #222741; --s2: #343b6a; --s3: #475195; --s4: #5c69bc; --s5: #7483e0; --s6: #90a0f9; --s7: #b3c0ff;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }

.tag { display: inline-block; height: 20px; line-height: 18px; padding: 0 6px; border-radius: var(--radius-xs); font-size: var(--text-xs); font-weight: var(--weight-medium); border: var(--border) solid var(--line); white-space: nowrap; }
.tag.dashed { border-style: dashed; border-color: var(--line-strong); color: var(--muted); }
.btn { height: var(--control-md); display: inline-flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-3); border-radius: var(--radius-sm); border: var(--border) solid var(--line-strong); background: var(--surface); font-size: var(--text-sm); font-weight: var(--weight-medium); white-space: nowrap; transition: background var(--dur-fast) var(--ease); }
.btn:hover { background: var(--surface-2); }

.lnk { color: var(--accent-ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; background: none; border: 0; padding: 0; font-size: inherit; }

#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
#top { flex: none; height: var(--topbar); display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-3) 0 var(--space-4); border-bottom: var(--border) solid var(--line); }
.brand { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
.brand .logo { width: var(--control-sm); height: var(--control-sm); flex: none; }
.brand .fname { font-family: var(--font-mono); font-weight: var(--weight-medium); font-size: var(--text-sm); }
.brand .gcount { color: var(--ink-2); font-size: var(--text-xs); line-height: var(--lh-xs); white-space: nowrap; }
.topsp { flex: 1; }
.tb { height: var(--control-md); display: inline-flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-2); border: var(--border) solid transparent; border-radius: var(--radius-sm); background: none; color: var(--ink-2); font-size: var(--text-sm); font-weight: var(--weight-medium); }

#body { position: relative; flex: 1 1 0; min-height: 0; }

#legend { left: var(--space-3); top: calc(var(--control-md) + var(--space-5)); width: 272px; background: var(--surface); border: var(--border) solid var(--line); border-radius: var(--radius-md); padding: var(--space-3); font-size: var(--text-sm); line-height: var(--lh-sm); }
#legend h4 { font-size: var(--text-sm); font-weight: var(--weight-semibold); margin-bottom: var(--space-2); }
#legend .lr { display: grid; grid-template-columns: 44px 1fr; gap: var(--space-2); align-items: center; padding: 3px 0; color: var(--ink-2); }
#legend .lr svg { width: 44px; height: 16px; }
#legend .readout { margin-top: var(--space-2); padding-top: var(--space-2); border-top: var(--border) solid var(--line); color: var(--ink-2); }
#legend .readout b { color: var(--ink); font-weight: var(--weight-medium); }
#zoomctl { right: var(--space-3); bottom: var(--space-3); display: flex; flex-direction: column; background: var(--surface); border: var(--border) solid var(--line); border-radius: var(--radius-sm); overflow: hidden; }
#zoomctl button { width: var(--control-md); height: var(--control-md); border: 0; background: none; display: grid; place-items: center; color: var(--ink-2); }

#tooltip { position: absolute; z-index: 6; pointer-events: none; background: var(--surface); border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3); box-shadow: var(--shadow-pop); font-size: var(--text-sm); line-height: var(--lh-sm); white-space: nowrap; display: none; }

/* preview options: a tool that is not part of the product (dashed outline) */
#optbtn { left: var(--space-3); bottom: var(--space-3); height: var(--control-md); padding: 0 var(--space-2); border: var(--border) dashed var(--line-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--ink-2); display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-sm); }
#optpop { left: var(--space-3); bottom: calc(var(--control-md) + var(--space-5)); width: 420px; background: var(--surface); border: var(--border) dashed var(--line-strong); border-radius: var(--radius-md); padding: var(--space-4); box-shadow: var(--shadow-pop); display: none; z-index: 20; }
#optpop h4 { font-size: var(--text-md); font-weight: var(--weight-semibold); margin-bottom: var(--space-1); }
#optpop p { margin: 0 0 var(--space-3); color: var(--muted); font-size: var(--text-xs); line-height: var(--lh-xs); }
.optrow { display: grid; grid-template-columns: 104px 1fr; align-items: center; gap: var(--space-2); margin: var(--space-2) 0; }
.optrow > span { color: var(--ink-2); font-size: var(--text-sm); }
.seg { display: flex; flex-wrap: wrap; background: var(--surface-2); border: var(--border) solid var(--line); border-radius: var(--radius-sm); padding: 2px; gap: 2px; }
.seg button { flex: 1; border: var(--border) solid transparent; background: none; border-radius: var(--radius-xs); height: 24px; padding: 0 var(--space-1); color: var(--ink-2); font-size: var(--text-sm); white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--accent-ink); font-weight: var(--weight-medium); border-color: var(--accent); }

/* the matrix: a card over the map, opened from the panel */
#matrix { left: var(--space-3); top: calc(var(--control-md) + var(--space-5)); bottom: var(--space-3); width: max-content; min-width: 560px; max-width: calc(100% - var(--space-3) - var(--control-md) - var(--space-5)); background: var(--surface); border: var(--border) solid var(--line); border-radius: var(--radius-md); display: none; flex-direction: column; z-index: 4; }
#matrix.open { display: flex; }
#matrix .mh { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-3) var(--space-2) var(--space-4); border-bottom: var(--border) solid var(--line); }
#matrix .mh h3 { font-size: var(--text-md); font-weight: var(--weight-semibold); flex: 1; }
#matrix .mh .seg { flex: none; }
#matrix .mx { position: relative; padding: var(--space-3) var(--space-4); overflow: auto; flex: 1 1 0; min-height: 0; }
#matrix .grid { display: grid; gap: 1px; width: max-content; }
#matrix .rh, #matrix .ch { font-family: var(--font-mono); font-size: var(--text-xs); line-height: 1; color: var(--ink-2); display: flex; align-items: center; gap: 4px; white-space: nowrap; }
#matrix .rh { justify-content: flex-end; padding-right: 4px; }
#matrix .ch { writing-mode: vertical-rl; transform: rotate(180deg); justify-content: flex-start; padding-top: 4px; }
#matrix .rh i, #matrix .ch i { width: 8px; height: 8px; border-radius: var(--radius-round); flex: none; }
#matrix .rh.hl, #matrix .ch.hl { color: var(--ink); font-weight: var(--weight-medium); }
/* under 13 px a cell is shorter than a 12 px label: every other key is written, and the highlighted ones */
#matrix .tight .odd:not(.hl) { color: transparent; }
#matrix .c { box-shadow: inset 0 0 0 1px var(--line); }
#matrix .c[style] { box-shadow: none; }
#matrix .c.d { background: repeating-linear-gradient(135deg, transparent 0 2px, var(--line-strong) 2px 3px); }
#matrix .c:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; z-index: 1; position: relative; }
#matrix .c.cur { box-shadow: inset 0 0 0 1.5px var(--ink); }
#matrix .mf { width: 0; min-width: 100%; border-top: var(--border) solid var(--line); padding: var(--space-2) var(--space-4) var(--space-3); font-size: var(--text-sm); line-height: var(--lh-sm); color: var(--ink-2); display: grid; gap: var(--space-2); }
#matrix .mf b { color: var(--ink); font-weight: var(--weight-medium); }
#matrix .ramp { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-xs); color: var(--muted); }
#matrix .ramp { flex-wrap: wrap; row-gap: 2px; }
#matrix .ramp > span:last-child { flex-basis: 100%; }
#matrix .ramp span.r { display: flex; gap: 1px; }

/* right panel */
#panel { position: absolute; z-index: 4; right: 0; top: 0; bottom: 0; width: var(--panel); background: var(--surface); border-left: var(--border) solid var(--line); display: none; flex-direction: column; }
#app.panel-open #panel { display: flex; }
.p-head { position: relative; padding: var(--space-4) var(--space-4) var(--space-3); border-bottom: var(--border) solid var(--line); }

.kg { width: 14px; height: 14px; border-radius: var(--radius-round); border: var(--border-strong) solid var(--kc, var(--ink-2)); flex: none; background: color-mix(in srgb, var(--kc, var(--ink-2)) 12%, transparent); }
.kg.derived { border-style: dashed; background: none; }
.p-head h2 { font-size: var(--text-xl); line-height: var(--lh-xl); font-weight: var(--weight-semibold); padding-right: var(--space-6); }
.p-path { margin-top: var(--space-1); color: var(--muted); font-size: var(--text-sm); }
.p-x { position: absolute; right: var(--space-2); top: var(--space-2); width: var(--control-sm); height: var(--control-sm); border: 0; border-radius: var(--radius-sm); background: none; color: var(--muted); display: grid; place-items: center; }
.p-x:hover { background: var(--surface-2); color: var(--ink); }
.p-note { margin-top: var(--space-3); padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); background: var(--surface-2); color: var(--ink-2); font-size: var(--text-sm); line-height: var(--lh-sm); }
.p-actions { display: flex; gap: var(--space-2); margin-top: var(--space-3); flex-wrap: wrap; }
.p-body { flex: 1 1 0; overflow: auto; min-height: 0; scrollbar-width: thin; }
.sec { padding: var(--space-3) var(--space-4) var(--space-4); border-bottom: var(--border) solid var(--line); }
.sec:last-child { border-bottom: 0; }
.sec h3 { margin-bottom: var(--space-2); display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-2); font-size: var(--text-xs); line-height: var(--lh-xs); font-weight: var(--weight-medium); color: var(--muted); letter-spacing: var(--tracking-wide); }
.sec h3 span { letter-spacing: 0; font-weight: var(--weight-regular); }
.stat { display: grid; grid-template-columns: 1fr auto; gap: 2px var(--space-3); align-items: baseline; padding: var(--space-1) 0; }
.stat .k { color: var(--ink-2); }
.stat .s { grid-column: 1/-1; display: flex; align-items: center; gap: var(--space-2); color: var(--muted); font-size: var(--text-xs); line-height: var(--lh-xs); }
.stat .s .meter { flex: 1; }
.meter { height: 3px; background: var(--surface-2); overflow: hidden; min-width: var(--space-6); }
.meter i { display: block; height: 100%; background: var(--ink-2); min-width: 1px; }
.rows { margin: 0 calc(var(--space-2) * -1); }
.row { display: grid; grid-template-columns: 20px 1fr auto; gap: 0 var(--space-2); align-items: center; padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm); cursor: pointer; min-height: var(--control-md); border: 0; background: none; width: 100%; text-align: left; }
.row:hover, .row.hl { background: var(--surface-2); }
.row .rk { color: var(--muted); font-size: var(--text-xs); text-align: right; }
.row .nm { min-width: 0; display: flex; align-items: center; gap: var(--space-2); white-space: nowrap; }
.row .nm .sw { width: 8px; height: 8px; border-radius: var(--radius-round); flex: none; }
.row .nm small { color: var(--muted); font-size: var(--text-xs); }
.row .w { text-align: right; font-size: var(--text-sm); }
.row .bar { grid-column: 2/4; height: 2px; background: var(--surface-2); margin-top: 2px; }

.shown { display: flex; justify-content: space-between; gap: var(--space-2); margin-top: var(--space-2); color: var(--muted); font-size: var(--text-sm); line-height: var(--lh-sm); }
#thumb { display: block; margin: var(--space-1) 0 var(--space-2); cursor: pointer; border-radius: var(--radius-xs); }
.toggle { display: flex; gap: var(--space-3); align-items: flex-start; cursor: pointer; border: 0; background: none; padding: 0; text-align: left; width: 100%; }

#caption { flex: none; min-height: var(--control-md); display: flex; align-items: center; gap: var(--space-2); padding: var(--space-1) var(--space-3) var(--space-1) var(--space-4); border-top: var(--border) solid var(--line); color: var(--ink-2); font-size: var(--text-xs); line-height: var(--lh-xs); }

<div id="app" class="panel-open">

<script>
'use strict';
const DATA = window.OVERVIEW_DATA, GRAPHS = { lj: 'com-LiveJournal', orkut: 'com-Orkut' };
const $ = s => document.querySelector(s), fmt = n => Math.round(n).toLocaleString('en-US');
const pct = (a, b, d = 1) => (b > 0 ? (100 * a / b).toFixed(d) : '0') + '%';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const F_VIRTUAL = 1, F_AGG = 8, F_SUBDIV = 16, TAU = Math.PI * 2;

/* ---------- state in the URL hash ---------- */
