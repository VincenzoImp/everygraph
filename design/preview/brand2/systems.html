<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Everygraph — visual identity, round 2: five systems (mockup)</title>
<meta name="viewport" content="width=1440">
<style>
/* ===== Everygraph identity, round 2: five systems descended from "B + A's mark" =====
   Colour custom properties are generated at load time from tokens.json and palettes.json.
   This file holds structure: type, shape, rules and the component language of each system. */
*{box-sizing:border-box}
html{background:#e6e6e2}
body{margin:0;background:#e6e6e2;color:#1b1b1b;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif}
.page{width:1440px;margin:0 auto;padding:26px 24px 90px}
.mock-tag{position:fixed;right:10px;bottom:10px;z-index:99;font:500 10.5px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;background:rgba(20,20,20,.72);color:#fff;padding:5px 8px;border-radius:3px;pointer-events:none}

/* ---------- page scaffolding (neutral, not part of any system) ---------- */
.intro h1{font-size:22px;margin:0 0 4px;font-weight:650;letter-spacing:-.01em}
.intro p{margin:0;color:#55554f;max-width:1080px;font-size:13.5px}
.intro code,.meta code{background:#d9d9d4;padding:1px 5px;border-radius:3px;font:12px ui-monospace,Menlo,Consolas,monospace}
.meta{display:flex;align-items:baseline;gap:12px;margin:26px 2px 8px;font-size:12px;color:#66665f}
.meta b{font-size:13px;color:#1b1b1b;font-weight:650}
.meta .r{margin-left:auto}
.sys{margin:44px 0 0}
.sys>.sys-title{display:flex;align-items:baseline;gap:14px;margin:0 2px 10px;border-top:2px solid #1b1b1b;padding-top:10px}
.sys>.sys-title .n{font:700 13px ui-monospace,Menlo,monospace;background:#1b1b1b;color:#fff;padding:3px 7px;border-radius:2px}
.sys>.sys-title h2{margin:0;font-size:22px;font-weight:650;letter-spacing:-.01em}
.sys>.sys-title span{color:#66665f;font-size:13.5px}
.sys>.sys-title a{margin-left:auto;font:12px ui-monospace,Menlo,monospace;color:#55554f}
.card{border-radius:5px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.14)}
.two{display:grid;grid-template-columns:1fr 1fr}
.pane{padding:22px 26px 26px;min-width:0}
body.only .ov,body.only .sys{display:none}
body.only .sys.show{display:block;margin-top:18px}
body.part .sys [data-part]{display:none}
body.part .sys [data-part].keep{display:block}
body.part .sys .two[data-part].keep,body.part .sys .type[data-part].keep,body.part .sys .comps[data-part].keep{display:grid}
body.part .sys .meta[data-part].keep{display:flex}
body.part .sys .sys-headcard{display:none}

/* ---------- tokens shared by all systems ---------- */
.eg{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  --ctl-h:36px;--bw:1px;--rule:1px;--num-size:1em;--mark-ring:var(--ink);--mark-dot:var(--accent);--mark-sq:var(--ink);--mark-on-sq:var(--bg);--mark-sq-dot:var(--accent)}
.eg[data-sys="1"]{
  --font-display:Inter,"IBM Plex Sans",system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;--font-body:var(--font-display);
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Noto Sans Mono","DejaVu Sans Mono",monospace;--font-num:var(--font-mono);--num-size:.92em;
  --r:0px;--display-w:700;--display-track:-.035em}
.eg[data-sys="2"]{
  --font-display:"Source Sans 3","Source Sans Pro","Noto Sans","Segoe UI",system-ui,sans-serif;--font-body:var(--font-display);
  --font-mono:"Source Code Pro","Noto Sans Mono",ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace;--font-num:var(--font-mono);--num-size:.93em;
  --r:3px;--display-w:700;--display-track:-.02em}
.eg[data-sys="3"]{
  --font-display:"IBM Plex Sans",Roboto,"Segoe UI",system-ui,sans-serif;--font-body:var(--font-display);
  --font-mono:"IBM Plex Mono","Roboto Mono","PT Mono","DejaVu Sans Mono",ui-monospace,monospace;--font-num:var(--font-mono);--num-size:.93em;
  --r:2px;--display-w:500;--display-track:-.015em;--mark-ring:var(--accent);--mark-dot:var(--hl);--mark-sq:#0f2640;--mark-on-sq:#5ec8f2;--mark-sq-dot:#ffd166}
.eg[data-sys="3"][data-theme="light"]{--mark-ring:var(--ink)}
.eg[data-sys="4"]{
  --font-display:"Source Serif 4","Source Serif Pro",Charter,"Bitstream Charter","Iowan Old Style","PT Serif",Georgia,serif;
  --font-body:Inter,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --font-mono:"JetBrains Mono","Noto Sans Mono",ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace;--font-num:var(--font-body);
  --r:1px;--display-w:600;--display-track:-.012em}
.eg[data-sys="5"]{
  --font-display:Arimo,"Liberation Sans",Arial,Helvetica,sans-serif;--font-body:var(--font-display);
  --font-mono:Cousine,"Liberation Mono","Courier New",monospace;--font-num:var(--font-body);
  --r:0px;--bw:1.5px;--rule:1.5px;--display-w:700;--display-track:-.025em;--mark-dot:var(--ink);--mark-sq-dot:var(--bg);
  --hatch:repeating-linear-gradient(135deg,var(--ink) 0 1px,transparent 1px 5px)}

.eg h1,.eg h2,.eg h3,.eg .display{font-family:var(--font-display);font-weight:var(--display-w);letter-spacing:var(--display-track);line-height:1.1;margin:0}
.eg a{color:var(--accent-ink);text-underline-offset:3px}
.eg p{margin:0}
.eg .num{font-family:var(--font-num);font-size:var(--num-size);font-variant-numeric:tabular-nums lining-nums}
.eg code,.eg .mono{font-family:var(--font-mono);font-size:.92em}
.eg svg.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* labels: the small text above things */
.eg .lbl{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.eg[data-sys="1"] .lbl{font-family:var(--font-mono);font-weight:500}
.eg[data-sys="2"] .lbl{font-size:12.5px;letter-spacing:0;text-transform:none;color:var(--ink2);font-weight:700}
.eg[data-sys="3"] .lbl{display:flex;align-items:center;gap:8px;font:400 11.5px/1.4 var(--font-mono);letter-spacing:.02em;text-transform:lowercase;color:var(--muted)}
.eg[data-sys="3"] .lbl::after{content:"";flex:1;border-top:1px solid var(--line)}
.eg[data-sys="4"] .lbl{font:italic 400 14px/1.3 var(--font-display);letter-spacing:0;text-transform:none;color:var(--ink2)}
.eg[data-sys="5"] .lbl{font-size:12px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:700}

/* ---------- buttons ---------- */
.eg .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--ctl-h);padding:0 16px;font:600 14px/1 var(--font-body);border-radius:var(--r);
  border:var(--bw) solid var(--accent);background:var(--accent);color:var(--on-accent);white-space:nowrap;text-decoration:none;cursor:pointer}
.eg .btn.sec{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.eg .btn.quiet{background:transparent;border-color:transparent;color:var(--accent-ink);padding:0 6px}
.eg .btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.eg .btn[disabled]{background:var(--surface2);border-color:var(--line);color:var(--muted);cursor:default}
.eg[data-sys="1"] .btn{font:500 12px/1 var(--font-mono);text-transform:uppercase;letter-spacing:.07em;background:var(--ink);border-color:var(--ink);color:var(--bg)}
.eg[data-sys="1"] .btn.accent{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.eg[data-sys="1"] .btn.sec{background:transparent;color:var(--ink);border-color:var(--ink)}
.eg[data-sys="1"] .btn.quiet{background:transparent;border-color:transparent;color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.eg[data-sys="1"] .btn.sm{font-size:11px}
.eg[data-sys="1"] .btn[disabled]{background:var(--surface2);border-color:var(--line);color:var(--muted)}
.eg[data-sys="2"] .btn{font-weight:700}
.eg[data-sys="2"] .btn.sec{background:var(--surface);border-color:var(--line-strong)}
.eg[data-sys="2"] .btn[disabled]{background:var(--surface2);border-color:var(--line);color:var(--muted)}
.eg[data-sys="3"] .btn{font:500 13px/1 var(--font-body);letter-spacing:.01em}
.eg[data-sys="3"] .btn.sec{border-color:var(--accent);color:var(--accent-ink)}
.eg[data-sys="3"] .btn.quiet{text-decoration:underline dashed;text-underline-offset:5px;text-decoration-thickness:1px}
.eg[data-sys="3"] .btn[disabled]{background:transparent;border:1px dashed var(--line-strong);color:var(--muted)}
.eg[data-sys="4"] .btn{font:500 13.5px/1 var(--font-body)}
.eg[data-sys="4"] .btn.sec{border-color:var(--ink)}
.eg[data-sys="4"] .btn.quiet{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.eg[data-sys="4"] .btn[disabled]{background:transparent;border-color:var(--line);color:var(--muted)}
.eg[data-sys="5"] .btn{font:700 13px/1 var(--font-body)}
.eg[data-sys="5"] .btn.sec{border-color:var(--ink)}
.eg[data-sys="5"] .btn.quiet{color:var(--ink);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
.eg[data-sys="5"] .btn[disabled]{background:var(--hatch);border-color:var(--ink);color:var(--ink)}
.eg[data-sys="5"] .btn[disabled] span{background:var(--bg);padding:2px 5px}

/* ---------- fields ---------- */
.eg .field{display:flex;align-items:center;gap:8px;height:var(--ctl-h);padding:0 11px;border:var(--bw) solid var(--line-strong);border-radius:var(--r);background:var(--surface);color:var(--ink);font:14px/1 var(--font-body);min-width:0;white-space:nowrap}
.eg .field .ph{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.eg .field svg{color:var(--muted)}
.eg .field .chev{margin-left:auto;color:var(--ink2)}
.eg .field kbd{margin-left:auto;font:11px/1 var(--font-mono);border:1px solid var(--line);padding:3px 5px;border-radius:var(--r);color:var(--muted)}
.eg .field .k{color:var(--muted)}
.eg .field.focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.eg .field .caret{width:1px;height:16px;background:var(--ink);margin-left:-6px}
.eg[data-sys="1"] .field{font:13px/1 var(--font-mono)}
.eg[data-sys="1"] .field.focus{border-color:var(--ink);box-shadow:0 0 0 2px var(--accent)}
.eg[data-sys="3"] .field{font-size:13px;background:var(--surface)}
.eg[data-sys="3"] .field .val{font-family:var(--font-mono);font-size:12.5px}
.eg[data-sys="4"] .field{border-width:0 0 1px;border-radius:0;background:transparent;padding:0 2px}
.eg[data-sys="4"] .field.boxed{border-width:1px;padding:0 10px;background:var(--surface)}
.eg[data-sys="4"] .field.focus{border-color:var(--accent);box-shadow:0 1px 0 var(--accent)}
.eg[data-sys="5"] .field{border-color:var(--ink)}
.eg[data-sys="5"] .field.focus{box-shadow:none;outline:3px solid var(--ink);outline-offset:2px}

.eg .toggle{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;white-space:nowrap}
.eg .toggle i{position:relative;width:32px;height:18px;border-radius:9px;background:var(--line-strong);flex:none}
.eg .toggle i::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--surface)}
.eg .toggle.on i{background:var(--accent)}
.eg .toggle.on i::after{left:16px;background:var(--on-accent)}
.eg[data-sys="1"] .toggle{font:12px var(--font-mono);text-transform:uppercase;letter-spacing:.06em}
.eg[data-sys="1"] .toggle i{border-radius:0;background:var(--bg);border:1px solid var(--ink)}
.eg[data-sys="1"] .toggle i::after{border-radius:0;background:var(--ink);top:2px;left:2px;width:12px;height:12px}
.eg[data-sys="1"] .toggle.on i{background:var(--accent)}
.eg[data-sys="1"] .toggle.on i::after{left:16px;background:var(--on-accent)}
.eg[data-sys="2"] .toggle i{border-radius:4px}
.eg[data-sys="2"] .toggle i::after{border-radius:2.5px;background:#fff}
.eg[data-sys="3"] .toggle i{border-radius:2px;background:transparent;border:1px solid var(--line-strong)}
.eg[data-sys="3"] .toggle i::after{border-radius:1px;background:var(--muted);top:2px;left:2px;width:12px;height:12px}
.eg[data-sys="3"] .toggle.on i{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,transparent)}
.eg[data-sys="3"] .toggle.on i::after{left:16px;background:var(--accent)}
.eg[data-sys="4"] .toggle i{height:1px;width:30px;background:var(--ink);border-radius:0;margin:9px 0}
.eg[data-sys="4"] .toggle i::after{top:-6px;left:0;width:13px;height:13px;background:var(--bg);border:1px solid var(--ink);box-sizing:border-box}
.eg[data-sys="4"] .toggle.on i{background:var(--accent)}
.eg[data-sys="4"] .toggle.on i::after{left:17px;background:var(--accent);border-color:var(--accent)}
.eg[data-sys="5"] .toggle i{width:16px;height:16px;border-radius:0;background:var(--bg);border:1.5px solid var(--ink)}
.eg[data-sys="5"] .toggle i::after{display:none}
.eg[data-sys="5"] .toggle.on i{background:var(--ink)}
.eg[data-sys="5"] .toggle.on i::before{content:"";position:absolute;left:4px;top:.5px;width:4px;height:9px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg)}

.eg .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);font-size:13.5px}
.eg .tabs span{padding:8px 13px 9px;color:var(--ink2);margin-bottom:-1px;white-space:nowrap}
.eg .tabs .on{color:var(--ink);font-weight:600;border-bottom:2px solid var(--accent)}
.eg[data-sys="1"] .tabs{gap:0;border-bottom:1px solid var(--ink);font:500 11.5px var(--font-mono);text-transform:uppercase;letter-spacing:.07em}
.eg[data-sys="1"] .tabs .on{background:var(--ink);color:var(--bg);border-bottom:0;font-weight:500}
.eg[data-sys="2"] .tabs .on{font-weight:700}
.eg[data-sys="3"] .tabs{font:12.5px var(--font-mono);gap:0;border-bottom-color:var(--line-strong)}
.eg[data-sys="3"] .tabs span{text-transform:lowercase}
.eg[data-sys="3"] .tabs .on{font-weight:400;color:var(--accent-ink);border:1px solid var(--line-strong);border-bottom:1px solid var(--bg);border-top:2px solid var(--accent);background:var(--bg)}
.eg[data-sys="4"] .tabs{border-bottom-color:var(--ink);gap:10px}
.eg[data-sys="4"] .tabs span{padding-left:2px;padding-right:2px}
.eg[data-sys="4"] .tabs .on{font-weight:500;border-bottom:3px solid var(--ink)}
.eg[data-sys="5"] .tabs{border-bottom:1.5px solid var(--ink);gap:14px}
.eg[data-sys="5"] .tabs span{padding-left:0;padding-right:0;color:var(--ink)}
.eg[data-sys="5"] .tabs .on{font-weight:700;border-bottom:4px solid var(--ink)}

/* ---------- table of exact numbers ---------- */
.eg table.nt{border-collapse:collapse;width:100%;font-size:13.5px}
.eg table.nt th{font-weight:600;color:var(--ink2);text-align:right;padding:6px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap;font-size:12.5px}
.eg table.nt td{text-align:right;padding:6px 10px;border-bottom:1px solid var(--line);font-family:var(--font-num);font-size:var(--num-size);font-variant-numeric:tabular-nums lining-nums;white-space:nowrap}
.eg table.nt th:first-child,.eg table.nt td:first-child{text-align:left}
.eg table.nt td.dim{color:var(--muted);font-family:var(--font-body);font-size:12.5px}
.eg table.nt tr.sel td{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.eg table.nt .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:0}
.eg[data-sys="1"] table.nt th{font:500 11px var(--font-mono);text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid var(--ink);border-top:2px solid var(--ink);padding:7px 10px}
.eg[data-sys="1"] table.nt .sw{border-radius:0}
.eg[data-sys="1"] table.nt tr.sel td{background:transparent;box-shadow:inset 0 -2px 0 var(--accent)}
.eg[data-sys="2"] table.nt th{font-weight:700;border-bottom-color:var(--line-strong)}
.eg[data-sys="3"] table.nt th{font:400 11.5px var(--font-mono);text-transform:lowercase;color:var(--muted);border-bottom:1px solid var(--line-strong)}
.eg[data-sys="3"] table.nt td{border-bottom:1px dashed var(--line)}
.eg[data-sys="3"] table.nt tr.sel td{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.eg[data-sys="3"] table.nt tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--hl)}
.eg[data-sys="4"] table.nt{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.eg[data-sys="4"] table.nt th{font:italic 400 13.5px var(--font-display);color:var(--ink);border-bottom:1px solid var(--ink)}
.eg[data-sys="4"] table.nt tr:last-child td{border-bottom:0}
.eg[data-sys="4"] table.nt tr.sel td{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.eg[data-sys="5"] table.nt{border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.eg[data-sys="5"] table.nt th{font-weight:700;color:var(--ink);border-bottom:1px solid var(--ink)}
.eg[data-sys="5"] table.nt td{border-bottom:0;padding-top:5px;padding-bottom:5px}
.eg[data-sys="5"] table.nt tr.sel td{background:var(--ink);color:var(--bg)}
.eg[data-sys="5"] table.nt .sw{outline:1.5px solid var(--bg)}

/* ---------- code ---------- */
.eg pre{margin:0}
.eg pre.code{font:12.5px/1.65 var(--font-mono);background:var(--surface2);color:var(--ink);padding:13px 16px;border-radius:var(--r);overflow:hidden;white-space:pre;tab-size:4}
.eg pre.code .k{color:var(--accent-ink)}.eg pre.code .s{color:var(--ink2)}.eg pre.code .c{color:var(--muted);font-style:italic}
.eg[data-sys="1"] pre.code{border-left:3px solid var(--ink)}
.eg[data-sys="1"] pre.code .k{font-weight:700}
.eg[data-sys="2"] pre.code{border:1px solid var(--line)}
.eg[data-sys="2"] pre.code .s{color:var(--ok)}
.eg[data-sys="3"] pre.code{background:var(--surface);border:1px solid var(--line);counter-reset:ln;padding-left:0}
.eg[data-sys="3"] pre.code .ln{display:block}
.eg[data-sys="3"] pre.code .ln::before{counter-increment:ln;content:counter(ln);display:inline-block;width:34px;margin-right:14px;text-align:right;color:var(--muted);border-right:1px solid var(--line);padding-right:8px;opacity:.75}
.eg[data-sys="3"] pre.code .k{color:var(--accent-ink)}
.eg[data-sys="3"] pre.code .s{color:var(--hl-ink,var(--hl))}
.eg[data-sys="4"] pre.code{background:transparent;border-top:1px solid var(--ink);border-bottom:1px solid var(--line-strong);border-radius:0;padding:12px 2px}
.eg[data-sys="4"] pre.code .s{color:var(--ok)}
.eg[data-sys="5"] pre.code{background:var(--bg);border:1.5px solid var(--ink)}
.eg[data-sys="5"] pre.code .k{color:var(--ink);font-weight:700}
.eg[data-sys="5"] pre.code .s{color:var(--ink)}

/* ---------- callouts ---------- */
.eg .co{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:var(--r);font-size:13.5px;color:var(--ink2);background:color-mix(in srgb,var(--st) 9%,var(--surface));border-left:3px solid var(--st)}
.eg .co.info{--st:var(--info)}.eg .co.warn{--st:var(--warn)}.eg .co.err{--st:var(--err)}.eg .co.ok{--st:var(--ok)}
.eg .co svg.ic{color:var(--st);margin-top:2px}
.eg .co b{color:var(--ink)}
.eg .co .tag{display:none}
.eg[data-sys="1"] .co{padding:0;background:transparent;border:1px solid var(--ink);gap:0;align-items:stretch}
.eg[data-sys="1"] .co svg.ic{display:none}
.eg[data-sys="1"] .co .tag{display:flex;align-items:center;justify-content:center;flex:none;width:78px;font:500 11px/1 var(--font-mono);text-transform:uppercase;letter-spacing:.07em;background:var(--st);color:#fff}
.eg[data-sys="1"] .co.info .tag{background:var(--accent);color:var(--on-accent)}
.eg[data-sys="1"] .co .body{padding:10px 12px}
.eg[data-sys="3"] .co{background:transparent;border:1px solid color-mix(in srgb,var(--st) 55%,var(--line));border-left:1px solid color-mix(in srgb,var(--st) 55%,var(--line));position:relative;padding:14px 14px 11px}
.eg[data-sys="3"] .co svg.ic{display:none}
.eg[data-sys="3"] .co .tag{display:block;position:absolute;top:-8px;left:10px;background:var(--bg);padding:0 6px;font:11.5px/1.3 var(--font-mono);text-transform:lowercase;color:var(--st)}
.eg[data-sys="4"] .co{background:transparent;border-left:0;border-top:1px solid var(--st);border-bottom:1px solid var(--line);border-radius:0;padding:10px 2px}
.eg[data-sys="4"] .co b:first-of-type{font:italic 600 14.5px var(--font-display);color:var(--st)}
.eg[data-sys="4"] .co.info b:first-of-type{color:var(--ink)}
.eg[data-sys="5"] .co{background:var(--bg);border:1px solid var(--ink);padding:10px 12px;color:var(--ink)}
.eg[data-sys="5"] .co.warn{border:1.5px dashed var(--ink)}
.eg[data-sys="5"] .co.err{border:1.5px solid var(--ink);border-left:10px solid var(--ink)}
.eg[data-sys="5"] .co.err b:first-of-type{background:var(--ink);color:var(--bg);padding:1px 5px}

/* ---------- tooltip ---------- */
.eg .tip{display:inline-block;background:var(--tip-bg,var(--ink));color:var(--tip-fg,var(--bg));border-radius:var(--r);padding:9px 12px 10px;font-size:12.5px;line-height:1.45;position:relative;min-width:210px}
.eg .tip b{display:block;font-size:13px;margin-bottom:3px}
.eg .tip dl{display:grid;grid-template-columns:1fr auto;gap:1px 18px;margin:0}
.eg .tip dt{opacity:.72}.eg .tip dd{margin:0;text-align:right;font-family:var(--font-num);font-size:var(--num-size);font-variant-numeric:tabular-nums}
.eg .tip::after{content:"";position:absolute;left:18px;bottom:-5px;width:10px;height:10px;background:inherit;transform:rotate(45deg)}
.eg .tip.noarrow::after{display:none}
.eg[data-sys="1"] .tip b{font:500 11px var(--font-mono);text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid currentColor;padding-bottom:5px;margin-bottom:5px}
.eg[data-sys="3"] .tip{background:var(--surface2);color:var(--ink);border:1px solid var(--line-strong)}
.eg[data-sys="3"] .tip b{font:400 12px var(--font-mono);color:var(--hl-ink,var(--hl))}
.eg[data-sys="3"] .tip::after{border:solid var(--line-strong);border-width:0 1px 1px 0;bottom:-6px}
.eg[data-sys="4"] .tip{background:var(--surface);color:var(--ink);border:1px solid var(--ink);box-shadow:3px 3px 0 color-mix(in srgb,var(--ink) 14%,transparent)}
.eg[data-sys="4"] .tip b{font:600 14.5px var(--font-display)}
.eg[data-sys="4"] .tip::after{border:solid var(--ink);border-width:0 1px 1px 0;bottom:-6px}
.eg[data-sys="5"] .tip b{font-weight:700}

/* ---------- progress with phases ---------- */
.eg .prog-top{display:flex;align-items:baseline;gap:12px;font-size:13.5px;margin-bottom:8px}
.eg .prog-top b{font-weight:600}.eg .prog-top .eta{margin-left:auto;color:var(--muted);font-size:12.5px}
.eg .prog-bar{display:flex;gap:3px;height:8px}
.eg .prog-bar i{position:relative;background:var(--surface2);border-radius:calc(var(--r)/1.5);overflow:hidden}
.eg .prog-bar i.done{background:var(--ink)}
.eg .prog-bar i b{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.eg .prog-lbl{display:flex;gap:3px;margin-top:6px;font-size:12px;color:var(--ink2)}
.eg .prog-lbl span{min-width:0;white-space:nowrap}
.eg .prog-lbl em{display:block;font-style:normal;color:var(--muted);font-family:var(--font-num);font-size:11.5px;font-variant-numeric:tabular-nums}
.eg .prog-lbl .cur{color:var(--ink);font-weight:600}
.eg .prog-lbl .todo{color:var(--muted)}
.eg[data-sys="1"] .prog-top b{font:500 12px var(--font-mono);text-transform:uppercase;letter-spacing:.06em}
.eg[data-sys="1"] .prog-bar{height:10px;gap:2px}
.eg[data-sys="1"] .prog-lbl{font:11px var(--font-mono);text-transform:uppercase;letter-spacing:.05em}
.eg[data-sys="2"] .prog-top b{font-weight:700}
.eg[data-sys="2"] .prog-bar{height:8px}
.eg[data-sys="2"] .prog-bar i.done{background:color-mix(in srgb,var(--accent) 55%,var(--ink))}
.eg[data-sys="2"] .prog-ticks{height:7px;margin-top:3px;background:repeating-linear-gradient(90deg,var(--line-strong) 0 1px,transparent 1px 8px);-webkit-mask:linear-gradient(#000 0 0) top/100% 4px no-repeat,repeating-linear-gradient(90deg,#000 0 1px,transparent 1px 40px);mask:linear-gradient(#000 0 0) top/100% 4px no-repeat,repeating-linear-gradient(90deg,#000 0 1px,transparent 1px 40px)}
.eg[data-sys="3"] .prog-bar{height:12px;gap:0}
.eg[data-sys="3"] .prog-bar i{background:transparent;border:1px solid var(--line-strong);border-left-width:0;border-radius:0}
.eg[data-sys="3"] .prog-bar i:first-child{border-left-width:1px}
.eg[data-sys="3"] .prog-bar i.done{background:color-mix(in srgb,var(--accent) 45%,transparent)}
.eg[data-sys="3"] .prog-bar i b{background:var(--accent);border-right:2px solid var(--hl)}
.eg[data-sys="3"] .prog-lbl{font:11.5px var(--font-mono);gap:0}
.eg[data-sys="3"] .prog-lbl span{border-left:1px solid var(--line-strong);padding:3px 0 0 6px}
.eg[data-sys="4"] .prog-bar{height:7px;gap:0;border:1px solid var(--ink)}
.eg[data-sys="4"] .prog-bar i{background:var(--bg);border-radius:0;border-left:1px solid var(--ink)}
.eg[data-sys="4"] .prog-bar i:first-child{border-left:0}
.eg[data-sys="4"] .prog-bar i.done{background:var(--ink)}
.eg[data-sys="4"] .prog-bar i.done+i.done{background:color-mix(in srgb,var(--ink) 55%,var(--bg))}
.eg[data-sys="4"] .prog-lbl{gap:0}
.eg[data-sys="4"] .prog-lbl .cur{font-weight:500;color:var(--accent-ink)}
.eg[data-sys="5"] .prog-bar{height:12px;gap:0;border:1.5px solid var(--ink)}
.eg[data-sys="5"] .prog-bar i{background:var(--bg);border-left:1.5px solid var(--ink)}
.eg[data-sys="5"] .prog-bar i:first-child{border-left:0}
.eg[data-sys="5"] .prog-bar i.done{background:var(--ink)}
.eg[data-sys="5"] .prog-bar i.done+i.done{box-shadow:inset 1.5px 0 0 var(--bg)}
.eg[data-sys="5"] .prog-bar i.cur{background:var(--hatch)}
.eg[data-sys="5"] .prog-bar i b{background:var(--ink)}
.eg[data-sys="5"] .prog-lbl{gap:0}
.eg[data-sys="5"] .prog-lbl .cur{font-weight:700}

/* ---------- legend ---------- */
.eg .legend{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;font-size:12.5px}
.eg .legend .row{display:flex;align-items:center;gap:8px;padding:2px 0}
.eg .legend .row .num{margin-left:auto;color:var(--ink2)}
.eg .legend .sw{width:11px;height:11px;border-radius:50%;flex:none;border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 30%,transparent)}
.eg .legend .ramp{display:flex;height:8px;margin:6px 0 3px}
.eg .legend .ramp i{flex:1}
.eg .legend .ends{display:flex;justify-content:space-between;color:var(--muted);font-size:11.5px}
.eg .legend .lbl{margin-bottom:5px}
.eg .legend .lbl+.row{margin-top:0}
.eg .legend hr{border:0;border-top:1px solid var(--line);margin:9px 0}
.eg[data-sys="1"] .legend{border-color:var(--ink)}
.eg[data-sys="1"] .legend .sw{border-radius:0;background:var(--c)}
.eg[data-sys="3"] .legend{background:transparent;border-color:var(--line-strong)}
.eg[data-sys="4"] .legend{border-color:var(--ink)}
.eg[data-sys="5"] .legend{border:1.5px solid var(--ink)}
.eg[data-sys="5"] .legend .sw{border-radius:0;background:var(--c);border-color:var(--c)}
.eg[data-theme="dark"] .ramp.flip{flex-direction:row-reverse}

/* ---------- empty state ---------- */
.eg .empty{border:1px dashed var(--line-strong);border-radius:var(--r);padding:22px 20px;display:flex;gap:18px;align-items:center;position:relative;overflow:hidden}
.eg .empty h3{font-size:17px;margin-bottom:4px}
.eg .empty p{color:var(--ink2);font-size:13.5px;margin-bottom:12px}
.eg .empty .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.eg .empty .acts code{color:var(--ink2);font-size:12px}
.eg .empty .art{flex:none;opacity:.9}
.eg[data-sys="1"] .empty{border:1px solid var(--ink)}
.eg[data-sys="3"] .empty{border:1px solid var(--line);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;background-position:-1px -1px}
.eg[data-sys="4"] .empty{border:1px solid var(--line-strong)}
.eg[data-sys="5"] .empty{border:1.5px dashed var(--ink)}

/* ---------- motifs ---------- */
/* Blueprint: corner ticks around a frame */
.eg[data-sys="3"] .ticks{position:relative}
.eg[data-sys="3"] .ticks::before{content:"";position:absolute;inset:-7px;pointer-events:none;--t:var(--line-strong);
  background:linear-gradient(var(--t),var(--t)) left top/12px 1px no-repeat,linear-gradient(var(--t),var(--t)) left top/1px 12px no-repeat,
  linear-gradient(var(--t),var(--t)) right top/12px 1px no-repeat,linear-gradient(var(--t),var(--t)) right top/1px 12px no-repeat,
  linear-gradient(var(--t),var(--t)) left bottom/12px 1px no-repeat,linear-gradient(var(--t),var(--t)) left bottom/1px 12px no-repeat,
  linear-gradient(var(--t),var(--t)) right bottom/12px 1px no-repeat,linear-gradient(var(--t),var(--t)) right bottom/1px 12px no-repeat}
.eg[data-sys="3"]{--grid:color-mix(in srgb,var(--line) 38%,transparent)}
/* Blueprint: a dimension line with a centred figure */
.eg .dimline{display:none}
.eg[data-sys="3"] .dimline{display:flex;align-items:center;gap:8px;font:11.5px var(--font-mono);color:var(--muted);height:16px;margin-top:10px;border-left:1px solid var(--line-strong);border-right:1px solid var(--line-strong)}
.eg[data-sys="3"] .dimline::before,.eg[data-sys="3"] .dimline::after{content:"";flex:1;height:7px;background:linear-gradient(var(--line-strong),var(--line-strong)) center/100% 1px no-repeat}
.eg[data-sys="3"] .dimline::before{-webkit-mask:none;clip-path:polygon(0 50%,7px 0,7px 43%,100% 43%,100% 57%,7px 57%,7px 100%);background:var(--line-strong)}
.eg[data-sys="3"] .dimline::after{clip-path:polygon(100% 50%,calc(100% - 7px) 0,calc(100% - 7px) 43%,0 43%,0 57%,calc(100% - 7px) 57%,calc(100% - 7px) 100%);background:var(--line-strong)}

/* =================================================================== */
/* ---------- overview strip ---------- */
.ov{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:8px}
.ov .card{display:flex;flex-direction:column}
.ov .eg.top{padding:16px 16px 14px;flex:1;display:flex;flex-direction:column;gap:13px}
.ov .eg.alt{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.ov .hd{display:flex;align-items:baseline;gap:8px}
.ov .hd i{font:700 11px/1 ui-monospace,Menlo,monospace;font-style:normal;border:1px solid currentColor;padding:3px 5px;border-radius:2px}
.ov .hd span{font-size:12px;color:var(--muted)}
.ov .lock{height:44px;display:flex;align-items:center}
.ov .acc{display:flex;gap:5px;align-items:center;font-size:11.5px;color:var(--muted)}
.ov .acc i{width:30px;height:18px;border-radius:var(--r);border:1px solid color-mix(in srgb,var(--ink) 18%,transparent)}
.ov .acc i.st{width:11px;height:11px;border-radius:50%;border:0;margin-left:1px}
.ov .acc .sp{flex:1}
.ov .bigno{font-size:22px;line-height:1.15;font-weight:600}
.ov .bigno small{display:block;font:12.5px var(--font-body);color:var(--muted);font-weight:400;margin-top:2px}
.ov .eg[data-sys="4"] .bigno,.ov .eg[data-sys="5"] .bigno{font-weight:600;letter-spacing:-.01em}
.ov .why{font-size:12.5px;color:var(--ink2);line-height:1.45;min-height:72px}
.ov .rowb{display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
.ov .rowb .btn{padding:0 12px}
.ov .rowb .btn.quiet{padding:0 4px;font-size:12.5px}
.ov .eg[data-sys="1"] .rowb .btn.quiet{font-size:10.5px}
.ov .dots{display:flex;gap:3px}
.ov .dots i{flex:1;height:8px;background:var(--c)}

/* ---------- section head ---------- */
.sys-head{padding:22px 26px;display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:30px;align-items:start}
.sys-head h3{font-size:30px}
.sys-head .tagline{color:var(--muted);font-size:14px;margin-top:6px}
.sys-head p{color:var(--ink2);font-size:13.5px}
.sys-head .lbl{margin-bottom:6px}
.sys-head .lk{display:flex;align-items:center;gap:18px}

/* ---------- identity block ---------- */
.vars{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:10px;border-top:1px solid var(--line)}
.var{padding:14px 12px 12px 0;border-bottom:1px solid var(--line)}
.var+.var{padding-left:14px;border-left:1px solid var(--line)}
.var .sizes{display:flex;align-items:flex-end;gap:16px;height:66px}
.var .cap{margin-top:10px;font-size:12px;color:var(--ink2);line-height:1.4}
.var .cap b{color:var(--ink);font-weight:600}
.var .cap .fav{color:var(--accent-ink);font-weight:600}
.var .px{display:flex;gap:16px;font:10.5px var(--font-mono);color:var(--muted);margin-top:4px}
.var .px span{text-align:center}
.locks{display:grid;grid-template-columns:1.25fr .75fr;gap:20px;align-items:center;margin-top:20px}
.locks .h{display:flex;align-items:center;min-height:64px}
.locks .st{display:flex;flex-direction:column;align-items:center;gap:8px}
.idrow{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-top:18px}
.btab{display:inline-flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;padding:7px 12px 7px 10px;font:12px system-ui,sans-serif;color:var(--ink2);white-space:nowrap}
.btab .x{margin-left:10px;color:var(--muted)}
.btab.off{background:transparent;border-color:transparent;color:var(--muted)}
.btabs{display:flex;align-items:flex-end;border-bottom:1px solid var(--line);padding:0 6px}
.minis{display:flex;gap:14px;align-items:center;font-size:11.5px;color:var(--muted)}

/* ---------- colour block ---------- */
.csec{margin-top:22px}
.csec:first-child{margin-top:0}
.csec>.lbl{margin-bottom:8px}
.sw-row{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.swt{font-size:10.5px;color:var(--ink2);line-height:1.3;min-width:0}
.swt i{display:block;height:34px;border-radius:var(--r);border:1px solid color-mix(in srgb,var(--ink) 16%,transparent);margin-bottom:4px}
.swt code{display:block;color:var(--muted);font-size:10px}
.status-row{display:grid;grid-template-columns:270px 1fr;gap:20px;align-items:start}
.sts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sts .swt i{height:26px;display:flex;align-items:center;justify-content:center;color:var(--bg)}
.proof{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;gap:12px;align-items:center}
.proof .co{flex:1;padding-top:8px;padding-bottom:8px}
.eg[data-sys="1"] .proof .co .body{padding:7px 10px}
.eg[data-sys="3"] .proof .co{padding-top:11px}
.note{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.45}
.note b{color:var(--ink2);font-weight:600}
.data-row{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.data-row .swt i{height:26px;border:0;margin-bottom:3px}
.data-row .swt code{font-size:9.5px;letter-spacing:-.02em}
.cvd{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:3px}
.cvd i{height:7px;display:block}
.cvdlab{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:2px}
.mapdemo{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);margin-top:10px;line-height:0}
.eg[data-theme="dark"] .mapdemo{background:var(--map-bg)}
.ramps{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.seq{display:flex;height:20px}
.seq i{flex:1}
.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:3px}

/* ---------- type block ---------- */
.type{padding:22px 26px 24px;display:grid;grid-template-columns:1.2fr 1fr;gap:40px}
.type .ln{display:grid;grid-template-columns:92px 1fr;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.type .ln>span:first-child{font:11px var(--font-mono);color:var(--muted)}
.type .run h3{font-size:19px;margin-bottom:6px}
.type .run p{color:var(--ink2);font-size:15px;margin-bottom:10px;line-height:1.55}
.type .faces{margin-top:16px;font-size:12.5px;color:var(--ink2);border-top:1px solid var(--line);padding-top:12px}
.type .faces div{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:2px 0}
.type .faces div>span:first-child{color:var(--muted)}
.type .faces b{color:var(--ink);font-weight:600}

/* ---------- components block ---------- */
.comps{padding:22px 26px 28px;display:grid;grid-template-columns:7fr 5fr;gap:0 34px}
.comps>div{min-width:0;display:flex;flex-direction:column;gap:24px}
.comps>div>div{min-width:0}
.comps .lbl{margin-bottom:9px}
.comps .split{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c3{grid-column:span 3}.c12{grid-column:span 12}
.rowf{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rowf+.rowf{margin-top:10px}
.rowf .grow{flex:1}
.stack>*+*{margin-top:9px}
.tipwrap{padding:2px 0 10px}

/* =================================================================== */
/* ---------- in context ---------- */
.ctx{padding:0}
.ctx-cap{display:flex;gap:10px;align-items:baseline;font:12px system-ui,sans-serif;color:var(--muted);padding:14px 26px 8px}
.ctx-cap b{font:700 11px ui-monospace,Menlo,monospace;border:1px solid currentColor;border-radius:2px;padding:1px 5px;color:var(--ink2)}

/* (a) landing hero */
.hero{margin:0 26px;border:1px solid var(--line);position:relative;overflow:hidden;background:var(--bg)}
.hero nav{display:flex;align-items:center;gap:26px;padding:14px 28px;border-bottom:1px solid var(--line);font-size:13.5px;position:relative}
.hero nav a{color:var(--ink);text-decoration:none}
.hero nav .sp{flex:1}
.hero nav .soon{font-size:11.5px;color:var(--muted);border:1px dashed var(--line-strong);padding:3px 8px;border-radius:var(--r)}
.hero .grid{display:grid;grid-template-columns:540px 1fr;gap:44px;padding:38px 28px 30px;align-items:start;position:relative}
.hero h1{font-size:50px;margin:12px 0 16px}
.hero .lead{font-size:16.5px;line-height:1.5;color:var(--ink2);max-width:500px}
.hero .install{display:flex;align-items:center;gap:10px;margin:22px 0 12px;height:42px;padding:0 6px 0 14px;background:var(--surface2);border-radius:var(--r);font:13.5px var(--font-mono);max-width:400px}
.hero .install .p{color:var(--muted)}
.hero .install .cp{margin-left:auto;font:11.5px var(--font-body);color:var(--ink2);border:1px solid var(--line-strong);border-radius:var(--r);padding:4px 8px;background:var(--bg)}
.hero .cta{display:flex;gap:8px}
.hero .fine{font-size:12px;color:var(--muted);margin-top:12px}
.shot{position:relative;background:#090a10;line-height:0}
.shot img{width:100%;display:block}
.shot .hud{position:absolute;left:0;top:0;width:42.2%;height:11.2%;background:#090a10;display:flex;flex-direction:column;justify-content:center;padding:0 12px;font:11.5px/1.35 var(--font-body);color:#b8bcc4;overflow:hidden;white-space:nowrap}
.shot .hud b{color:#f2f2ef;font-weight:600;font-size:12.5px}
.shot-cap{display:flex;justify-content:space-between;gap:16px;font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4}
.shot-cap span:last-child{white-space:nowrap}
.hero .ruler{display:none}
.hero .contours{position:absolute;left:-150px;bottom:-230px;pointer-events:none;display:none;opacity:.8}

.eg[data-sys="1"] .hero nav{border-bottom:1px solid var(--ink)}
.eg[data-sys="1"] .hero h1 u{text-decoration:none;box-shadow:inset 0 -.14em 0 var(--accent)}
.eg[data-sys="1"] .hero .install{border:1px solid var(--line)}
.eg[data-sys="1"] .hero .install .cp{font:10.5px var(--font-mono);text-transform:uppercase;letter-spacing:.06em;border-color:var(--ink)}
.eg[data-sys="1"] .shot-cap{font-size:11.5px}
.eg[data-sys="2"] .hero h1{font-size:50px}
.eg[data-sys="2"] .hero h1 u{text-decoration:none;color:var(--accent-ink)}
.eg[data-sys="2"] .hero .install{background:var(--surface);border:1px solid var(--line)}
.eg[data-sys="2"] .shot{border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px var(--line-strong)}

  const dot = (d, col) => d ? `<circle cx="${f(d[0])}" cy="${f(d[1])}" r="${f(d[2])}" fill="${col}"/>` : '';

function rng(seed) { let s = seed >>> 0; return () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// A tiny fake map: twelve communities with their sub-communities, coloured by the data palette.
const MINIMAP = (() => {
  const R = rng(5), W = 640, H = 150, radii = [60, 50, 43, 38, 34, 31, 28, 26, 24, 22, 20, 18], top = [];
  for (const r of radii) for (let k = 0; k < 4000; k++) {
    const x = r + 3 + R() * (W - 2 * r - 6), y = r + 3 + R() * (H - 2 * r - 6);
    if (top.every(c => Math.hypot(c.x - x, c.y - y) > c.r + r + 4)) { top.push({ x, y, r }); break; }
  }
  top.sort((a, b) => a.x - b.x);
  let s = '';
  top.forEach((c, i) => {
    const col = `var(--c${i % 10 + 1})`, kids = [];
    const n = 2 + Math.floor(R() * 5);
    for (let j = 0; j < n; j++) for (let k = 0; k < 200; k++) {
      const r = c.r * (0.14 + R() * 0.34), a = R() * 6.283, d = R() * (c.r - r - 3), x = c.x + Math.cos(a) * d, y = c.y + Math.sin(a) * d;
      if (kids.every(q => Math.hypot(q.x - x, q.y - y) > q.r + r + 2)) { kids.push({ x, y, r }); break; }
    }
    s += `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="${c.r}" fill="${col}" fill-opacity=".07" stroke="${col}" stroke-width="1.4"/>`;
    kids.forEach(q => { s += `<circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="${q.r.toFixed(1)}" fill="${col}" fill-opacity=".1" stroke="${col}" stroke-width="1.1"/>`;
      if (q.r > 9) s += `<circle cx="${(q.x - q.r * .25).toFixed(1)}" cy="${(q.y + q.r * .2).toFixed(1)}" r="${(q.r * .38).toFixed(1)}" fill="none" stroke="${col}" stroke-width="1"/>`; });
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Fake map coloured with the data palette">${s}</svg>`;
})();
// Contour lines (Survey's motif): nested, slightly irregular closed curves.
function contours(size, n, seed, stroke) {
  const R = rng(seed), ph = [R() * 6.28, R() * 6.28, R() * 6.28]; let s = '';
  for (let k = 0; k < n; k++) {
    const t = k / n, r = size * 0.48 * (1 - t * 0.86), cx = size / 2 + t * size * 0.13, cy = size / 2 - t * size * 0.09, pts = [];
    for (let i = 0; i <= 96; i++) { const a = i / 96 * 6.2832, rr = r * (1 + 0.09 * Math.sin(a + ph[0]) + 0.06 * Math.sin(2 * a + ph[1] + t * 2) + 0.035 * Math.sin(3 * a + ph[2] - t * 3)); pts.push(`${(cx + Math.cos(a) * rr).toFixed(1)} ${(cy + Math.sin(a) * rr).toFixed(1)}`); }
    s += `<path d="M${pts.join('L')}Z" fill="none" stroke="${stroke}" stroke-width="${k % 4 === 0 ? 1.2 : 0.7}" vector-effect="non-scaling-stroke"/>`;
  }
  return `<svg class="contours" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">${s}</svg>`;
}
// Which family of a CSS font stack is actually installed here (so the page can say what you are looking at).
function renderedFont(el, prop) {
  const stack = getComputedStyle(el).getPropertyValue(prop).split(',').map(s => s.trim().replace(/^["']|["']$/g, '')).filter(Boolean);
  const c = document.createElement('canvas').getContext('2d'), probe = 'mmmmmmmmlli 0123456789 WgQ@ fi';
  const w = f => { c.font = '72px ' + f; return c.measureText(probe).width; };
  const base = [w('monospace'), w('serif'), w('sans-serif')];
  for (const f of stack) {
    const generic = /^(system-ui|ui-[a-z-]+|-apple-system|BlinkMacSystemFont)$/.test(f), q = generic ? f : `"${f}"`;
    if (/^(serif|sans-serif|monospace)$/.test(f)) return { name: 'the browser\'s generic ' + f, first: false };
    if (w(q + ',monospace') !== base[0] || w(q + ',serif') !== base[1] || w(q + ',sans-serif') !== base[2]) return { name: generic ? 'the system default (' + f + ')' : f, first: f === stack[0] };
  }
  return { name: 'the browser default', first: false };
}

function section(sys, th) {
  const t = TOKENS[sys], [a, b] = themes(sys), alt = SYS[sys].primary === 'light' ? 'dark' : 'light';
  document.currentTheme = th;
  const meta = (part, title, note = '') => `<div class="meta" data-part="${part}"><b>${title}</b><span>${note}</span></div>`;
  return `<section class="sys" id="s${sys}">
   <div class="sys-title"><span class="n">${sys}</span><h2>${t.name}</h2><span>${t.tag}</span><a href="#only=${sys}">#only=${sys}</a><a href="#only=${sys}&theme=${alt}" style="margin-left:14px">#only=${sys}&amp;theme=${alt}</a></div>
   ${headCard(sys, th)}
   ${meta('identity', 'Mark and wordmark', 'drawn SVG marks; the wordmark is live text in the fonts on this machine')}
   <div class="card two" data-part="identity">${identityPane(sys, a)}${identityPane(sys, b)}</div>
   ${meta('colour', 'Colour', 'all ΔE figures are OKLab × 100, computed by tools/palette.mjs (Machado 2009 simulation, severity 1.0)')}
   <div class="card two" data-part="colour">${colourPane(sys, a)}${colourPane(sys, b)}</div>
   ${meta('type', 'Type', `shown in the ${th} theme`)}
   ${typeBlock(sys, th)}
   ${meta('components', 'Components', `shown in the ${th} theme`)}
   ${compsBlock(sys, th)}
   ${meta('context', 'In context', `shown in the ${th} theme — the place to judge the system`)}
   <div class="card eg ctx" data-part="context" data-sys="${sys}" data-theme="${th}">${hero(sys)}${termAndNotebook(sys)}${viewer(sys)}</div>
  </section>`;
}

// ---------- page ----------
(function main() {
  const only = OPT.only && IDS.includes(OPT.only) ? OPT.only : null;
  const page = document.getElementById('page');
  let html = `<header class="intro ov-intro"><h1>Everygraph — visual identity, round 2: five systems descended from “B's system + A's mark”</h1>
    <p>Design mockup; nothing here is final and every figure about a graph is invented. Marks are drawn SVG; wordmarks and all text use fonts installed on the machine showing this page, so they differ slightly elsewhere.
    Show one system with <code>#only=1</code> … <code>#only=5</code>, force a theme with <code>&amp;theme=light|dark</code>, and one block with <code>&amp;part=identity|colour|type|components|context</code>.</p></header>`;
  html += `<div class="ov">${IDS.map(overviewCard).join('')}</div>`;
  for (const id of IDS) if (!only || only === id) html += section(id, OPT.theme === 'dark' || OPT.theme === 'light' ? OPT.theme : SYS[id].primary);
  page.innerHTML = html;
  if (only) { document.body.classList.add('only'); document.querySelector('#s' + only).classList.add('show'); document.querySelector('.ov-intro').style.display = 'none'; }
  if (OPT.part) { document.body.classList.add('part'); const keep = OPT.part.split(','); document.querySelectorAll('[data-part]').forEach(e => { if (keep.includes(e.dataset.part)) e.classList.add('keep'); }); }
  fitWordmarks();
  document.querySelectorAll('[data-face]').forEach(e => { const r = renderedFont(e, e.dataset.face); e.querySelector('.seen').innerHTML = r.first ? 'installed here, so this is the real thing' : `not installed here: you are looking at the fallback, <b>${r.name}</b>`; });
})();

</script>
