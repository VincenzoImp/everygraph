<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Everygraph — notebook experience (mockup)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/*@tokens*/
html,body{margin:0}
body{background:#fff;color:#1c1c1c;font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif}
.jmono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Noto Sans Mono","DejaVu Sans Mono",monospace}
/* --- imitation JupyterLab chrome (neutral, not part of the brand) --- */
.jp-top{height:28px;background:#eee;border-bottom:1px solid #d5d5d5;display:flex;align-items:center;gap:16px;padding:0 12px;font-size:13px;color:#333}
.jp-top .logo{width:16px;height:16px;border-radius:50%;border:2px solid #f37726;border-left-color:transparent;border-right-color:transparent}
.jp-top .mk{margin-left:auto;font-size:11.5px;color:#666}
.jp-top code{background:#ddd;padding:1px 5px;border-radius:3px}
.jp-body{display:grid;grid-template-columns:34px 1fr}
.jp-side{background:#eee;border-right:1px solid #d5d5d5;display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:12px}
.jp-side i{width:16px;height:14px;border:2px solid #777;border-radius:2px;opacity:.7}
.jp-side i:nth-child(2){border-radius:50%}.jp-side i:nth-child(3){height:3px;border-width:0;border-top:2px solid #777;border-bottom:2px solid #777;box-sizing:content-box;padding-top:3px}
.jp-tabs{background:#eee;border-bottom:1px solid #d5d5d5;display:flex;height:30px;align-items:flex-end;padding-left:4px}
.jp-tab{background:#fff;border:1px solid #d5d5d5;border-bottom:0;border-top:2px solid #1976d2;padding:5px 14px;font-size:13px;display:flex;gap:10px;align-items:center}
.jp-tab .nb{width:12px;height:12px;background:#f37726;border-radius:2px}
.jp-tool{height:32px;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;gap:14px;padding:0 14px;color:#555;font-size:13px}
.jp-tool .sep{width:1px;height:16px;background:#ddd}
.jp-tool .kern{margin-left:auto;display:flex;gap:8px;align-items:center}
.jp-tool .kern i{width:10px;height:10px;border:1.5px solid #666;border-radius:50%}
.nb{max-width:1180px;padding:18px 26px 60px 8px}
.cell{display:grid;grid-template-columns:74px 1fr;margin:6px 0;position:relative}
.cell.active:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#1976d2;border-radius:1px}
.prompt{font:13px/1.5 ui-monospace,Menlo,Consolas,"Noto Sans Mono",monospace;color:#616161;text-align:right;padding:6px 8px 0 0;white-space:nowrap}
.in{background:#f5f5f5;border:1px solid #e0e0e0;padding:5px 9px;font:13px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,"Noto Sans Mono","DejaVu Sans Mono",monospace;white-space:pre;border-radius:2px;margin:0}
.in .k{color:#008000;font-weight:700}.in .s{color:#ba2121}.in .n{color:#080}.in .c{color:#408080;font-style:italic}
.out{padding:8px 0 4px 2px;min-width:0}
.md{padding:4px 2px}
.md h1{font-size:24px;margin:6px 0 4px;font-weight:600}.md p{margin:0 0 4px;color:#444;font-size:14px}
pre.txt{margin:0;font:13px/1.42 ui-monospace,"SF Mono",Menlo,Consolas,"Noto Sans Mono","DejaVu Sans Mono",monospace;white-space:pre;color:#1c1c1c;overflow:hidden}
pre.txt .err{color:#b3261e;font-weight:700}
pre.txt .dim{color:#777}
body[data-rich="text"] .rich-html{display:none}
body[data-rich="html"] .rich-text{display:none}
/* --- Everygraph rich outputs (brand-styled) --- */
.eg.o{background:transparent;font-size:13.5px;max-width:940px}
.card{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.eg[data-dir="A"] .card,.eg[data-dir="C"] .card{border-color:var(--line)}
.card>.hd{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface2)}
.card>.hd b{font:var(--display-weight) 15px var(--font-display)}
.card>.hd .meta{margin-left:auto;color:var(--ink2);font-size:12.5px}
.card>.bd{padding:14px}
.big3{display:grid;grid-template-columns:repeat(3,auto);gap:34px;justify-content:start;margin-bottom:14px}
.big3 .v{font:600 22px/1.15 var(--font-num);font-variant-numeric:tabular-nums;display:block}
.big3 .l{color:var(--ink2);font-size:12.5px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:0 34px;border-top:1px solid var(--line);padding-top:10px}
.kv h4{margin:0 0 4px;font-weight:600;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kv .r{display:grid;grid-template-columns:96px 112px 1fr;gap:8px;padding:2.5px 0;font-size:13px;align-items:baseline}
.kv .r .num{text-align:right}
.kv .r span:last-child{color:var(--ink2);font-size:12.5px}
.meter{height:10px;background:var(--surface2);border-radius:calc(var(--r)/2);position:relative;margin:6px 0 4px;border:1px solid var(--line)}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--brand);border-radius:inherit}
.eg[data-dir="B"] .meter i{background:var(--ink)}
.prog{display:grid;grid-template-columns:auto 260px auto;gap:12px;align-items:center;font-size:13px;margin-bottom:10px;color:var(--ink2);justify-content:start}
.prog b{color:var(--ink);font-weight:600}
.prog .meter{margin:0}
.err-card{border-left:4px solid var(--bad)}
.err-card .hd{background:transparent}
.err-card .hd b{color:var(--bad)}
.eg[data-theme="light"] .err-card .hd b{color:#b3261e}
.budget{margin:4px 0 14px;max-width:640px}
.budget .track{position:relative;height:22px;display:flex;gap:2px}
.budget .seg{height:100%;display:flex;align-items:center;padding:0 8px;font-size:12px;color:#fff;white-space:nowrap;overflow:hidden}
.budget .seg.a{background:#b3261e;border-radius:3px 0 0 3px}.budget .seg.b{background:#d9776f;border-radius:0 3px 3px 0}
.budget .mark{position:absolute;top:-6px;bottom:-6px;border-left:2px solid var(--ink)}
.budget .ax{position:relative;height:18px;font-size:12px;color:var(--ink2);margin-top:6px}
.budget .ax span{position:absolute;white-space:nowrap}
.ways{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.way{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.way .t{font-weight:600;margin-bottom:6px;display:flex;gap:8px;align-items:baseline}
.way .t i{font:600 11px var(--font-num);font-style:normal;border:1px solid var(--line-strong);border-radius:var(--r);padding:1px 6px}
.way code,.eg.o code{font:12.5px var(--font-mono);background:var(--code-bg);color:var(--code-ink);padding:2px 6px;border-radius:calc(var(--r)/2)}
.way p{margin:6px 0 0;color:var(--ink2);font-size:12.5px}
.plan table{border-collapse:collapse;width:100%;font-size:13px;margin:10px 0}
.plan th{text-align:left;font-weight:600;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:4px 10px 4px 0;border-bottom:1px solid var(--line-strong)}
.plan td{padding:6px 10px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
.plan td.num,.plan th.num{text-align:right}
.plan td i{font-style:normal;color:var(--muted);margin-right:8px;font-family:var(--font-num)}
.verdict{display:inline-flex;gap:8px;align-items:center;font-weight:600}
.verdict:before{content:"✓";width:18px;height:18px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-size:12px}
.plan .foot{display:grid;grid-template-columns:70px 1fr;gap:3px 10px;font-size:13px;color:var(--ink2)}
.plan .foot b{color:var(--ink);font-weight:600}
.tblwrap{max-width:760px}
.eg .tblwrap table.num-table th{text-transform:none;letter-spacing:0;font-size:12px}
.tfoot{font-size:12px;color:var(--muted);margin-top:6px}
.widget{border:1px solid var(--line-strong);border-radius:var(--r-lg);overflow:hidden;max-width:940px;background:var(--surface)}
.widget .bar{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.widget .bar .input{flex:0 0 250px;padding:6px 10px;font-size:13px}
.widget .bar .btn{padding:7px 12px;font-size:12.5px}
.widget .bar .chip{font-size:12.5px;color:var(--ink2);border:1px solid var(--line);padding:5px 10px;border-radius:var(--r)}
.widget .view{position:relative;line-height:0;height:470px;overflow:hidden;background:#2d191f}
.widget .view img{width:100%;position:absolute;left:0;top:-70px}
.widget .view .ph{position:absolute;right:10px;top:10px;font:11.5px/1.3 system-ui,sans-serif;background:rgba(0,0,0,.72);color:#fff;padding:5px 9px;border-radius:3px;border:1px dashed rgba(255,255,255,.6)}
.widget .sel{display:flex;gap:12px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);font-size:13px;background:var(--surface2)}
.widget .sel b{font-weight:600}
.widget .sel .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);flex:none}
.widget .sel .to{margin-left:auto;color:var(--ink2)}
</style></head>
<body data-rich="html">
<div class="mock-tag">Mockup · invented data</div>
<div class="jp-top"><span class="logo"></span><span>File</span><span>Edit</span><span>View</span><span>Run</span><span>Kernel</span><span>Tabs</span><span>Settings</span><span>Help</span>
  <span class="mk">Static imitation of JupyterLab · all figures invented · switch output style with <code>#rich=html</code> / <code>#rich=text</code>, brand with <code>#dir=A|B|C</code></span></div>
<div class="jp-body"><div class="jp-side"><i></i><i></i><i></i><i></i></div><div>
<div class="jp-tabs"><div class="jp-tab"><span class="nb" style="padding:0;max-width:none"></span>transfers.ipynb <span style="color:#999">×</span></div></div>
<div class="jp-tool"><span>＋</span><span>✂</span><span>⧉</span><span class="sep"></span><span>▶</span><span>■</span><span>↻</span><span>⏩</span><span class="sep"></span><span>Code ⌄</span><span class="kern">Python 3 (ipykernel) <i></i></span></div>
<div class="nb" id="nb"></div>
</div></div>
<script>
/*@shared*/
const H=egHash({rich:'html',dir:'B'});
const dir=/^[ABC]$/.test(H.dir)?H.dir:'B';
document.body.dataset.rich=H.rich==='text'?'text':'html';
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
// one table definition -> both looks
function tableHTML(t){return `<div class="tblwrap"><table class="num-table"><thead><tr>${t.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table><div class="tfoot">${t.foot}</div></div>`;}
function tableText(t){
  const w=t.cols.map((c,i)=>Math.max(c.length,...t.rows.map(r=>r[i].length)));
  const line=(r)=>r.map((v,i)=>i===0?v.padEnd(w[i]):v.padStart(w[i])).join('   ');
  return esc([line(t.cols),w.map(n=>'-'.repeat(n)).join('---'),...t.rows.map(line)].join('\n'))+`\n<span class="dim">${t.foot}</span>`;
}
const T_COMM={cols:['community','addresses','transfers_inside','transfers_out','share_of_addresses'],rows:[
 ['0','31,204,118','412,880,341','96,412,077','14.69 %'],['1','22,870,455','268,114,902','71,330,518','10.77 %'],['2','18,441,002','201,557,310','58,902,144','8.68 %'],['3','9,112,876','97,340,221','30,118,406','4.29 %'],['4','6,530,341','61,208,775','22,471,093','3.07 %']],
 foot:'5 of 48,213 rows · sorted by addresses, largest first · modularity 0.812'};
const T_SEL={cols:['address','community','transfers_in','transfers_out','pagerank'],rows:[
 ['0x7a3f…c41e','301832','18,204','17,996','4.12e-06'],['0x02bd…9f70','301832','6,311','402','1.37e-06'],['0xe1c8…55a2','301832','1,207','1,198','3.05e-07'],['0x9d40…0b3c','301832','88','1,640','4.40e-08'],['0x51fa…a7e9','301832','41','37','2.21e-08']],
 foot:'5 of 20,064 rows · sorted by pagerank, largest first'};

const cells=[];
const md=(h)=>cells.push(`<div class="cell"><div class="prompt"></div><div class="md">${h}</div></div>`);
function cell(n,code,html,text,active){
  cells.push(`<div class="cell${active?' active':''}"><div class="prompt">[${n}]:</div><pre class="in">${code}</pre></div>`+
   (html?`<div class="cell"><div class="prompt">${/^!/.test(html)?'':'['+n+']:'}</div><div class="out"><div class="rich-html eg o" data-dir="${dir}" data-theme="light">${html.replace(/^!/,'')}</div><pre class="txt rich-text">${text}</pre></div></div>`:''));
}
const bar=(pct,n=24)=>{const f=Math.round(pct/100*n);return '█'.repeat(f)+'░'.repeat(n-f);};

md(`<h1>Transfers graph — first look</h1><p>Invented example: a file of transfers between addresses. Every figure on this page is made up for the mockup; none is a measurement.</p>`);

cell(1,`<span class="k">import</span> everygraph <span class="k">as</span> eg
eg.config(memory=<span class="s">"4GB"</span>)    <span class="c"># never use more than this</span>`);

cell(2,`g = eg.read(<span class="s">"transfers.parquet"</span>, src=<span class="s">"sender"</span>, dst=<span class="s">"receiver"</span>, time=<span class="s">"block_time"</span>)
g`,
`<div class="prog"><b>Reading transfers.parquet</b><div class="meter"><i style="width:100%"></i></div><span><span class="num">1,831,290,113</span> rows · 58 s · done</span></div>
<div class="card"><div class="hd"><span data-mark="16" style="line-height:0"></span><b>Graph · transfers.parquet</b><span class="meta">directed · timestamped (block_time)</span></div>
<div class="bd">
  <div class="big3"><div><span class="v">212,418,907</span><span class="l">addresses (nodes)</span></div><div><span class="v">1,831,224,560</span><span class="l">transfers (edges)</span></div><div><span class="v">2019-01-01 → 2024-06-30</span><span class="l">time range</span></div></div>
  <div class="kv">
    <div><h4>What was read</h4>
      <div class="r"><span>rows read</span><span class="num">1,831,290,113</span><span></span></div>
      <div class="r"><span>skipped</span><span class="num">65,553</span><span>receiver is empty · <code>g.skipped()</code></span></div>
      <div class="r"><span>self-loops</span><span class="num">1,204,377</span><span>kept</span></div>
      <div class="r"><span>repeats</span><span class="num">702,611,904</span><span>same sender → receiver, kept</span></div></div>
    <div><h4>What it cost</h4>
      <div class="r"><span>on disk</span><span class="num">3.9 GB</span><span>17 bits per edge (file: 38.6 GB)</span></div>
      <div class="r"><span>memory peak</span><span class="num">3.1 GB</span><span>of the 4.0 GB budget</span></div>
      <div class="meter" style="max-width:330px"><i style="width:77.5%"></i></div></div>
  </div>
</div></div>`,
`Reading transfers.parquet  ${bar(100)}  100 %   1,831,290,113 rows · 58 s

<b>Graph  transfers.parquet</b>                       directed · timestamped (block_time)
  nodes         212,418,907   addresses
  edges       1,831,224,560   transfers
  time     2019-01-01 → 2024-06-30

What was read
  rows read   1,831,290,113
  skipped            65,553   receiver is empty             g.skipped()
  self-loops      1,204,377   kept
  repeats       702,611,904   same sender → receiver, kept

What it cost
  on disk        3.9 GB   17 bits per edge (file: 38.6 GB)
  memory peak    3.1 GB   of the 4.0 GB budget   ${bar(77.5,20)}  78 %`);

cell(3,`comm = g.communities()`,
`!<div class="card err-card"><div class="hd"><b>InsufficientBudget</b><span>communities() does not fit in the 4.0 GB budget. Nothing was run.</span></div>
<div class="bd">
  <div class="budget"><div class="track"><div class="seg a" style="width:85%">5.1 GB · per-address state, must stay in memory</div><div class="seg b" style="width:8.3%"></div><div class="mark" style="left:66.7%"></div></div>
    <div class="ax"><span style="left:66.7%;transform:translateX(-100%);padding-right:6px">budget 4.0 GB</span><span style="left:85.5%">+ 0.5 GB read buffers</span></div></div>
  <p style="margin:0 0 12px"><b>Smallest budget that works: 5.6 GB.</b> <span style="color:var(--ink2)">The state is 24 bytes for each of 212,418,907 addresses; the edges themselves can stay on disk.</span></p>
  <div class="ways">
    <div class="way"><div class="t"><i>1</i>Raise the budget</div><code>eg.config(memory="6GB")</code><p>This machine has 16 GB; 11.2 GB are free right now.</p></div>
    <div class="way"><div class="t"><i>2</i>Work on part of the graph</div><code>g.since("2023-01-01").communities()</code><p>96,118,340 addresses: needs 2.8 GB, fits as it is.</p></div>
  </div>
  <p style="margin:12px 0 0;font-size:12.5px;color:var(--muted)">Full plan: <code>g.explain("communities")</code> · Python traceback (1 frame) ▸</p>
</div></div>`,
`<span class="err">InsufficientBudget</span>: communities() does not fit in the 4.0 GB budget. Nothing was run.

  needs     5.1 GB   per-address state (24 bytes × 212,418,907), must stay in memory
          + 0.5 GB   read buffers
  budget    4.0 GB
  smallest budget that works: <b>5.6 GB</b>

Two ways out
  1. Raise the budget             eg.config(memory="6GB")
                                  this machine has 16 GB; 11.2 GB are free right now
  2. Work on part of the graph    g.since("2023-01-01").communities()
                                  96,118,340 addresses: needs 2.8 GB, fits as it is

<span class="dim">Full plan: g.explain("communities")   ·   Python traceback hidden (1 frame): %tb to show</span>`);

cell(4,`eg.config(memory=<span class="s">"6GB"</span>)
g.explain(<span class="s">"communities"</span>)`,
`<div class="card plan"><div class="hd"><b>Plan · communities()</b><span class="meta">Leiden method · budget 6.0 GB · 16 threads</span></div>
<div class="bd">
  <span class="verdict">Fits: peak 5.6 GB of 6.0 GB</span>
  <table><thead><tr><th>Step</th><th>Where the data is</th><th class="num">Memory</th><th class="num">Reads of the graph</th></tr></thead><tbody>
   <tr><td><i>1</i>Keep a few numbers per address</td><td>memory</td><td class="num">5.1 GB</td><td class="num">–</td></tr>
   <tr><td><i>2</i>Move addresses between groups</td><td>edges streamed from disk</td><td class="num">0.5 GB</td><td class="num">about 12, one per pass</td></tr>
   <tr><td><i>3</i>Merge groups and repeat on the smaller graph</td><td>memory</td><td class="num">under 0.2 GB</td><td class="num">1</td></tr>
   <tr><td><i>4</i>Write the result table</td><td>disk</td><td class="num">–</td><td class="num">–</td></tr></tbody></table>
  <div class="foot"><b>Time</b><span>6–9 minutes — an estimate from this disk's read speed (1.9 GB/s)</span>
   <b>Result</b><span>one row per address; the same groups at any thread count</span>
   <b>Why</b><span>edges (3.9 GB) plus state (5.1 GB) exceed 6.0 GB, so the edges are read from disk each pass</span></div>
</div></div>`,
`<b>Plan  communities()</b>            Leiden method · budget 6.0 GB · 16 threads
✓ fits: peak 5.6 GB of 6.0 GB

  step                                           where the data is          memory         reads of the graph
  1  keep a few numbers per address              memory                     5.1 GB         –
  2  move addresses between groups               edges streamed from disk   0.5 GB         about 12, one per pass
  3  merge groups, repeat on the smaller graph   memory                     under 0.2 GB   1
  4  write the result table                      disk                       –              –

  time     6–9 minutes — an estimate from this disk's read speed (1.9 GB/s)
  result   one row per address; the same groups at any thread count
  why      edges (3.9 GB) plus state (5.1 GB) exceed 6.0 GB, so the edges are read from disk each pass`);

cell(5,`comm = g.communities()
comm.summary().head(<span class="n">5</span>)`,
`<div class="prog"><b>communities</b><div class="meter"><i style="width:100%"></i></div><span>pass 12 of 12 · 7 min 12 s · peak 5.5 GB of 6.0 GB</span></div>`+tableHTML(T_COMM),
`communities  ${bar(100)}  100 %   pass 12 of 12 · 7 min 12 s · peak 5.5 GB of 6.0 GB\n\n`+tableText(T_COMM));

cell(6,`m = g.map(color=comm)
m`,
`<div class="widget"><div class="bar"><input class="input" placeholder="Find an address…"><a class="btn ghost">Fly to</a><span class="chip">Colour: community ⌄</span><span class="chip">Time: all ⌄</span><span style="margin-left:auto;font-size:12.5px;color:var(--ink2)">Zoom level 6 of 10</span></div>
<div class="view"><img src="../../../docs/img/map-region-lj.png" alt="Map zoomed into one region; one community is circled as selected"><div class="ph">Placeholder image: lab prototype on another graph (LiveJournal),<br>so labels and numbers in the picture are not the transfers data</div></div>
<div class="sel"><span class="dot"></span><span><b>Selected:</b> community 301832 · <span class="num">20,064</span> addresses · <span class="num">124,356</span> transfers inside</span><span class="to">in Python: <code>m.selection</code></span></div></div>`,
`<span class="dim">[ interactive map widget — shown here as in a terminal ]</span>
Map  transfers   zoom level 6 of 10   colour: community
Selected: community 301832 · 20,064 addresses · 124,356 transfers inside
Open in a browser: m.show()     Save as one file: m.save("transfers.egmap.html")`,true);

cell(7,`m.selection.nodes().head(<span class="n">5</span>)    <span class="c"># what is circled on the map, as a table</span>`,
tableHTML(T_SEL),tableText(T_SEL));

document.getElementById('nb').innerHTML=cells.join('');
egFill();
</script>
</body></html>
