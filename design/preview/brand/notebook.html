<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Everygraph — notebook experience (mockup)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* ===== Everygraph brand mockup tokens: three directions x two themes ===== */
*{box-sizing:border-box}
.eg{
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Noto Sans Mono","DejaVu Sans Mono",monospace;
  --good:#2f8f5b;--warn:#b7791f;--bad:#c0392b;
  background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
/* ---------- A · Atlas ---------- */
.eg[data-dir="A"]{
  --font-display:Charter,"Bitstream Charter","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --font-body:var(--sans);--font-mono:var(--mono);--font-num:var(--sans);
  --bg:#f6f1e7;--surface:#fbf8f1;--surface2:#ece5d6;--ink:#1f2d36;--ink2:#47555d;--muted:#7b8587;
  --line:#d8cfbc;--line-strong:#a9a08c;--brand:#24566b;--on-brand:#fbf8f1;--accent:#b4523a;--accent-ink:#9c4129;--link:#24566b;
  --code-bg:#efe8d9;--code-ink:#1f2d36;--tk-k:#9c4129;--tk-s:#3d6b3a;--tk-c:#8a8774;--tk-n:#24566b;--tk-f:#1f2d36;
  --r:3px;--r-lg:4px;--shadow:none;--display-weight:600;--display-track:-0.01em;
  --c1:#7f4704;--c2:#1cbfda;--c3:#77437e;--c4:#88bc65;--c5:#267ab1;--c6:#ab800d;--c7:#9885df;--c8:#387e50;--c9:#f08cb8;--c10:#bf5c7f;
  --s1:#e3edea;--s2:#c2dad8;--s3:#9cc3c5;--s4:#72a8b0;--s5:#4b8a9a;--s6:#2f6c80;--s7:#1d4d62;
  --map-bg:#14202a;
}
.eg[data-dir="A"][data-theme="dark"]{
  --bg:#14202a;--surface:#1b2a35;--surface2:#233542;--ink:#ece6d8;--ink2:#b9bfbd;--muted:#84908f;
  --line:#32444f;--line-strong:#587080;--brand:#7fb7c4;--on-brand:#14202a;--accent:#e08a6d;--accent-ink:#e9a088;--link:#9ccbd6;
  --code-bg:#0f1921;--code-ink:#ece6d8;--tk-k:#e9a088;--tk-s:#a5c99a;--tk-c:#7f8a88;--tk-n:#9ccbd6;--tk-f:#ece6d8;
  --c1:#d76d7b;--c2:#d4a6f6;--c3:#4d7221;--c4:#47dfc1;--c5:#28689e;--c6:#fcaf7e;--c7:#8e4a69;--c8:#af9325;--c9:#917ad4;--c10:#30a6b0;
}
/* ---------- B · Datum ---------- */
.eg[data-dir="B"]{
  --font-display:Inter,"IBM Plex Sans",system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --font-body:Inter,"IBM Plex Sans",system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Noto Sans Mono","DejaVu Sans Mono",monospace;--font-num:var(--font-mono);
  --bg:#ffffff;--surface:#ffffff;--surface2:#f2f2ef;--ink:#0b0c0e;--ink2:#3c3f44;--muted:#74777c;
  --line:#d6d6d2;--line-strong:#0b0c0e;--brand:#0b0c0e;--on-brand:#ffffff;--accent:#ff4f00;--accent-ink:#c93d00;--link:#0b0c0e;
  --code-bg:#f2f2ef;--code-ink:#0b0c0e;--tk-k:#c93d00;--tk-s:#3c3f44;--tk-c:#8d9095;--tk-n:#0b0c0e;--tk-f:#0b0c0e;
  --r:0px;--r-lg:0px;--shadow:none;--display-weight:700;--display-track:-0.035em;
  --c1:#9e3101;--c2:#02beff;--c3:#7e218c;--c4:#eea10d;--c5:#0959c9;--c6:#6fcc7f;--c7:#a071fc;--c8:#578b1a;--c9:#f786c9;--c10:#e21880;
  --s1:#ffe9dc;--s2:#ffcdb0;--s3:#ffab80;--s4:#ff8550;--s5:#f55e1f;--s6:#c6440d;--s7:#8f2f06;
  --map-bg:#0b0c0e;
}
.eg[data-dir="B"][data-theme="dark"]{
  --bg:#0b0c0e;--surface:#0b0c0e;--surface2:#17191c;--ink:#f2f2ef;--ink2:#c2c4c7;--muted:#85888d;
  --line:#2c3035;--line-strong:#f2f2ef;--brand:#f2f2ef;--on-brand:#0b0c0e;--accent:#ff5a14;--accent-ink:#ff7a40;--link:#f2f2ef;
  --code-bg:#17191c;--code-ink:#f2f2ef;--tk-k:#ff7a40;--tk-s:#c2c4c7;--tk-c:#74777c;--tk-n:#f2f2ef;--tk-f:#f2f2ef;
  --c1:#a73f33;--c2:#d5d204;--c3:#3749e5;--c4:#0fefc0;--c5:#9926a2;--c6:#fd976b;--c7:#8585e6;--c8:#7c9624;--c9:#fc93ef;--c10:#f23798;
}
/* ---------- C · Marble ---------- */
.eg[data-dir="C"]{
  --font-display:ui-rounded,"SF Pro Rounded",Nunito,Quicksand,"Varela Round",Lato,"Segoe UI",system-ui,sans-serif;
  --font-body:ui-rounded,"SF Pro Rounded",Nunito,Lato,"Segoe UI",system-ui,sans-serif;--font-mono:var(--mono);--font-num:var(--font-body);
  --bg:#fff9f2;--surface:#ffffff;--surface2:#fbeee0;--ink:#2a1f3d;--ink2:#55496b;--muted:#8b819c;
  --line:#eedfce;--line-strong:#cbb9a6;--brand:#d9472b;--on-brand:#ffffff;--accent:#5b3fd1;--accent-ink:#5b3fd1;--link:#5b3fd1;
  --sun:#ffbe3d;--teal:#1f9e8f;
  --code-bg:#2a1f3d;--code-ink:#f6efe6;--tk-k:#ff9d85;--tk-s:#ffd27a;--tk-c:#9a8fb0;--tk-n:#8fe0d4;--tk-f:#f6efe6;
  --r:12px;--r-lg:20px;--shadow:0 1px 0 rgba(42,31,61,.06),0 8px 24px -12px rgba(42,31,61,.25);--display-weight:800;--display-track:-0.02em;
  --c1:#fc82a6;--c2:#b0351b;--c3:#9f7ffd;--c4:#b9b92b;--c5:#7149b5;--c6:#e06f0a;--c7:#3ec0ef;--c8:#29a863;--c9:#0b84c5;--c10:#c54a9e;
  --s1:#f1e9ff;--s2:#dccdfb;--s3:#c1a9f3;--s4:#a385e6;--s5:#8463d2;--s6:#6646b3;--s7:#48308a;
  --map-bg:#1d1830;
}
.eg[data-dir="C"][data-theme="dark"]{
  --bg:#1d1830;--surface:#272040;--surface2:#322a50;--ink:#f6efe6;--ink2:#cfc5dd;--muted:#9a8fb0;
  --line:#3b3260;--line-strong:#5f5488;--brand:#ff7a5c;--on-brand:#2a1208;--accent:#a48bff;--accent-ink:#b9a6ff;--link:#b9a6ff;
  --code-bg:#151124;--code-ink:#f6efe6;
  --shadow:0 8px 24px -12px rgba(0,0,0,.6);
  --c1:#f38f89;--c2:#ad4492;--c3:#fdc333;--c4:#4377cc;--c5:#3ff19a;--c6:#148853;--c7:#3dccec;--c8:#d24b12;--c9:#bf7bfb;--c10:#81b210;
}

/* ===== shared components, restyled per direction ===== */
.eg h1,.eg h2,.eg h3,.eg .display{font-family:var(--font-display);font-weight:var(--display-weight);letter-spacing:var(--display-track);line-height:1.12;margin:0}
.eg a{color:var(--link)}
.eg .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.eg[data-dir="B"] .lbl{font-family:var(--font-mono);font-weight:500}
.eg[data-dir="C"] .lbl{letter-spacing:.04em;text-transform:none;font-size:12.5px;font-weight:700}
.eg .num{font-family:var(--font-num);font-variant-numeric:tabular-nums lining-nums}

.eg .btn{display:inline-flex;align-items:center;gap:8px;font:600 14px/1 var(--font-body);padding:10px 16px;border-radius:var(--r);background:var(--brand);color:var(--on-brand);border:1px solid var(--brand);cursor:pointer;text-decoration:none;white-space:nowrap}
.eg .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.eg[data-dir="A"] .btn{letter-spacing:.01em}
.eg[data-dir="B"] .btn{font:500 12px/1 var(--font-mono);text-transform:uppercase;letter-spacing:.07em;padding:11px 16px}
.eg[data-dir="B"] .btn.accent{background:var(--accent);border-color:var(--accent);color:#0b0c0e}
.eg[data-dir="C"] .btn{border-radius:999px;padding:11px 20px;font-weight:700;box-shadow:0 2px 0 rgba(42,31,61,.18)}
.eg[data-dir="C"] .btn.ghost{box-shadow:none;border-width:2px;border-color:var(--line-strong)}

.eg .input{font:14px/1.2 var(--font-body);padding:9px 12px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);min-width:0}
.eg .input::placeholder{color:var(--muted)}
.eg[data-dir="B"] .input{font-family:var(--font-mono);font-size:13px}
.eg[data-dir="C"] .input{border-radius:999px;border-width:2px;border-color:var(--line);padding:9px 16px}

.eg table.num-table{border-collapse:collapse;width:100%;font-size:13.5px}
.eg table.num-table th{font-weight:600;color:var(--ink2);text-align:right;padding:6px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
.eg table.num-table td{text-align:right;padding:5px 10px;border-bottom:1px solid var(--line);font-family:var(--font-num);font-variant-numeric:tabular-nums lining-nums;white-space:nowrap}
.eg table.num-table th:first-child,.eg table.num-table td:first-child{text-align:left}
.eg table.num-table td.dim{color:var(--muted)}
.eg[data-dir="A"] table.num-table{border-top:3px double var(--line-strong)}
.eg[data-dir="A"] table.num-table th{font-family:var(--font-display);font-style:italic;font-weight:400;font-size:14px}
.eg[data-dir="B"] table.num-table th{font:500 11px var(--font-mono);text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid var(--line-strong);border-top:2px solid var(--line-strong)}
.eg[data-dir="B"] table.num-table td{font-size:12.5px}
.eg[data-dir="C"] table.num-table th{border-bottom:2px solid var(--line)}
.eg[data-dir="C"] table.num-table td{border-bottom:0}
.eg[data-dir="C"] table.num-table tbody tr:nth-child(odd) td{background:var(--surface2)}
.eg[data-dir="C"] table.num-table tbody td:first-child{border-radius:8px 0 0 8px}
.eg[data-dir="C"] table.num-table tbody td:last-child{border-radius:0 8px 8px 0}

.eg pre.code{margin:0;font:12.5px/1.6 var(--font-mono);background:var(--code-bg);color:var(--code-ink);padding:14px 16px;border-radius:var(--r-lg);overflow:hidden;white-space:pre;tab-size:4}
.eg[data-dir="A"] pre.code{border:1px solid var(--line)}
.eg[data-dir="B"] pre.code{border-left:3px solid var(--line-strong)}
.eg pre.code .k{color:var(--tk-k)}.eg pre.code .s{color:var(--tk-s)}.eg pre.code .c{color:var(--tk-c);font-style:italic}.eg pre.code .n{color:var(--tk-n)}.eg pre.code .f{color:var(--tk-f)}
.eg[data-dir="B"] pre.code .k{font-weight:700}

.eg .callout{padding:12px 14px;border-radius:var(--r-lg);font-size:13.5px;color:var(--ink2);background:var(--surface2)}
.eg .callout b{color:var(--ink)}
.eg[data-dir="A"] .callout{background:transparent;border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);border-radius:0;padding:10px 2px;font-family:var(--font-display);font-size:14.5px}
.eg[data-dir="A"] .callout b:first-child{font-variant:small-caps;letter-spacing:.06em;color:var(--accent-ink)}
.eg[data-dir="B"] .callout{background:transparent;border:1px solid var(--line-strong);padding:0;display:flex}
.eg[data-dir="B"] .callout b:first-child{font:500 11px/1 var(--font-mono);text-transform:uppercase;letter-spacing:.07em;background:var(--accent);color:#0b0c0e;padding:0 10px;display:flex;align-items:center;flex:none}
.eg[data-dir="B"] .callout span{padding:10px 12px;display:block}
.eg[data-dir="C"] .callout{background:color-mix(in srgb,var(--sun,#ffbe3d) 22%,var(--surface));border-radius:16px;padding:12px 16px}

.eg .legend{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);padding:12px 14px;font-size:12.5px;box-shadow:var(--shadow)}
.eg[data-dir="B"] .legend{border-color:var(--line-strong)}
.eg .legend .row{display:flex;align-items:center;gap:8px;padding:2px 0}
.eg .legend .row .num{margin-left:auto;color:var(--ink2);font-size:12px}
.eg .legend .sw{width:11px;height:11px;border-radius:50%;flex:none}
.eg[data-dir="B"] .legend .sw{border-radius:0}
.eg .legend .ramp{display:flex;height:8px;margin:6px 0 3px;border-radius:calc(var(--r)/2);overflow:hidden}
.eg .legend .ramp i{flex:1}
.eg .legend .ends{display:flex;justify-content:space-between;color:var(--muted);font-size:11.5px}

.mock-tag{position:fixed;right:10px;bottom:10px;z-index:99;font:500 11px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;text-transform:uppercase;background:rgba(20,20,20,.78);color:#fff;padding:6px 9px;border-radius:3px;pointer-events:none}
/* on dark surfaces "low" is the dark end */
.eg[data-theme="dark"] .legend .ramp,.eg[data-theme="dark"] .seq{flex-direction:row-reverse}

html,body{margin:0}
body{background:#fff;color:#1c1c1c;font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif}
.jmono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Noto Sans Mono","DejaVu Sans Mono",monospace}
/* --- imitation JupyterLab chrome (neutral, not part of the brand) --- */
.jp-top{height:28px;background:#eee;border-bottom:1px solid #d5d5d5;display:flex;align-items:center;gap:16px;padding:0 12px;font-size:13px;color:#333}
.jp-top .logo{width:16px;height:16px;border-radius:50%;border:2px solid #f37726;border-left-color:transparent;border-right-color:transparent}
.jp-top .mk{margin-left:auto;font-size:11.5px;color:#666}
.jp-top code{background:#ddd;padding:1px 5px;border-radius:3px}
.jp-body{display:grid;grid-template-columns:34px 1fr}
.jp-side{background:#eee;border-right:1px solid #d5d5d5;display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:12px}
.jp-side i{width:16px;height:14px;border:2px solid #777;border-radius:2px;opacity:.7}
.jp-side i:nth-child(2){border-radius:50%}.jp-side i:nth-child(3){height:3px;border-width:0;border-top:2px solid #777;border-bottom:2px solid #777;box-sizing:content-box;padding-top:3px}
.jp-tabs{background:#eee;border-bottom:1px solid #d5d5d5;display:flex;height:30px;align-items:flex-end;padding-left:4px}
.jp-tab{background:#fff;border:1px solid #d5d5d5;border-bottom:0;border-top:2px solid #1976d2;padding:5px 14px;font-size:13px;display:flex;gap:10px;align-items:center}
.jp-tab .nb{width:12px;height:12px;background:#f37726;border-radius:2px}
.jp-tool{height:32px;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;gap:14px;padding:0 14px;color:#555;font-size:13px}
.jp-tool .sep{width:1px;height:16px;background:#ddd}
.jp-tool .kern{margin-left:auto;display:flex;gap:8px;align-items:center}
.jp-tool .kern i{width:10px;height:10px;border:1.5px solid #666;border-radius:50%}
.nb{max-width:1180px;padding:18px 26px 60px 8px}
.cell{display:grid;grid-template-columns:74px 1fr;margin:6px 0;position:relative}
.cell.active:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#1976d2;border-radius:1px}
.prompt{font:13px/1.5 ui-monospace,Menlo,Consolas,"Noto Sans Mono",monospace;color:#616161;text-align:right;padding:6px 8px 0 0;white-space:nowrap}
.in{background:#f5f5f5;border:1px solid #e0e0e0;padding:5px 9px;font:13px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,"Noto Sans Mono","DejaVu Sans Mono",monospace;white-space:pre;border-radius:2px;margin:0}
.in .k{color:#008000;font-weight:700}.in .s{color:#ba2121}.in .n{color:#080}.in .c{color:#408080;font-style:italic}
.out{padding:8px 0 4px 2px;min-width:0}
.md{padding:4px 2px}
.md h1{font-size:24px;margin:6px 0 4px;font-weight:600}.md p{margin:0 0 4px;color:#444;font-size:14px}
pre.txt{margin:0;font:13px/1.42 ui-monospace,"SF Mono",Menlo,Consolas,"Noto Sans Mono","DejaVu Sans Mono",monospace;white-space:pre;color:#1c1c1c;overflow:hidden}
pre.txt .err{color:#b3261e;font-weight:700}
pre.txt .dim{color:#777}
body[data-rich="text"] .rich-html{display:none}
body[data-rich="html"] .rich-text{display:none}
/* --- Everygraph rich outputs (brand-styled) --- */
.eg.o{background:transparent;font-size:13.5px;max-width:940px}
.card{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.eg[data-dir="A"] .card,.eg[data-dir="C"] .card{border-color:var(--line)}
.card>.hd{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface2)}
.card>.hd b{font:var(--display-weight) 15px var(--font-display)}
.card>.hd .meta{margin-left:auto;color:var(--ink2);font-size:12.5px}
.card>.bd{padding:14px}
.big3{display:grid;grid-template-columns:repeat(3,auto);gap:34px;justify-content:start;margin-bottom:14px}
.big3 .v{font:600 22px/1.15 var(--font-num);font-variant-numeric:tabular-nums;display:block}
.big3 .l{color:var(--ink2);font-size:12.5px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:0 34px;border-top:1px solid var(--line);padding-top:10px}
.kv h4{margin:0 0 4px;font-weight:600;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kv .r{display:grid;grid-template-columns:96px 112px 1fr;gap:8px;padding:2.5px 0;font-size:13px;align-items:baseline}
.kv .r .num{text-align:right}
.kv .r span:last-child{color:var(--ink2);font-size:12.5px}
.meter{height:10px;background:var(--surface2);border-radius:calc(var(--r)/2);position:relative;margin:6px 0 4px;border:1px solid var(--line)}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--brand);border-radius:inherit}
.eg[data-dir="B"] .meter i{background:var(--ink)}
.prog{display:grid;grid-template-columns:auto 260px auto;gap:12px;align-items:center;font-size:13px;margin-bottom:10px;color:var(--ink2);justify-content:start}
.prog b{color:var(--ink);font-weight:600}
.prog .meter{margin:0}
.err-card{border-left:4px solid var(--bad)}
.err-card .hd{background:transparent}
.err-card .hd b{color:var(--bad)}
.eg[data-theme="light"] .err-card .hd b{color:#b3261e}
.budget{margin:4px 0 14px;max-width:640px}
.budget .track{position:relative;height:22px;display:flex;gap:2px}
.budget .seg{height:100%;display:flex;align-items:center;padding:0 8px;font-size:12px;color:#fff;white-space:nowrap;overflow:hidden}
.budget .seg.a{background:#b3261e;border-radius:3px 0 0 3px}.budget .seg.b{background:#d9776f;border-radius:0 3px 3px 0}
.budget .mark{position:absolute;top:-6px;bottom:-6px;border-left:2px solid var(--ink)}
.budget .ax{position:relative;height:18px;font-size:12px;color:var(--ink2);margin-top:6px}
.budget .ax span{position:absolute;white-space:nowrap}
.ways{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.way{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.way .t{font-weight:600;margin-bottom:6px;display:flex;gap:8px;align-items:baseline}
.way .t i{font:600 11px var(--font-num);font-style:normal;border:1px solid var(--line-strong);border-radius:var(--r);padding:1px 6px}
.way code,.eg.o code{font:12.5px var(--font-mono);background:var(--code-bg);color:var(--code-ink);padding:2px 6px;border-radius:calc(var(--r)/2)}
.way p{margin:6px 0 0;color:var(--ink2);font-size:12.5px}
.plan table{border-collapse:collapse;width:100%;font-size:13px;margin:10px 0}
.plan th{text-align:left;font-weight:600;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:4px 10px 4px 0;border-bottom:1px solid var(--line-strong)}
.plan td{padding:6px 10px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
.plan td.num,.plan th.num{text-align:right}
.plan td i{font-style:normal;color:var(--muted);margin-right:8px;font-family:var(--font-num)}
.verdict{display:inline-flex;gap:8px;align-items:center;font-weight:600}
.verdict:before{content:"✓";width:18px;height:18px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-size:12px}

<script>
// ---- shared helpers for the brand mockups (inlined by build.py) ----
function egHash(defaults){
  const o=Object.assign({},defaults||{});
  location.hash.replace(/^#/,'').split('&').forEach(kv=>{const[k,v]=kv.split('=');if(k)o[k]=decodeURIComponent(v||'');});
  return o;
}
window.addEventListener('hashchange',()=>location.reload());

// Mark: dir A|B|C, px size. Simplified drawing at <=20 px. Colours come from the
// CSS custom properties of the surrounding .eg scope, so marks follow the theme.
function egMark(dir,size){
  const small=size<=20, a=`width="${size}" height="${size}" viewBox="0 0 32 32" role="img" aria-label="Everygraph mark"`;
  if(dir==='A') return small
    ? `<svg ${a}><circle cx="16" cy="16" r="13.2" fill="none" stroke="var(--brand)" stroke-width="3.6"/><circle cx="13.2" cy="18.6" r="5.6" fill="var(--accent)"/></svg>`
    : `<svg ${a}><circle cx="16" cy="16" r="14" fill="none" stroke="var(--brand)" stroke-width="2"/><circle cx="13" cy="18.6" r="8.4" fill="none" stroke="var(--brand)" stroke-width="2"/><circle cx="11" cy="20.6" r="3.4" fill="var(--accent)"/></svg>`;
  if(dir==='B'){const w=small?4.2:3.2;
    return `<svg ${a}><rect width="32" height="32" fill="var(--ink)"/><path d="M7 7.5 16 25.5 25 7.5" fill="none" stroke="var(--bg)" stroke-width="${w}" stroke-linejoin="miter" stroke-miterlimit="8"/><path d="M10.6 14.8H21.4" stroke="var(--accent)" stroke-width="${w}"/></svg>`;}
  return small
    ? `<svg ${a}><rect width="32" height="32" rx="9" fill="var(--brand)"/><g fill="#fff9f2"><circle cx="5.6" cy="20.8" r="2.2"/><circle cx="12.6" cy="19.2" r="3.8"/><circle cx="22.6" cy="17" r="6"/></g></svg>`
    : `<svg ${a}><circle cx="2.8" cy="21.2" r="2.8" fill="var(--teal,#1f9e8f)"/><circle cx="11.4" cy="19.4" r="4.6" fill="var(--sun,#ffbe3d)"/><circle cx="24.2" cy="16.2" r="7.8" fill="var(--brand)"/></svg>`;
}
// Wordmark as SVG live text (a mockup: the final wordmark would be drawn outlines).
function egWordmarkSVG(dir,h){
  const fs=h*0.82, y=h*0.74;
  let t;
  if(dir==='A') t=`<text x="0" y="${y}" font-size="${fs}" style="font-family:var(--font-display);fill:var(--ink);letter-spacing:-0.01em"><tspan font-style="italic" font-weight="400">every</tspan><tspan font-weight="600" dx="${fs*0.03}">graph</tspan></text>`;
  else if(dir==='B') t=`<text x="0" y="${y}" font-size="${fs*0.86}" style="font-family:var(--font-mono);fill:var(--ink);letter-spacing:-0.04em"><tspan font-weight="400">every</tspan><tspan font-weight="700">graph</tspan></text>`;
  else t=`<text x="0" y="${y}" font-size="${fs}" style="font-family:var(--font-display);fill:var(--ink);letter-spacing:-0.025em" font-weight="800">everygraph</text>`;
  return `<svg class="eg-wm" height="${h}" role="img" aria-label="everygraph" style="overflow:visible">${t}</svg>`;
}
function egLockup(dir,h){
  return `<span class="eg-lockup" style="display:inline-flex;align-items:center;gap:${Math.round(h*0.32)}px;line-height:0">${egMark(dir,Math.round(h*0.92))}${egWordmarkSVG(dir,h)}</span>`;
}
// After insertion: fit every wordmark svg to its text (font metrics differ per machine).
function egFitWordmarks(root){
  (root||document).querySelectorAll('svg.eg-wm').forEach(s=>{
    const b=s.querySelector('text').getBBox(), h=+s.getAttribute('height');
    s.setAttribute('width',Math.ceil(b.width+1)); s.setAttribute('viewBox',`${b.x} 0 ${Math.ceil(b.width+1)} ${h}`);
  });
}
function egFill(root){
  (root||document).querySelectorAll('[data-mark]').forEach(e=>{const d=e.closest('[data-dir]').dataset.dir;e.innerHTML=egMark(d,+e.dataset.mark);});
  (root||document).querySelectorAll('[data-lockup]').forEach(e=>{const d=e.closest('[data-dir]').dataset.dir;e.innerHTML=egLockup(d,+e.dataset.lockup);});
  (root||document).querySelectorAll('[data-wordmark]').forEach(e=>{const d=e.closest('[data-dir]').dataset.dir;e.innerHTML=egWordmarkSVG(d,+e.dataset.wordmark);});
  egFitWordmarks(root);
}

function tableHTML(t){return `<div class="tblwrap"><table class="num-table"><thead><tr>${t.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table><div class="tfoot">${t.foot}</div></div>`;}
function tableText(t){
  const w=t.cols.map((c,i)=>Math.max(c.length,...t.rows.map(r=>r[i].length)));
  const line=(r)=>r.map((v,i)=>i===0?v.padEnd(w[i]):v.padStart(w[i])).join('   ');
  return esc([line(t.cols),w.map(n=>'-'.repeat(n)).join('---'),...t.rows.map(line)].join('\n'))+`\n<span class="dim">${t.foot}</span>`;
}
