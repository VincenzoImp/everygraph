<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Everygraph — viewer design preview (mockup, invented data)</title>
<!--
  DESIGN MOCKUP — NOT PRODUCT CODE.
  Every name, number, address and estimate in this file is invented by a seeded
  generator. Nothing here is a measurement. The file is self-contained (no network,
  no dependencies) and is meant to be thrown away once the real viewer exists.
  All states are addressable through the URL hash; see the "Design options" popover.
-->
</head>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{overflow:hidden;font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
#app{--mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  --panel-w:364px;--pad:16px;--row:30px;--fs:13px;--fs-s:12px;--fs-xs:11px;
  position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-size:var(--fs)}
#app[data-density=compact]{--panel-w:316px;--pad:12px;--row:25px;--fs:12.5px;--fs-s:11.5px;--fs-xs:10.5px}
#app[data-theme=dark]{color-scheme:dark;
  --bg:#0f1113;--surface:#17191c;--surface-2:#1f2226;--surface-3:#282c31;--line:#2c3035;--line-2:#3a3f46;
  --ink:#edece8;--ink-2:#b4b3ac;--ink-3:#83827c;--btn:#edece8;--btn-ink:#121416;--shadow:0 8px 28px rgba(0,0,0,.5);
  --bar:#5d6067;--bar-on:#d9d8d2;--good:#4fb36a;--warn:#e0a63a}
#app[data-theme=light]{color-scheme:light;
  --bg:#f3f2ee;--surface:#ffffff;--surface-2:#f6f5f1;--surface-3:#ecebe6;--line:#deddd6;--line-2:#c9c8c0;
  --ink:#17171a;--ink-2:#55544f;--ink-3:#85847d;--btn:#1b1b1f;--btn-ink:#ffffff;--shadow:0 8px 28px rgba(30,28,20,.16);
  --bar:#bdbcb4;--bar-on:#2a2a2e;--good:#1f8a3f;--warn:#a86b00}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.mono{font-family:var(--mono);font-size:.94em;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--ink-3)}
.sr{position:absolute;left:-9999px}
svg.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* ---------- top bar ---------- */
#top{flex:none;height:52px;display:flex;align-items:center;gap:10px;padding:0 12px 0 14px;background:var(--surface);border-bottom:1px solid var(--line);z-index:5}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 auto}
.brand .logo{width:26px;height:26px;flex:none;color:var(--ink)}
.brand .g{min-width:0;line-height:1.25}
.brand .gname{font-weight:650;font-size:13.5px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.brand .gname .fmt{font-weight:500;color:var(--ink-3);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px}
.brand .gcount{color:var(--ink-2);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .gcount b{font-weight:600;color:var(--ink)}
.topsp{flex:1 1 0;min-width:4px}
.search{position:relative;flex:0 1 340px;min-width:170px}
.search input{width:100%;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);padding:0 34px 0 32px;outline:none}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{border-color:var(--ink-3);background:var(--surface)}
.search>.ico{position:absolute;left:9px;top:8px;color:var(--ink-3);pointer-events:none}
.search>kbd{position:absolute;right:8px;top:7px}
kbd{font:500 10.5px/1 var(--mono);color:var(--ink-3);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:2px 5px;background:var(--surface)}
.tb{height:32px;display:inline-flex;align-items:center;gap:6px;padding:0 9px;border:1px solid transparent;border-radius:8px;background:none;color:var(--ink-2);white-space:nowrap;font-size:12.5px}
.tb:hover{background:var(--surface-2);color:var(--ink)}
.tb[aria-pressed=true],.tb.on{background:var(--surface-3);color:var(--ink)}
.tb b{font-weight:600;color:var(--ink)}
.tb .chev{width:10px;height:10px;opacity:.7}
.tsep{width:1px;height:20px;background:var(--line);flex:none}
.menuwrap{position:relative}
.menu{position:absolute;top:38px;right:0;min-width:270px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:30}
.menu .mi{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px}
.menu .mi:hover{background:var(--surface-2)}
.menu .mi .r{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink-3);margin-top:2px;flex:none}
.menu .mi.on .r{border-color:var(--ink);background:radial-gradient(var(--ink) 0 3.5px,transparent 4px)}
.menu .mi .t{font-weight:600}
.menu .mi .d{color:var(--ink-3);font-size:var(--fs-s)}
.menu h4{margin:6px 10px 4px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

/* search results */
.results{position:absolute;top:38px;left:0;right:0;min-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:30}
.results h4{margin:8px 10px 4px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;display:flex;justify-content:space-between}
.results h4 span{letter-spacing:0;text-transform:none;font-weight:400}
.res{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;padding:6px 10px;border-radius:7px;cursor:pointer}
.res.cur{background:var(--surface-3)}
.res .sw{width:10px;height:10px;border-radius:50%}
.res .sw.sq{border-radius:2px}
.res .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .nm mark{background:none;color:inherit;font-weight:700;text-decoration:underline;text-decoration-color:var(--ink-3);text-underline-offset:3px}
.res .ctx{color:var(--ink-3);font-size:var(--fs-s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .ct{color:var(--ink-2);font-size:var(--fs-s);text-align:right}
.results .foot{display:flex;gap:14px;align-items:center;border-top:1px solid var(--line);margin:6px -6px -6px;padding:8px 14px;color:var(--ink-3);font-size:var(--fs-xs)}
.results .none{padding:14px 12px;color:var(--ink-2)}

/* ---------- stage ---------- */
#stage{position:relative;flex:1 1 0;min-height:0;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map.drag{cursor:grabbing}
#map.pt{cursor:pointer}
#map.pick{cursor:crosshair}
.ov{position:absolute;z-index:3}
#crumbs{left:12px;top:10px;display:flex;align-items:center;gap:8px;max-width:calc(100% - 24px);pointer-events:none}
#crumbs>*{pointer-events:auto}
.crumbbar{display:flex;align-items:center;height:30px;padding:0 4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.crumbbar button{border:0;background:none;height:24px;padding:0 7px;border-radius:5px;color:var(--ink-2);white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.crumbbar button:hover{background:var(--surface-2);color:var(--ink)}
.crumbbar button.cur{color:var(--ink);font-weight:600}
.crumbbar .sep{color:var(--ink-3);font-size:11px}
.level{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--ink-2);font-size:var(--fs-s);white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.level b{color:var(--ink);font-weight:600}
.level .ticks{display:flex;gap:2px;align-items:center}
.level .ticks i{width:9px;height:4px;border-radius:1px;background:var(--line-2)}
.level .ticks i.on{background:var(--ink)}
.level .ticks i.leaf{width:4px;border-radius:50%}
#legend{left:12px;top:50px;width:252px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
#legend h4{margin:0 0 6px;font-size:var(--fs-s);font-weight:600}
#legend .lr{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;padding:2px 0;font-size:var(--fs-s)}
#legend .lr .sw{width:12px;height:12px;border-radius:3px}
#legend .lr .c{color:var(--ink-2)}
#legend .ramp{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin:2px 0 4px}
#legend .ramp i{height:12px;border-radius:2px}
#legend .rl{display:flex;justify-content:space-between;color:var(--ink-2);font-size:var(--fs-xs)}
#legend .note{margin-top:7px;padding-top:7px;border-top:1px solid var(--line);color:var(--ink-3);font-size:var(--fs-xs);line-height:1.4}
#zoomctl{right:12px;bottom:12px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.08);transition:right .18s ease}
#zoomctl button{width:32px;height:32px;border:0;background:none;display:grid;place-items:center;color:var(--ink-2)}
#zoomctl button:hover{background:var(--surface-2);color:var(--ink)}
#zoomctl button+button{border-top:1px solid var(--line)}
#app.panel-open #zoomctl{right:calc(var(--panel-w) + 12px)}
#tooltip{pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 9px;box-shadow:var(--shadow);font-size:var(--fs-s);white-space:nowrap;z-index:6;display:none}
#tooltip .k{color:var(--ink-3)}
#tooltip b{font-weight:600}
#pickbar{left:50%;top:10px;transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);border-radius:8px;padding:7px 8px 7px 14px;display:none;align-items:center;gap:12px;box-shadow:var(--shadow);white-space:nowrap}
#pickbar button{border:0;background:rgba(127,127,127,.25);color:inherit;border-radius:5px;padding:3px 9px}
#toast{left:50%;bottom:18px;transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);border-radius:8px;padding:8px 14px;box-shadow:var(--shadow);display:none;z-index:40}

/* design options: deliberately styled as a tool that is NOT part of the product */
#optbtn{left:12px;bottom:12px;height:30px;padding:0 10px 0 8px;border:1px dashed var(--ink-3);border-radius:15px;background:var(--surface);color:var(--ink-2);display:flex;align-items:center;gap:7px;font-size:var(--fs-s)}
#optbtn:hover{color:var(--ink)}
#optbtn .tag,#optpop .tag{font:600 9.5px/1 var(--mono);letter-spacing:.06em;padding:3px 5px;border-radius:3px;color:var(--surface);background:var(--ink-3)}
#optpop{left:12px;bottom:50px;width:372px;background:var(--surface);border:1px dashed var(--ink-3);border-radius:12px;padding:12px 14px 12px;box-shadow:var(--shadow);display:none;z-index:20}
#optpop h4{margin:0 0 2px;font-size:13px;display:flex;gap:8px;align-items:center}
#optpop p{margin:0 0 10px;color:var(--ink-3);font-size:var(--fs-xs);overflow-wrap:anywhere}
.optrow{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:8px;margin:6px 0}
.optrow>span{color:var(--ink-2);font-size:var(--fs-s)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:5px;height:24px;padding:0 6px;color:var(--ink-2);font-size:var(--fs-s);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line-2)}
#optpop .jump{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
#optpop .jump a{font-size:var(--fs-xs);color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:5px;padding:2px 7px}
#optpop .jump a:hover{color:var(--ink);border-color:var(--ink-3)}

/* ---------- right panel ---------- */
#panel{position:absolute;z-index:4;right:0;top:0;bottom:0;width:var(--panel-w);background:var(--surface);border-left:1px solid var(--line);display:none;flex-direction:column}
#app.panel-open #panel{display:flex}
.p-head{position:relative;padding:14px var(--pad) 12px;border-bottom:1px solid var(--line);flex:none}
.p-kind{display:flex;align-items:center;gap:7px;color:var(--ink-2);font-size:var(--fs-s);margin-bottom:3px;padding-right:28px}
.kg{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--kc,var(--ink-2));flex:none;background:color-mix(in srgb,var(--kc,var(--ink-2)) 18%,transparent)}
.kg.subdivision{border-style:dotted;background:none}
.kg.aggregate,.kg.more{border-style:dashed;background:repeating-linear-gradient(135deg,transparent 0 2px,color-mix(in srgb,var(--kc,var(--ink-2)) 50%,transparent) 2px 3px)}
.kg.address{width:9px;height:9px;border:0;background:var(--kc,var(--ink-2));margin:0 2px}
.p-head h2{margin:0;font-size:18px;line-height:1.25;font-weight:650;letter-spacing:-.01em;padding-right:28px;overflow-wrap:anywhere}
#app[data-density=compact] .p-head h2{font-size:16px}
.p-path{margin-top:4px;color:var(--ink-3);font-size:var(--fs-s);line-height:1.5}
.p-path a{color:var(--ink-2);text-decoration:none;cursor:pointer}
.p-path a:hover{color:var(--ink);text-decoration:underline}
.p-x{position:absolute;right:10px;top:10px;width:28px;height:28px;border:0;border-radius:7px;background:none;color:var(--ink-3);display:grid;place-items:center}
.p-x:hover{background:var(--surface-2);color:var(--ink)}
.p-note{margin-top:9px;padding:8px 10px;border-radius:7px;background:var(--surface-2);color:var(--ink-2);font-size:var(--fs-s);line-height:1.45;border:1px solid var(--line)}
.p-note b{color:var(--ink);font-weight:600}
.p-actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.btn{height:var(--row);display:inline-flex;align-items:center;gap:6px;padding:0 10px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:var(--fs-s);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--btn);color:var(--btn-ink);border-color:var(--btn);font-weight:600}
.btn.pri:hover{opacity:.9}
.btn.on{background:var(--surface-3);border-color:var(--ink-3)}
.btn .ico{width:14px;height:14px}
.btn.lg{height:36px;padding:0 16px;font-size:13px;border-radius:8px}
.p-body{flex:1 1 0;overflow:auto;min-height:0;scrollbar-width:thin}
.sec{padding:13px var(--pad) 14px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 8px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h3 span{letter-spacing:0;text-transform:none;font-weight:400;font-size:var(--fs-xs)}
.stat{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;padding:3px 0}
.stat .k{color:var(--ink-2)}
.stat .v{font-weight:600;text-align:right;font-size:calc(var(--fs) + 1px)}
.stat .s{grid-column:1/-1;display:flex;align-items:center;gap:8px;color:var(--ink-3);font-size:var(--fs-xs);margin-top:-1px}
.stat .s .meter{flex:1}
.meter{height:3px;border-radius:2px;background:var(--surface-3);overflow:hidden;min-width:30px}
.meter i{display:block;height:100%;background:var(--ink-2);border-radius:2px;min-width:1px}
.rows{margin:0 calc(var(--pad) * -1 + 8px)}
.row{display:grid;grid-template-columns:18px 1fr auto;gap:0 6px;align-items:center;padding:4px 8px;border-radius:6px;cursor:pointer;min-height:var(--row)}
.row:hover,.row.hl{background:var(--surface-2)}
.row .rk{color:var(--ink-3);font-size:var(--fs-xs);text-align:right;padding-right:3px}
.row .nm{min-width:0;display:flex;align-items:center;gap:7px}
.row .nm .sw{width:8px;height:8px;border-radius:50%;flex:none}
.row .nm .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm .t small{color:var(--ink-3);font-size:var(--fs-xs)}
.row .w{font-weight:600;text-align:right;font-size:var(--fs-s)}
.row .bar{grid-column:2/4;height:2px;background:var(--surface-3);border-radius:1px;margin-top:2px}
.row .bar i{display:block;height:100%;background:var(--ink-3);border-radius:1px;min-width:1px}
#app[data-density=compact] .row .bar{display:none}
.row.agg .nm .t{font-style:italic;color:var(--ink-2)}
.shown{display:flex;justify-content:space-between;align-items:center;margin-top:8px;color:var(--ink-3);font-size:var(--fs-s)}
.shown a,.lnk{color:var(--ink);text-decoration:underline;text-decoration-color:var(--ink-3);text-underline-offset:3px;cursor:pointer}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;text-align:right;overflow-wrap:anywhere}
.addr-full{font-family:var(--mono);font-size:11.5px;line-height:1.5;word-break:break-all;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:flex;gap:8px;align-items:flex-start;margin-top:8px}
.addr-full span{flex:1}
.addr-full button{border:0;background:none;color:var(--ink-3);padding:1px}
.addr-full button:hover{color:var(--ink)}
.dropdown{position:relative}
.dropdown .dd{position:absolute;top:calc(var(--row) + 4px);right:0;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:4px;z-index:10;display:none}
.dropdown.open .dd{display:block}
.dd button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 9px;border-radius:5px;font-size:var(--fs-s)}
.dd button:hover{background:var(--surface-2)}

/* path */
.ends{display:grid;grid-template-columns:22px 1fr 24px;gap:6px 8px;align-items:center}
.ends .mk,.hop .mk{width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--surface);font:700 10.5px/20px system-ui,sans-serif;text-align:center}
.ends .slot{height:var(--row);border:1px solid var(--line-2);border-radius:7px;padding:0 9px;display:flex;align-items:center;gap:7px;min-width:0;background:var(--surface)}
.ends .slot.empty{border-style:dashed;color:var(--ink-3)}
.ends .slot small{color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ends .slot>span{white-space:nowrap;flex:none}
.ends .ib{width:24px;height:24px;border:0;background:none;color:var(--ink-3);border-radius:5px;display:grid;place-items:center}
.ends .ib:hover{background:var(--surface-2);color:var(--ink)}
.toggle{display:flex;gap:10px;align-items:flex-start;margin-top:12px;cursor:pointer}
.toggle .sw{flex:none;width:30px;height:18px;border-radius:9px;background:var(--line-2);position:relative;margin-top:1px;transition:background .12s}
.toggle .sw::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:left .12s}
.toggle.on .sw{background:var(--ink)}
.toggle.on .sw::after{left:14px}
.toggle b{font-weight:600}
.toggle small{display:block;color:var(--ink-3);font-size:var(--fs-xs);line-height:1.4}
.pathsum{display:flex;gap:18px;margin-bottom:10px}
.pathsum div{line-height:1.25}
.pathsum b{display:block;font-size:17px;font-weight:650}
.pathsum span{color:var(--ink-3);font-size:var(--fs-xs)}
.hop{display:grid;grid-template-columns:20px 1fr;gap:0 10px;cursor:pointer}
.hop .line{grid-row:2;justify-self:center;width:2px;background:var(--line-2);min-height:34px}
.hop .who{padding:1px 0 0;min-width:0}
.hop .who .a{font-weight:600}
.hop .who .c{color:var(--ink-3);font-size:var(--fs-s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hop .who .hubtag{font:600 9.5px/1 system-ui;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--warn);color:var(--warn);border-radius:3px;padding:1px 4px;margin-left:6px;vertical-align:1px}
.hop .tx{grid-column:2;padding:5px 0 9px;color:var(--ink-2);font-size:var(--fs-s);display:flex;justify-content:space-between;gap:10px}
.hop .tx b{color:var(--ink);font-weight:600}
.hop:hover .who .a{text-decoration:underline;text-underline-offset:3px}

/* about */

document.addEventListener('mouseover', e => { const el = e.target.closest && e.target.closest('[data-hl]'); const id = el ? el.dataset.hl : null; if (id !== hlId) { hlId = id; invalidate(); } });

  if (e.key === 'Escape') { if (on('share')) set({ share: '0' }); else if (state.q) { set({ q: '' }); $('#q').value = ''; } else if (on('menu') || on('options')) set({ menu: '0', options: '0' }); else if (panelOpen()) ACT.clear(); if (typing) document.activeElement.blur(); return; }

/* ---------- map pointer input ---------- */
const ptrs = new Map(); let drag = null, pinch = null;
const tip = $('#tooltip');
function showTip(n, x, y) {

  tip.innerHTML = '<b' + (n.kind === 'address' ? ' class="mono"' : '') + '>' + esc(title(n)) + '</b><br><span class="k">' + kindText(n) + (n.kind === 'address' ? '' : ' · </span><span class="num">' + fmt(n.n) + ' addresses') + '</span>';
  tip.style.display = 'block'; const w = tip.offsetWidth, fr = freeRect(); tip.style.left = clamp(x + 14, 4, fr.x1 - w - 6) + 'px'; tip.style.top = clamp(y + 16, 4, H - 50) + 'px';

cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.offsetX, e.offsetY]); showTip(null);

  }

cv.addEventListener('dblclick', e => { const n = hitTest(e.offsetX, e.offsetY); if (n && n.kind !== 'address' && n.kind !== 'more') flyTo(fitView(n, 1.12)); else if (n) flyTo(fitView(n.parent, 1.5)); else zoomAt(e.offsetX, e.offsetY, 2.4, true); });
cv.addEventListener('wheel', e => { e.preventDefault(); const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY; zoomAt(e.offsetX, e.offsetY, Math.exp(-dy * (e.ctrlKey ? .012 : .0022)), true); showTip(null); }, { passive: false });
window.addEventListener('resize', resize);

/* ---------- boot ---------- */
renderTop();
Object.assign(state, parseHash());
sync(); resize(); positionFromState(); booted = true; lastHash = location.hash.replace(/^#/, '');
if (state.screen === 'progress' && state.p === '') startProgress();
window.EG = { bootMs: 0, firstDrawMs: 0, pairsOf, extOf, state, root, nodeById, expand, descend, linksOf, topMembers, cutOf, items, dots, find: s => INDEX.filter(n => n.name.toLowerCase().includes(s.toLowerCase())).map(n => n.id + '  ' + chain(n).slice(1).map(shortTitle).join(' › ') + '  ' + fmt(n.n)), view, stat };
EG.bootMs = Math.round(performance.now() - T_BOOT);   // debugging handle only: EG.find('lending') lists ids usable in the URL (select=, at=, path=)
